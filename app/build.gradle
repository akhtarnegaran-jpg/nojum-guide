plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.astrohub.guide'
    compileSdk 34

    defaultConfig {
        applicationId 'ir.astrohub.guide'
        minSdk 23
        targetSdk 34
        versionCode 6
        versionName '2.3'
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'nojum1405guide'
            keyAlias 'nojumguide'
            keyPassword 'nojum1405guide'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
