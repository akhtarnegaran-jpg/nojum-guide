<script>window.GUIDE={"general": "<p class=\"gh\" style=\"text-align:center\">به نام خداوند جان و خرد &nbsp;&nbsp; کزین برتر اندیشه برنگذرد</p><p class=\"gh\" style=\"text-align:center\"><strong>«علم، پیشرفت علمی و فراگیری، نیاز اول کشور ماست.»</strong></p><p style=\"text-align:center\">رهبر شهید انقلاب اسلامی، حضرت آیت ا... سید علی خامنه‌ای</p><p class=\"gh\"><strong>الف ـ مقدمه:</strong></p><p>آسمان شب، همواره یکی از نخستین کلاس‌های درس بشر بوده است؛ جایی که پرسش از «کجای جهان ایستاده‌ایم؟» به تولد علم، فناوری و تخیل انجامیده است. نجوم، فراتر از مشاهده ستارگان، دانشی است که انسان را به اندیشیدن، اندازه‌گیری، تحلیل و ساخت ابزارهای نو برای فهم کیهان فرا می‌خواند. امروز این مسیر، در پیوندی جدی با فناوری‌های فضایی ادامه یافته است؛ فناوری‌هایی که از ماهواره‌های کوچک مکعبی تا مأموریت‌های بزرگ فضایی، نقش مهمی در زندگی معاصر و آینده بشر دارند. </p><p>مسابقات «نجوم و فناوری‌های فضایی» با چنین نگاهی طراحی شده است؛ نگاهی که دانش‌آموز را به‌مثابه یک کاوشگر علمی می‌بیند. این مسابقات فرصتی است برای تجربه مسیر یادگیری در نجوم، پژوهش، رصد، طراحی، مدل‌سازی و ایده‌پردازی فناورانه؛ مسیری که در آن مشاهده آسمان، طرح یک پرسش علمی، یا ساخت یک سامانه ساده فضایی، همگی ارزشمند و معنادارند. </p><p>برگزاری این مسابقات در چارچوب هشتمین جشنواره علمی‌پژوهشی پژوهش‌سراهای دانش‌آموزی کشور، با هدف تقویت سواد نجومی، آشنایی با فناوری‌های فضایی، پرورش تفکر پژوهشی و ایجاد پیوند میان علم و عمل صورت می‌گیرد. در این مسیر، آنچه اهمیت دارد فرآیند یادگیری، تجربه کار گروهی و شکل‌گیری نگاه علمی به جهان پیرامون است.</p><p class=\"gh\"><strong>ب ـ اهداف:</strong></p><p>۱- <strong>تقویت سواد نجومی و فضایی دانش‌آموزان</strong> از طریق تجربه مستقیم مشاهده، پژوهش، تحلیل و کار با مفاهیم و ابزارهای مرتبط با نجوم و فناوری‌های فضایی.</p><p>۲- <strong>ایجاد فرصت برای آشنایی فعال دانش‌آموزان با دستاوردهای نوین نجومی و فناوری‌های</strong> <strong>فضایی</strong> و درک نقش این فناوری‌ها در زندگی امروز و آینده جوامع.</p><p>۳- <strong>پرورش روحیه کاوشگری، تفکر علمی و حل مسئله</strong> در دانش‌آموزان از طریق مشارکت در فعالیت‌های پژوهشی، رصدی، طراحی، مدل‌سازی و ایده‌پردازی.</p><p>۴- <strong>شناسایی و هدایت استعدادها و خلاقیت‌های دانش‌آموزان</strong> در حوزه‌های نجوم، فناوری‌های فضایی و گرایش‌های میان‌رشته‌ای.</p><p>۵- <strong>تقویت تجربه کار گروهی، ارائه علمی و ارتباط مؤثر</strong> در فرآیند انجام پروژه‌ها و حضور در رویدادهای علمی و پژوهشی مرتبط با نجوم و فناوری‌های فضایی.</p><p>۶- فراهم کردن مسیر رشدی پیوسته برای دانش‌آموزان، از کاوشگری و دانش‌افزایی تا مهارت‌ورزی، پژوهشگری، نوآوری و کارآفرینی، در دوره‌های متوالی جشنواره.</p><p class=\"gh\"><strong>پ ـ معرفی مسابقات و شرایط شرکت‌کنندگان مسابقات:</strong></p><p>۱. این مسابقات در سه مرحله منطقه‌ای، استانی و کشوری؛ به‌صورت حضوری و غیرحضوری بر اساس شرایط و صلاحدید، مطابق تقویم اجرایی (پیوست الف) مندرج در شیوه‌نامه اجرایی هشتمین جشنواره علمی‌پژوهشی و نمایشگاه دستاوردهای پژوهش‌سراهای دانش‌آموزی (بخشنامه شماره ۴۳۳/۴۰۰ مورخ ۱۴۰۵/۰۸/۲۶ معاونت محترم آموزش متوسطه وزارت آموزش و پرورش) و با گرایش‌های مبتنی بر کاوشگری، دانش‌افزایی، مهارت‌ورزی، پژوهشگری، نوآوری و کارآفرینی (مطابق «مسیر رشد دانش‌آموز» که در ادامه همین بخش آمده است) برگزار می‌گردد.</p><p>۲. ثبت‌نام شرکت‌کنندگان این دوره از مسابقات، از طریق پنل کاربری دانش‌آموزان در سامانه سها به آدرس https://my.medu.ir و بر اساس تقویم اجرایی (پیوست الف) شیوه‌نامه اجرایی هشتمین دوره جشنواره علمی‌پژوهشی و نمایشگاه دستاوردهای پژوهش‌سراهای دانش‌آموزی انجام می‌گیرد.</p><p>۳. مرحله منطقه‌ای مسابقات وفق بند ۵ فصل‌های ۱ تا ۸ (بخش دوم) این شیوه‌نامه، توسط پژوهش‌سرای دانش‌آموزی منطقه و با نظارت معاونت آموزش متوسطه منطقه<strong> </strong>و بر اساس نمون‌برگ‌های داوری مندرج در بند ۶ هر فصل و سهمیه تعیین‌شده در جدول ذیل، برگزار می‌گردد.</p><p>۴. مرحله استانی مسابقات وفق بند ۵ فصل‌های ۱ تا ۸ (بخش دوم) این شیوه‌نامه، توسط قطب‌های استانی و با نظارت کارشناس نظارت و پیگیری امور پژوهش سراهای دانشآموزی استان<strong> </strong>و بر اساس نمون‌برگ‌های داوری مندرج در بند ۶ هر فصل و سهمیه تعیین‌شده در جدول ذیل، برگزار می‌گردد.</p><p>۵. مرحله کشوری مسابقات وفق بند ۵ فصل‌های ۱ تا ۸ (بخش دوم) این شیوه‌نامه، توسط قطب کشوری، مطابق با نمون‌برگ‌های داوری مندرج در بند ۶ هر فصل و در صورت تامین اعتبارات لازم برگزار می‌گردد.</p><p class=\"gh\"><strong>سفر یادگیری آسمان‌نما:</strong></p><p>به‌منظور آمادگی علمی دانش‌آموزان و آشنایی آنان با مفاهیم پایه هر گرایش، «سفر یادگیری» ویژه هر یک از هشت گرایش مسابقات در برنامه «آسمان‌نما» طراحی شده است. هر سفر از چند مرحله آموزشی تشکیل شده و در پایان هر مرحله پرسش‌هایی مطرح می‌شود که بیشتر آن‌ها علمی و مفهومی‌اند و در برخی گرایش‌ها، دانش عمومی لازم درباره مهارت‌های فنی، پژوهشی یا کارآفرینی را نیز می‌سنجند. محتوای هر سفر بر پایه کتابچه راهنمای همان گرایش تهیه شده است.</p><p>برنامه آسمان‌نما و کتابچه راهنمای هر گرایش از طریق کانال رسمی قطب کشوری نجوم و فناوری‌های فضایی در پیام‌رسان شاد به نشانی astrospace@ در اختیار دانش‌آموزان قرار می‌گیرد. استفاده از این کتابچه‌ها، برنامه و شرکت در سفر یادگیری رایگان است و تکرار مراحل محدودیتی ندارد.</p><p>شرکت در سفر یادگیری الزامی نیست. دانش‌آموز می‌تواند سفر یادگیری گرایش خود را تا هر مرحله که بخواهد طی کند و کارنامه آن را به‌صورت تصویر (PNG) دریافت نماید. در کارنامه، مشخصات دانش‌آموز، مراحل طی‌شده، نمره کسب‌شده از ۱۰ و یک کد QR درج می‌شود که مشخصات دانش‌آموز و نمره او را برای راستی‌آزمایی در خود دارد.</p><p>نمره کارنامه سفر یادگیری گرایش، به‌عنوان ردیف «سفر یادگیری آسمان‌نما» در نمون‌برگ داوری هر گرایش، حداکثر ۱۰ امتیاز از ۱۰۰ امتیاز اثر را تشکیل می‌دهد و عیناً در فرم داوری لحاظ می‌شود. کارنامه سفر یادگیری در زمره مستندات اثر ارسال می‌گردد.</p><p>کارنامه باید مربوط به سفر یادگیری همان گرایشی باشد که اثر در آن ارسال شده است؛ برای نمونه، تیم گرایش «مأموریت فضایی» کارنامه سفر یادگیری مأموریت فضایی را ارائه می‌کند.</p><p>تبصره ۱: <strong>در آثار تیمی، امتیاز ردیف سفر یادگیری برابر میانگین نمره کارنامه اعضای تیم است و نمره عضوی که کارنامه ارائه نکرده، صفر در نظر گرفته می‌شود.</strong></p><p>تبصره ۲: <strong>عدم ارائه کارنامه مانع بررسی و داوری اثر نیست و تنها امتیاز ردیف سفر یادگیری صفر منظور می‌شود.</strong></p><p>تبصره ۳: <strong>داوران با اسکن کد QR کارنامه در بخش «راستی‌آزمایی» </strong><strong>برنامه آ</strong><strong>سمان‌نما، اصالت کارنامه و نمره آن را بررسی می‌کنند. ارائه کارنامه مخدوش یا ساختگی موجب حذف اثر از داوری می‌شود.</strong></p><div class=\"tbl wide\"><table><tr><td><p>ردیف</p></td><td><p>گرایش مسابقه</p></td><td><p>فردی /گروهی</p></td><td><p>دوره دوم ابتدایی</p></td><td><p>دوره اول متوسطه</p></td><td><p>دوره دوم متوسطه نظری</p></td><td><p>دوره دوم متوسطه فنی و حرفه‌ای و کاردانش</p></td><td><p>راهنما</p></td></tr><tr><td><p>۱</p></td><td><p><strong>کاوشگران کوچک آسمان</strong></p></td><td><p>انفرادی یا تیم ۲ نفره</p></td><td><p><strong>۳</strong></p></td><td colspan=\"3\"><p><strong>-</strong></p></td><td><p><strong>فصل ۱</strong></p></td></tr><tr><td><p>۲</p></td><td><p><strong>بازنمایی خلاق مفاهیم نجوم</strong></p></td><td><p>انفرادی یا تیم ۲ نفره</p></td><td><p><strong>۳</strong></p></td><td colspan=\"3\"><p><strong>-</strong></p></td><td><p><strong>فصل ۲</strong></p></td></tr><tr><td><p>۳</p></td><td><p><strong>انجمن علمی‌پژوهشی نجوم</strong></p></td><td><p>الزاماً تیم ۳ نفره</p></td><td><p>-</p></td><td><p><strong>۳</strong></p></td><td><p><strong>-</strong></p></td><td><p><strong>-</strong></p></td><td><p><strong>فصل ۳</strong></p></td></tr><tr><td><p>۴</p></td><td><p><strong>مأموریت فضایی</strong></p></td><td><p>تیم ۲ یا ۳ نفره</p></td><td><p><strong>-</strong></p></td><td colspan=\"3\"><p><strong>۳</strong></p></td><td><p><strong>فصل ۴</strong></p></td></tr><tr><td><p>۵</p></td><td><p><strong>نجوم رصدی و ریاضیات نجومی</strong></p></td><td><p>تیم ۲ یا ۳ نفره</p></td><td><p>-</p></td><td colspan=\"3\"><p><strong>۳</strong></p></td><td><p><strong>فصل ۵</strong></p></td></tr><tr><td><p>۶</p></td><td><p><strong>پژوهش و تحلیل داده‌های نجومی</strong></p></td><td><p>انفرادی یا تیم ۲ یا ۳ نفره</p></td><td><p>-</p></td><td colspan=\"3\"><p><strong>۳</strong></p></td><td><p><strong>فصل ۶</strong></p></td></tr><tr><td><p>۷</p></td><td><p><strong>ماهواره مکعبی</strong></p></td><td><p>تیم ۲ یا ۳ نفره</p></td><td><p><strong>-</strong></p></td><td colspan=\"3\"><p><strong>۳</strong></p></td><td><p><strong>فصل ۷</strong></p></td></tr><tr><td><p>۸</p></td><td><p><strong>کارآفرینی دانش‌بنیان نجومی و فناوری‌های فضایی</strong></p></td><td><p>تیم ۲ یا ۳ نفره</p></td><td><p><strong>-</strong></p></td><td colspan=\"3\"><p><strong>۳</strong></p></td><td><p><strong>فصل ۸</strong></p></td></tr></table></div><p class=\"gh\"><strong>مسیر رشد دانش‌آموز در گرایش‌های مسابقات:</strong></p><p>گرایش‌های هشت‌گانه مسابقات نجوم و فناوری‌های فضایی بر اساس یک مسیر رشد طراحی و مرتب شده‌اند. این مسیر همان رویکردهای «کاوشگری، دانش‌افزایی، مهارت‌ورزی، پژوهشگری، نوآوری و کارآفرینی» است که جشنواره بر آن‌ها بنا شده است. دانش‌آموز در این مسیر گام‌به‌گام از کشف پدیده‌ها با مشاهده مستقیم، به فهم علمی آن‌ها، تسلط بر مهارت‌ها، انجام پژوهش، طراحی راه‌حل‌های نو و در نهایت خلق ارزش برای دیگران می‌رسد. جدول زیر گام‌های این مسیر و گرایش‌های مربوط به هر گام را در هر دوره تحصیلی نشان می‌دهد.</p><div class=\"tbl wide\"><table><tr><td><p><strong>گام مسیر رشد</strong></p></td><td><p><strong>تعریف</strong></p></td><td><p><strong>دوره دوم ابتدایی</strong></p></td><td><p><strong>دوره متوسطه</strong></p></td></tr><tr><td><p><strong>۱. کاوشگری</strong></p></td><td><p>یافتن پاسخ یک پرسش ساده از راه مشاهده و تجربه مستقیم، با هدایت مربی و بدون نیاز به دانش تخصصی پیشین</p></td><td><p>کاوشگران کوچک آسمان (فصل ۱)</p></td><td><p>انجمن علمی‌پژوهشی نجوم، ویژه دوره اول متوسطه (فصل ۳)</p></td></tr><tr><td><p><strong>۲. دانش‌افزایی</strong></p></td><td><p>آموختن درست مفاهیم علمی و توانایی توضیح آن‌ها به زبان خود برای دیگران</p></td><td><p>بازنمایی خلاق مفاهیم نجوم (فصل ۲)</p></td><td><p>انجمن علمی‌پژوهشی نجوم، ویژه دوره اول متوسطه (فصل ۳)</p></td></tr><tr><td><p><strong>۳. مهارت‌ورزی</strong></p></td><td><p>تسلط بر ساخت، آزمون، کار با ابزار و اندازه‌گیری</p></td><td><p>بازنمایی خلاق مفاهیم نجوم: ساخت ابزار کمک‌آموزشی، اختیاری (فصل ۲)</p></td><td><p>مأموریت فضایی (فصل ۴)؛ نجوم رصدی و ریاضیات نجومی (فصل ۵)</p></td></tr><tr><td><p><strong>۴. پژوهشگری</strong></p></td><td><p>طرح پرسش علمی، کار با داده واقعی، تحلیل و تفسیر نتایج و مقایسه آن‌ها با یافته‌های علمی؛ شکل پیشرفته و مستقل کاوشگری</p></td><td><p>—</p></td><td><p>پژوهش و تحلیل داده‌های نجومی (فصل ۶)؛ نجوم رصدی و ریاضیات نجومی (فصل ۵)</p></td></tr><tr><td><p><strong>۵. نوآوری</strong></p></td><td><p>تعریف یک مأموریت و طراحی و یکپارچه‌سازی یک سامانه کامل برای تحقق آن</p></td><td><p>—</p></td><td><p>ماهواره مکعبی (فصل ۷)</p></td></tr><tr><td><p><strong>۶. کارآفرینی و ارزش‌آفرینی</strong></p></td><td><p>شناخت نیاز یک کاربر واقعی و تبدیل دانش نجوم به محصولی دقیق، ایمن و ارزشمند</p></td><td><p>—</p></td><td><p>کارآفرینی دانش‌بنیان نجومی و فناوری‌های فضایی (فصل ۸)</p></td></tr></table></div><p>این مسیر در دوره دوم ابتدایی و دوره اول متوسطه از کاوشگری آغاز می‌شود و در سطحی بالاتر ادامه می‌یابد. دانش‌آموزان دوره دوم ابتدایی در گرایش «کاوشگران کوچک آسمان» با طرح پرسش و مشاهده منظم آسمان به کشف پدیده‌ها می‌پردازند و در گرایش «بازنمایی خلاق مفاهیم نجوم» توضیح علمی پدیده‌ها را می‌آموزند و برای دیگران بازگو می‌کنند و با ساخت ابزارهای کمک‌آموزشی، نخستین تجربه مهارت‌ورزی را به دست می‌آورند. در دوره اول متوسطه، گرایش «انجمن علمی‌پژوهشی نجوم» که ویژه همین دوره است، با برنامه‌های رصد، پروژه‌های گروهی و آموزش همسالان، کاوشگری و دانش‌افزایی را در قالب کار گروهی دنبال می‌کند و مسیر با گرایش‌های مهارت‌ورزی، پژوهشگری، نوآوری و کارآفرینی ادامه می‌یابد. دانش‌آموزان دوره دوم متوسطه (نظری، فنی و حرفه‌ای و کاردانش) مسیر را از گام مهارت‌ورزی و با همین گرایش‌ها دنبال می‌کنند. گرایش «نجوم رصدی و ریاضیات نجومی» با افزودن محاسبه و تحلیل خطا به اندازه‌گیری، پلی میان مهارت‌ورزی و پژوهشگری است. گامی که برای هر گرایش آمده، تأکید اصلی آن را نشان می‌دهد؛ در عمل همه گرایش‌ها کمابیش دانش، مهارت و کاوش را با هم درگیر می‌کنند و گام‌های این مسیر، مرزهایی جدا از هم نیستند.</p><p>این مسیر، مسیری پیشنهادی برای رشد دانش‌آموز است و شرکت در هر گرایش به شرکت در گرایش‌های گام‌های پیشین وابسته نیست؛ با این حال، شایسته است مربیان و پژوهش‌سراها دانش‌آموزان را تشویق کنند که در دوره‌های متوالی جشنواره، با توجه به توانایی و علاقه خود، از گام‌های آغازین به گام‌های بالاتر حرکت کنند. ترتیب ردیف‌های جدول گرایش‌های مسابقات در همین بند و ترتیب فصل‌های بخش دوم این شیوه‌نامه نیز بر همین اساس است.</p><p>این مسیر با الهام از پیوستار سطوح کاوشگری (Banchi &amp; Bell, 2008)، طبقه‌بندی بازنگری‌شده اهداف آموزشی بلوم (Anderson &amp; Krathwohl, 2001)، چارچوب آموزش علوم K-12 (National Research Council, 2012) و چارچوب شایستگی کارآفرینی اتحادیه اروپا، EntreComp (Bacigalupo et al., 2016)، و متناسب با ساحت علمی و فناورانه سند تحول بنیادین آموزش و پرورش طراحی شده است.</p><p class=\"gh\"><strong>ت ـ شرایط عمومی مسابقات:</strong></p><p>۱. هر تیم به‌شرط ارائه آثار متفاوت، مجاز به شرکت در بیش از یک گرایش از مسابقات می‌باشد. </p><p>۲. اعضای تیم شرکت‌کننده در مسابقات متعهد می‌شوند که یک اثر مشخص را تنها در یکی از مسابقات هشتمین دوره جشنواره علمی – پژوهشی شرکت دهند. همچنین از ارسال اثری که در سنوات قبل موفق به کسب رتبه استانی یا کشوری در مسابقات جشنواره علمی - پژوهشی و جشنواره نوجوان خوارزمی و ... شده‌اند، خودداری شود. در صورت عدم رعایت، اثر مربوطه از فرآیند داوری مسابقات حذف می‌شود و مورد ارزیابی قرار نمی‌گیرد.</p><p>۳. با عنایت به ماهیت ترویج کارگروهی در مسابقات، مقتضی است تمامی اعضای تیم در کل فرایند مسابقه شرکت نموده و بر نحوة انجام کار و ارائه مطالب علمی مربوطه، تسلط کامل داشته باشند؛ لذا عدم رعایت این موضوع، موجب کسر نمره برای تیم می‌شود.</p><p>۴. رعایت پوشش و لباس دانش‌آموزان دختر و پسر شرکت‌کننده در جشنواره وفق ماده ۸۵ و تبصره آن در آیین‌نامه اجرایی مدارس، ضروری است.</p><p>۵. دوره‌ها و کارگاه‌های آموزشی رایگان به تفکیک گرایش، توسط قطب کشوری نجوم و فناوری‌های فضایی اعلام و برگزار می‌گردد. این آموزش‌ها از طریق کانال اطلاع‌رسانی قطب کشوری نجوم و فناوری‌های فضایی در پیام‌رسان شاد به آدرس<strong> </strong>@astrospace قابل‌پیگیری است.</p><p>۶. در داوری مرحله استانی مسابقات؛ قطب کشوری نجوم و فناوری‌های فضایی با هماهنگی کارشناس نظارت و پیگیری امور پژوهش‌سراهای دانش‌آموزی استان، به‌عنوان ناظر بر روند اجرای برخی از گرایش‌ها نظارت می‌نماید. نمون‌برگ نظارت بر داوری در پیوست ب (بخش سوم) آمده است.</p><p>۷. شرکت در مسابقه به منزله موافقت و رضایت اعضای تیم نسبت به هرگونه بهره‌برداری معاونت آموزش متوسطه وزارت از آثار شرکت‌کنندگان و نشر آنها با ذکر نام تولیدکنندگان آثار، می‌باشد.</p><p>۸. به استناد تبصره ماده ۱۰۴ آیین‌نامه اجرایی مدارس (مصوب جلسه ۴۱ کمیسیون معین شورای عالی آموزش و پرورش تاریخ ۱۰ / ۰۵ / ۱۴۰۰)، عضویت و فعالیت دانش‌آموزان در پژوهش‌سراهای دانش‌آموزی و حضور مؤثر آنان در مرحله استانی و کشوری جشنواره علمی‌پژوهشی و ارائه اثر با تأیید معلم مربوطه، می‌تواند در تعیین نمره ارزشیابی مستمر نوبت‌های اول و دوم سهم داشته باشد.</p><p>۹. برگزیدگان مسابقات در سطح منطقه‌ای، استانی و کشوری، بر اساس مصوبات دبیرخانه برنامه‌ریزی و اجرایی‌سازی جشنواره در سطح منطقه، استان و کشور، مورد تقدیر قرار می‌گیرند.</p><p>۱۰. برگزیدگان کشوری منتخب، در مراسم اختتامیه جشنواره و نمایشگاه دستاوردهای علمی‌پژوهشی که توسط وزارت آموزش و پرورش برگزار می‌شود، شرکت و مورد تقدیر قرار می‌گیرند (ردیف ۱۵ تقویم اجرایی (پیوست الف)).</p><p>۱۱. قطب‌ استانی باید نمایشگاه آثار منتخب دانش‌آموزان را برگزار نماید.</p><p>۱۲. جهت کسب اطلاع از آخرین اخبار و تغییرات احتمالی در روند اجرای مسابقات و استفاده از محتواهای آموزشی، می‌توانید به پرتال کشوری پژوهش‌سراهای دانش‌آموزی به آدرس https://src.medu.gov.ir، سامانه جشنواره https://my.medu.ir   کانال رسمی پژوهش‌سراهای دانش‌آموزی در شبکه ملی شاد pajouheshsara@؛ کانال جشنواره علمی‌پژوهشی در شبکه ملی شاد srcfestival@ و کانال قطب کشوری نجوم و فناوری‌های فضایی در شبکه شاد  به آدرس @astrospace مراجعه و یا با شماره‌تلفن قطب کشوری  نجوم و فناوری‌های فضایی ۳۶۲۲۶۴۴۶-۰۵۱ تماس حاصل نمایید.</p><p class=\"gh\"><strong>ظرفیت‌ها و مشوق‌های مشارکت:</strong></p><p>مطابق بند «ث» شیوه‌نامه اجرایی جشنواره، ظرفیت‌ها و مشوق‌های مشارکت دانش‌آموزان در مسابقات به شرح زیر است:</p><p>۱- استفاده از امکانات آزمایشگاهی و کارگاهی، کتابخانه و منابع اطلاعاتی، کارگاه‌ها و همایش‌های آموزشی و پژوهشی پژوهش‌سراهای دانش‌آموزی.</p><p>۲- امکان تخصیص بخشی از نمره مستمر دانش‌آموزان در دروس، با توجه به محورهای علمی جشنواره.</p><p>۳- برخورداری از مزایای ثبت‌نام در دانشگاه فرهنگیان.</p><p>۴- استفاده از پژوهانه و سایر اعتبارات خدمات آزمایشگاهی از طریق نهادهای علمی و دانشگاهی و معاونت علمی ریاست‌جمهوری.</p><p>۵- تقدیر و تجلیل از برگزیدگان هر مرحله توسط پژوهش‌سراهای دانش‌آموزی و ادارات آموزش و پرورش مربوط.</p><p>۶- دریافت تأییدیه‌های علمی از قطب‌های استانی و کشوری.</p><p class=\"gh\"><strong>گواهی‌نامه و تقدیرنامه همکاران و معلمان راهنما:</strong></p><p>مطابق بند «ج» شیوه‌نامه اجرایی، به‌منظور ارج نهادن به مشارکت و تلاش همه همکاران و عوامل اجرایی در تمام دوره‌های تحصیلی، که به‌صورت داوطلبانه و در چارچوب مسئولیت‌های محوله در برنامه‌ریزی، هماهنگی، اجرا، داوری، پشتیبانی، نظارت، مستندسازی و سایر فعالیت‌های مرتبط با جشنواره همکاری می‌نمایند، حسب نوع و میزان همکاری، گواهی‌نامه فعالیت و همکاری صادر می‌شود:</p><p>۱- گواهی‌نامه و تقدیرنامه باید مبتنی بر سوابق و مستندات فعالیت انجام‌شده، پس از احراز انجام فعالیت و با درخواست و تأیید رسمی مسئول مربوط در سطح اجرایی جشنواره صادر خواهد شد. بدیهی است صدور گواهی‌نامه برای فعالیت‌های فاقد سابقه یا مستندات قابل احراز، مجاز نیست.</p><p>۲- نوع همکاری می‌تواند حسب مورد، شامل عضویت در کمیته‌ها و کارگروه‌های مصوب، مشارکت در فعالیت‌های اجرایی، علمی، داوری، پشتیبانی، هماهنگی، مستندسازی و سایر فعالیت‌های مورد تأیید دبیرخانه جشنواره باشد.</p><p>۳- با توجه به نقش کلیدی و مؤثر معلمان گرامی در شناسایی، هدایت و پشتیبانی از دانش‌آموزان علاقه‌مند، پرتلاش، برگزیده و شایسته تقدیر در جایگاه استاد راهنما، بدیهی است در صدور گواهی‌نامه و تقدیرنامه‌های مربوط به معلمان راهبر و استادان راهنما، به‌ویژه شاغلان در همه مقاطع تحصیلی و نیز معلمان فعال در مناطق کمتر برخوردار، مدارس محروم و مدارس چندپایه، ارزش و اثرگذاری فعالیت آنان به‌صورت برجسته مورد توجه قرار می‌گیرد.</p><p>۴- گواهی‌نامه و تقدیرنامه صادره باید مشتمل بر نام و نام خانوادگی، کدپرسنلی، کدملی، سمت، نوع دقیق همکاری، سطح همکاری (منطقه‌ای، استانی یا کشوری)، بازه زمانی فعالیت، شماره و تاریخ صدور، مشخصات و امضای مرجع صادرکننده باشد.</p><p>۵- دستورالعمل صدور گواهی‌نامه و تقدیرنامه در هر مرحله از اجرای جشنواره، آماده و اطلاع‌رسانی خواهد شد.</p><p class=\"gh\"><strong>شرایط مشترک ثبت‌نام و تیم‌ها:</strong></p><p>ثبت‌نام در همه گرایش‌ها از طریق پنل کاربری دانش‌آموز در سامانه سها (my.medu.ir) و بر اساس تقویم اجرایی (پیوست الف) شیوه‌نامه اجرایی هشتمین جشنواره علمی‌پژوهشی و نمایشگاه دستاوردهای پژوهش‌سراهای دانش‌آموزی انجام می‌شود. دوره تحصیلی و تعداد اعضای مجاز در هر گرایش، در جدول گرایش‌های مسابقات (بند «پ») و بند ۲ هر فصل آمده است. اعضای هر تیم باید از یک منطقه، یک دوره تحصیلی و هم‌جنس باشند.</p><p class=\"gh\"><strong>مستندات مشترک همه گرایش‌ها:</strong></p><p>مستندات هر اثر، درون یک پوشه با نام کد تیم و به‌صورت فشرده (ZIP)، در سامانه بارگذاری می‌شود (بند «د»-۱ شیوه‌نامه اجرایی). افزون بر مستندات ویژه هر گرایش (بند ۴ هر فصل در بخش دوم)، موارد زیر در همه گرایش‌ها مشترک است:</p><p>۱- نمون‌برگ ۱ (شناسنامه اثر) تکمیل‌شده به‌صورت فایل Word و PDF؛ آنچه باید در توضیحات ۱ تا ۳ آن نوشته شود، در بند ۴ هر فصل آمده است.</p><p>۲- کارنامه سفر یادگیری همان گرایش از برنامه آسمان‌نما برای هر یک از اعضای تیم (اختیاری؛ مبنای ردیف سفر یادگیری نمون‌برگ داوری).</p><p>۳- عکس پرسنلی دانش‌آموز (در شرکت انفرادی) یا هر یک از اعضای تیم، با نام کد ملی هر نفر، داخل فایل فشرده (ZIP).</p><p>۴- در صورت استفاده از ابزارهای هوش مصنوعی، فایل «اعلام استفاده از هوش مصنوعی» مطابق بند ۵ راهنمای استفاده از هوش مصنوعی (در ادامه همین بند).</p><p><strong>تذکر:</strong> آثاری که بدون مستندات لازم ارسال گردند، از فرایند داوری حذف می‌شوند.</p><p class=\"gh\"><strong>راهنمای استفاده از هوش مصنوعی:</strong></p><p>ابزارهای هوش مصنوعی می‌توانند در یادگیری، نگارش و برنامه‌نویسی دستیار ارزشمندی باشند، اما در این مسابقات <strong>دستیار دانش‌آموز هستند، نه جایگزین او</strong>. این راهنما چارچوب استفاده درست، صادقانه و ایمن از این ابزارها را برای همه گرایش‌ها مشخص می‌کند و آنچه در فصل‌های بخش دوم آمده، بر پایه همین راهنماست.</p><p><strong>۱. استفاده‌های مجاز: </strong>در گرایش‌های دوره متوسطه، استفاده از هوش مصنوعی در موارد زیر به شرط اعلام (بند ۵) مجاز است:</p><p>• پرسیدن سؤال برای فهم بهتر مفاهیم و گرفتن ایده؛</p><p>• ویرایش، ترجمه و روان‌سازی متن؛</p><p>• خلاصه‌سازی منابع، به شرط آن‌که دانش‌آموز خود منبع را دیده و درستی خلاصه را بررسی کرده باشد؛</p><p>• کمک در برنامه‌نویسی، طراحی گرافیکی، طراحی پوستر و تدوین فیلم.</p><p class=\"gh\"><strong>۲. استفاده‌های ممنوع در همه گرایش‌ها:</strong></p><p>• ساختن، تغییر دادن یا کامل کردن داده‌ها، مشاهدات، اندازه‌گیری‌ها و نتایج آزمون‌ها؛</p><p>• استفاده از تصویر یا فیلم ساخته‌شده یا دست‌کاری‌شده با هوش مصنوعی به جای عکس و فیلم واقعی از فعالیت‌ها، ابزارها، محصول یا آسمان؛ از جمله «بهبود» عکس‌های نجومی با ابزارهای مولد، که جزئیاتی ناموجود به تصویر می‌افزایند؛</p><p>• استفاده از صدای ساختگی به جای صدای دانش‌آموز در روایت فیلم؛</p><p>• نوشتن تحلیل، تفسیر و نتیجه‌گیری به جای دانش‌آموز؛</p><p>• ذکر منابعی که دانش‌آموز خود ندیده و درستی آن را بررسی نکرده است؛ ابزارهای هوش مصنوعی گاهی منابعی ذکر می‌کنند که وجود خارجی ندارد.</p><p><strong>۳. دوره دوم ابتدایی </strong>(گرایش‌های «کاوشگران کوچک آسمان» و «بازنمایی خلاق مفاهیم نجوم»):</p><p>• دانش‌آموز تنها با همراهی و نظارت ولی یا مربی، و فقط برای پرسیدن سؤال و فهم بهتر مفاهیم، از هوش مصنوعی استفاده کند؛</p><p>• مشاهده، ثبت، نقاشی، نمودار، ابزار کمک‌آموزشی و روایت فیلم باید کار خود دانش‌آموز باشد و هیچ متن یا تصویر تولیدشده با هوش مصنوعی در اثر به کار نرود؛</p><p>• در گرایش «کاوشگران کوچک آسمان»، مشاهده و ثبت مشاهدات به هیچ‌وجه به نرم‌افزار و هوش مصنوعی متکی نباشد.</p><p class=\"gh\"><strong>۴. نکات ویژه گرایش‌های دوره متوسطه:</strong></p><p>• <strong>انجمن علمی‌پژوهشی نجوم: </strong>تصاویر فعالیت‌ها و روایت فیلم باید واقعی و کار خود اعضای انجمن باشد.</p><p>• <strong>مأموریت فضایی: </strong>داده‌های آزمون‌های زمینی و پرواز، کاربرگ ثبت پرواز و ویدئوی پرواز باید واقعی باشد.</p><p>• <strong>نجوم رصدی و ریاضیات نجومی: </strong>رصد، عکس‌های خام، اندازه‌گیری و محاسبه اصلی باید کار خود دانش‌آموز باشد و نرم‌افزار و هوش مصنوعی نباید جای رصد و اندازه‌گیری را بگیرد.</p><p>• <strong>پژوهش و تحلیل داده‌های نجومی: </strong>تفسیر و نتیجه‌گیری کار خود دانش‌آموز است و نتایج باید با کد و داده‌های ارسالی قابل تکرار باشد.</p><p>• <strong>ماهواره مکعبی: </strong>داده‌ها و آزمون‌ها باید واقعی باشد و تیم باید بتواند همه کدهای سامانه را توضیح دهد.</p><p>• <strong>کارآفرینی دانش‌بنیان نجومی و فناوری‌های فضایی: </strong>تصاویر محصول، فرم‌های بازخورد کاربران و اسناد فروش باید واقعی باشد.</p><p><strong>۵. اعلام استفاده: </strong>هر اثری که در آن از هوش مصنوعی استفاده شده، باید فایلی با عنوان «اعلام استفاده از هوش مصنوعی» در فایل فشرده ارسالی داشته باشد که نام ابزار، بخشی از کار که ابزار در آن به کار رفته و هدف استفاده، و پرامپت‌های اصلی در آن آمده است. استفاده مجاز و اعلام‌شده هیچ امتیازی کم نمی‌کند.</p><p><strong>۶. مسئولیت درستی محتوا: </strong>پاسخ ابزارهای هوش مصنوعی ممکن است نادرست باشد. دانش‌آموز مسئول درستی همه مطالب اثر است و خطای علمی برآمده از این ابزارها، خطای خود او شمرده می‌شود.</p><p><strong>۷. دفاع از اثر: </strong>دانش‌آموز باید بتواند در مصاحبه هر بخش از اثر را، از جمله متن‌ها و کدهایی که با کمک هوش مصنوعی تهیه شده‌اند، توضیح دهد و از آن دفاع کند.</p><p><strong>۸. حریم خصوصی و ایمنی: </strong>عکس، نام و اطلاعات شخصی دانش‌آموزان و دیگران نباید در ابزارهای هوش مصنوعی بارگذاری شود و حداقل سن تعیین‌شده در شرایط استفاده هر ابزار باید رعایت شود.</p><p><strong>۹. داوری: </strong>استفاده اعلام‌نشده یا استفاده ممنوع، مطابق بند «ث» «وظایف و استانداردهای اخلاقی داوری» بررسی می‌شود و می‌تواند تا حذف اثر پیش برود. چون نرم‌افزارهای تشخیص متن تولیدشده با هوش مصنوعی خطای زیادی دارند، داوران نباید تنها بر اساس نتیجه این نرم‌افزارها تصمیم بگیرند؛ تصمیم بر پایه مصاحبه، مستندات و شواهد گرفته می‌شود.</p><p class=\"gh\"><strong>ث ـ وظایف و استانداردهای اخلاقی داوری آثار در جشنواره علمی‌پژوهشی:</strong></p><p class=\"gh\"><strong>• مسئولیت‌ها و وظایف کلی قطب‌های استانی:</strong></p><p>۱. انتخاب داوران بر اساس صلاحیت‌های لازم داوری و صدور ابلاغ ایشان.</p><p>۲. تعداد داوران هر گرایش در هر مرحله، دو تا پنج نفر است (بند «چ»-۲ شیوه‌نامه اجرایی).</p><p>۳. برگزاری جلسه توجیهی برای داوران با همکاری قطب کشوری نجوم و فناوری‌های فضایی. </p><p>۴. بررسی انطباق آثار مناطق وفق شیوه‌نامه‌های اختصاصی مسابقات و رفع مغایرت با مشارکت کارشناسان و مدیران پژوهش‌سراهای مناطق در موعد مقرر (تقویم اجرایی، پیوست الف).</p><p>۵. جایگزین نمودن داور در صورت مشاهده مغایرت عملکرد ایشان با استانداردهای اخلاقی لازم در داوری و بی توجهی به تذکرات مربوطه.</p><p>۶. جایگزین نمودن داور در صورت ایجاد مشکل پیش بینی نشده (بیماری و ...) برای داوران.</p><p>۷. بررسی و تأیید گزارشات داوری تمامی گرایش- دوره‌های مسابقات متبوع و اعلام نتایج به دفتر متوسطه نظری با نامه رسمی همراه با صورت‌جلسه هیئت داوران.</p><p class=\"gh\"><strong>• وظایف و استانداردهای اخلاقی که داوران در تمامی مراحل اجرایی، ملزم به رعایت آنها هستند:</strong></p><p class=\"gh\"><strong>• انتظارات در زمان داوری:</strong></p><p>۱. با اهداف، وظایف و ویژگی‌های داوری آشنا باشند. </p><p>۲. تنها به داوری آثاری بپردازند که در حیطه توانایی حرفه‌ای آنان می‌گنجد و همچنین قادر به انجام آنها در زمان معلوم هستند.</p><p>۳. به محرمانه بودن اطلاعات داوری احترام گذاشته و هیچ یک از اطلاعات آثار را در هر یک از مراحل داوری فاش نکنند.</p><p>۴. از اطلاعات به دست آورده هنگام داوری، به نفع خود یا هر شخص یا سازمان دیگری استفاده نکنند و همچنین از این اطلاعات، برای آسیب زدن و یا بی‌اعتبار جلوه دادن دیگران استفاده ننمایند.</p><p>۵. اجازه ندهند که داوری آنها تحت تاثیر مسائلی چون ملیت، مذهب، باورهای سیاسی، جنسیت و یا دیگر مسائل این چنینی قرار گیرد.</p><p>۶. در نقدها بی‌طرف و سازنده باشند و متناسب با شان دانش‌آموزان، نقد و انتقادها را به آن‌ها منتقل کنند. </p><p>۷. اگر به هر نحوی در روند پژوهش گرایشی که در آن داور هستند؛ نقشی داشته اند، با اعلام به دبیر مجری مرحله استانی مسابقات/ قطب کشوری از داوری در آن گرایش پرهیز کنند. (داوران مجاز به داوری آثار منطقه یا استان خود نمی‌باشند.)</p><p>۸. اگر پژوهشی شبیه به اثر ارائه شده؛ در دست انجام دارند، با اعلام به دبیر مجری مرحله استانی مسابقات/ قطب کشوری از داوری در آن گرایش خودداری کنند.</p><p>۹. از وارد نمودن اشخاص دیگر، از جمله دانشجویان و محققین تحت آموزش خود؛ در روند داوری خودداری کنند.</p><p>۱۰. به هر دلیلی از ارتباط (تلفنی، مجازی و ...) با دانش‌آموزان پرهیز نمایند؛ مگر در مواردی که در راهنمای گرایش مربوطه تصریح شده باشد.</p><p>۱۱. به هر دلیلی از ارتباط (تلفنی، مجازی و ...) با داوران سایر گرایش‌ها و مسابقات دیگر خودداری نمایند و توجه داشته باشند که مشخصات داوران هر گرایش و مسابقه، محرمانه بماند.</p><p>۱۲. در مرحله دفاع آنلاین، زمینه ساز دفاع مناسب از اثر و ایجاد آرامش در دانش‌آموزان منتخب باشند و با سعه صدر اجازه استفاده از حداکثر زمان دفاع را داده و در مورد نتیجه نیز صحبت ننمایند.</p><p class=\"gh\"><strong>• نحوه برخورد با کپی‌برداری علمی و ادبی یا آثار غیر دانش‌آموزی:</strong></p><p>۱. در صورت امکان از طریق مصاحبه غیر حضوری، این موضوع را بررسی کنند.</p><p>۲. در صورت امکان، تأییدیه رسمی یکی از مراجع علمی منطقه‌ای را با وساطت دبیر مجری مرحله استانی مسابقات/ قطب کشوری؛ از صاحبان اثر مطالبه نمایند.</p><p>۳. مدارک و مستندات حاصل از بررسی دقیق آثار جهت اثبات ادعاهای مطرح شده را ثبت و به دبیر مجری مرحله استانی مسابقات/ قطب کشوری تحویل نمایند.</p><p>۴. مطابق بند «چ»-۷ شیوه‌نامه اجرایی، تمام آثار رسیده ارزیابی می‌شوند و آثار برتر برای راستی‌آزمایی و دفاع، به مصاحبه دعوت خواهند شد. چنانچه در بررسی‌های انجام‌شده، اثری به‌طور آشکار فراتر از سطح دانش‌آموزی تشخیص داده شود یا قرائن معتبر بر تهیه، تکمیل یا تولید آن توسط غیردانش‌آموز، یا دخالت مؤثر استاد راهنما و اشخاص ثالث در فرایند تولید اثر وجود داشته باشد، اثر مزبور مشمول بررسی ویژه قرار می‌گیرد. در صورت عدم توانایی دانش‌آموز در دفاع مستدل و قابل قبول از اثر خود، آن اثر از ادامه فرایند رقابت‌ها حذف خواهد شد.</p><p>۵. در صورت تشخیص اثر کپی‌برداری‌شده از طرح‌های موجود یا اثر خارج از محدوده علمی گرایش موردنظر، با رأی حداقل دو سوم تیم داوران، امتیاز آن اثر صفر منظور گردد.</p><p class=\"gh\"><strong>• انتظارات هنگام آماده کردن گزارش داوری:</strong></p><p>۱. به‌طور جزئی و دقیق به داوری آثار بپردازند و بررسی و تحقیقات لازم و اساسی را در زمان داوری اثر انجام دهند.</p><p>۲. جلسه تخصصی تیم داوری گرایش مربوطه را برگزار و به نقطه نظرات داوران دیگر توجه کنند تا با همفکری اعضای تیم داوری، درک بهتری از اثر حاصل شده و دقت تصمیم گیری افزایش یابد.</p><p>۳. در تمام طول دوره داوری، در دسترس قطب استانی/کشوری بوده و بلافاصله پاسخگو باشند و اطلاعات مورد نیاز را ارائه دهند.</p><p>۴. در هر مرحله، فرم‌های داوری را برای هر اثر به‌طور جداگانه تکمیل نموده و به مجری مرحله استانی مسابقات/ قطب کشوری تحویل نمایند.</p><p>۵. تمامی مراحل داوری را در سامانه یا نمون‌برگ‌های تعیین‌شده ثبت کنند تا مستند و بایگانی شود (بند «چ»-۶ شیوه‌نامه اجرایی).</p><p>۶. هماهنگی لازم را با روند اجرایی تیم داوری (نحوه و زمان ارسال نمرات، زمان ورود به سامانه جهت ثبت نمرات داوری و ...) داشته باشند.</p><p>۷. درصورت تفاوت زیاد نمرات داوران دریک اثر، مجری مرحله استانی مسابقات/ قطب کشوری مجاز به بررسی مجدد اثر توسط داور یا داوران جدید؛ می‌باشد.<strong> </strong></p><p class=\"gh\"><strong>ج ـ معرفی برگزیدگان منطقه‌ای و استانی برای شرکت در مرحله بعدی مسابقات:</strong></p><p>مدیر پژوهش‌سرای دانش‌آموزی منطقه در مرحله منطقه‌ای و کارشناس محترم نظارت و پیگیری امور پژوهش‌سراهای دانش‌آموزی استان در مرحله استانی؛ آثار (تیم‌های) برگزیده مرحله مربوطه را به همراه تمامی <strong>مستندات </strong><strong>موردنی</strong><strong>از</strong><strong> آثار</strong> ذکر شده در بند «ت» بخش اول (مستندات مشترک) و بند ۴ هر فصل و نمون‌برگ‌های داوری آن مرحله؛ در سامانه سها به آدرس http://my.medu.ir بارگذاری می نمایند.</p><p><strong>تذکر: </strong>برای اثر ارائه شده در هر یک از گرایش‌های مسابقات دوازده‌گانه هشتمین دوره جشنواره علمی‌پژوهشی پژوهش‌سراهای دانش‌آموزی کشور، <strong>شناسنامه اثر در قالب نمون‌برگ ۱ (پیوست ب در بخش سوم)؛</strong> باید به‌طور دقیق تکمیل و به‌صورت فایل‌های word و pdf ارسال گردد. اطلاعات خاص و موردنیاز اثر در بند ۴ هر فصل، در توضیحات ۱، توضیحات ۲، توضیحات ۳ ذکر شده و ضروری است که موردتوجه شرکت‌کنندگان در این مسابقات قرار گیرد. چنانچه شناسنامه اثر (نمون‌برگ ۱) به‌طور کامل تکمیل و ارسال نشده باشد، اثر از فرآیند داوری کنار گذاشته خواهد شد.<br/></p><p class=\"gh\"><strong>چ ـ رسیدگی به اعتراضات:</strong></p><p>رسیدگی به اعتراضات، مطابق بند «ح» شیوه‌نامه اجرایی هشتمین جشنواره علمی‌پژوهشی و به شرح زیر انجام می‌شود. زمان ثبت و بررسی اعتراض‌ها در مراحل استانی و کشوری، در ردیف‌های ۹ و ۱۳ تقویم اجرایی (پیوست الف) آمده است.</p><p>۱- اعتراض نسبت به نتایج هر مرحله، صرفاً در بازه زمانی اعلام‌شده توسط دبیرخانه جشنواره و از طریق مسیر تعیین‌شده قابل ثبت است؛</p><p>۲- اعتراض باید مستند، مشخص و مرتبط با فرایند یا ضوابط مندرج در شیوه‌نامه باشد؛ در غیر این صورت قابل بررسی نخواهد بود؛</p><p>۳- اعتراضات خارج از مهلت مقرر یا فاقد مستندات لازم، حسب تشخیص مرجع رسیدگی، قابل بررسی نخواهد بود؛</p><p>۴- بررسی اعتراضات توسط مرجع تعیین‌شده در همان سطح، با نظارت سطوح بالاتر و با رعایت اصل بی‌طرفی انجام می‌شود؛</p><p>۵- نتیجه بررسی اعتراض پس از جمع‌بندی و تأیید مرجع ذی‌صلاح، به ذی‌نفع اعلام می‌شود؛</p><p>۶- ثبت اعتراض به‌خودی‌خود موجب توقف اعلام نتایج یا تغییر وضعیت اثر نخواهد بود، مگر در مواردی که مرجع ذی‌صلاح تصمیم دیگری اتخاذ کند.</p><p class=\"gh\"><strong>ح ـ موارد پیش‌بینی‌نشده:</strong></p><p>مطابق بند «ذ» شیوه‌نامه اجرایی جشنواره، در مواردی از قبیل اختلال سامانه، بروز شرایط خارج از اختیار، عدم امکان برگزاری برنامه در زمان یا مکان تعیین‌شده، نقص یا مغایرت مستندات و سایر شرایطی که در این شیوه‌نامه یا شیوه‌نامه اجرایی جشنواره پیش‌بینی نشده است، تصمیم‌گیری در حدود اختیارات قانونی بر عهده مرجع اجرایی همان سطح بوده و موارد خارج از حدود اختیارات، برای تصمیم‌گیری به مرجع بالاتر ارجاع خواهد شد.</p><p class=\"gh\"><strong>پیوست الف: تقویم اجرایی هشتمین جشنواره علمی‌پژوهشی</strong></p><p>تقویم زیر عیناً از شیوه‌نامه اجرایی هشتمین جشنواره علمی‌پژوهشی و نمایشگاه دستاوردهای پژوهش‌سراهای دانش‌آموزی (بخشنامه شماره ۴۳۳/۴۰۰ مورخ ۱۴۰۵/۰۸/۲۶ معاونت آموزش متوسطه وزارت آموزش و پرورش) نقل و فقط صفحه‌آرایی آن تغییر کرده است. ردیف‌هایی که دانش‌آموزان و تیم‌ها مستقیماً با آن‌ها سروکار دارند (ثبت‌نام، تکمیل آثار، اعتراض و مصاحبه، اختتامیه) با رنگ زرد کم‌رنگ مشخص شده‌اند.</p><div class=\"tbl wide\"><table><tr><td><p>ردیف</p></td><td><p>مرحله</p></td><td><p>عنوان فعالیت</p></td><td><p>تاریخ اجرا</p></td></tr><tr><td><p><strong>۱</strong></p></td><td rowspan=\"2\"><p>عمومی</p></td><td><p><strong>تشکیل کمیته‌های اجرایی کشوری، استانی و منطقه‌ای</strong></p></td><td><p><strong>هفته چهارم آبان ۱۴۰۵</strong></p></td></tr><tr><td><p><strong>۲</strong></p></td><td><p><strong>ارسال شیوه‌نامه‌های عمومی و اختصاصی جشنواره علمی‌پژوهشی</strong></p></td><td><p><strong>هفته چهارم آبان ۱۴۰۵</strong></p></td></tr><tr><td><p><strong>۳</strong></p></td><td rowspan=\"4\"><p>منطقه‌ای</p></td><td><p><strong>ثبت‌نام دانش‌آموزان از طریق my.medu.ir (خدمات آموزشی، پژوهش‌سرا و انتخاب جشنواره علمی‌پژوهشی): انتخاب رشته و گرایش، انتخاب هم‌گروهی، مشخصات اثر و بارگذاری اثر</strong></p></td><td><p><strong>۱۴۰۵/۹/۱ تا ۱۴۰۵/۱۱/۲۱</strong></p></td></tr><tr><td><p><strong>۴</strong></p></td><td><p><strong>تشکیل هیأت داوران مرحله منطقه‌ای و ثبت در سامانه</strong></p></td><td><p><strong>۱۴۰۵/۱۱/۱۷ تا ۱۴۰۵/۱۱/۲۱</strong></p></td></tr><tr><td><p><strong>۵</strong></p></td><td><p><strong>برگزاری مرحله منطقه‌ای و بررسی آثار</strong></p></td><td><p><strong>۱۴۰۵/۱۱/۲۲ تا ۱۴۰۵/۱۲/۱۵</strong></p></td></tr><tr><td><p><strong>۶</strong></p></td><td><p><strong>معرفی تیم‌های برگزیده منطقه‌ای به کمیته اجرایی مرحله استانی در سامانه</strong></p><p>• امکان تکمیل و بارگذاری مجدد آثار برگزیده منطقه‌ای (اختیاری)</p></td><td><p><strong>۱۴۰۵/۱۲/۱۶ تا ۱۴۰۵/۱۲/۲۶</strong></p></td></tr><tr><td><p><strong>۷</strong></p></td><td rowspan=\"4\"><p>استانی</p></td><td><p><strong>تشکیل هیأت داوران مرحله استانی و ثبت در سامانه</strong></p></td><td><p><strong>۱۴۰۵/۱۲/۱۶ تا ۱۴۰۵/۱۲/۲۶</strong></p></td></tr><tr><td><p><strong>۸</strong></p></td><td><p><strong>برگزاری مرحله اول استانی و بررسی آثار (ثبت امتیازها)</strong></p></td><td><p><strong>۱۴۰۵/۱۲/۲۷ تا ۱۴۰۶/۲/۸</strong></p></td></tr><tr><td><p><strong>۹</strong></p></td><td><p><strong>برگزاری مرحله دوم استانی</strong></p><p>• اعلام امتیازها</p><p>• ثبت و بررسی اعتراض‌ها</p><p>• مصاحبه و راستی‌آزمایی تیم‌های منتخب مرحله اول استانی</p></td><td><p><strong>۱۴۰۶/۲/۹ تا ۱۴۰۶/۲/۲۷</strong></p></td></tr><tr><td><p><strong>۱۰</strong></p></td><td><p><strong>معرفی تیم‌های برگزیده استانی توسط قطب‌های استانی، تحت نظارت کارشناس امور پژوهش‌سراهای دانش‌آموزی استان، به کمیته اجرایی مرحله کشوری در سامانه</strong></p><p>• امکان تکمیل و بارگذاری مجدد آثار برگزیده استانی (اختیاری)</p></td><td><p><strong>۱۴۰۶/۲/۲۸ تا ۱۴۰۶/۳/۸</strong></p></td></tr><tr><td><p><strong>۱۱</strong></p></td><td rowspan=\"4\"><p>کشوری</p></td><td><p><strong>تشکیل هیأت داوران مرحله کشوری جشنواره و ثب رش استان</strong></p><p><strong>تاریخ و امضا</strong></p></td><td colspan=\"8\"><p><strong>نام و نام خانوادگی</strong></p><p><strong>دبیر علمی قطب کشوری</strong></p><p><strong>نجوم و فناوری‌های فضایی</strong></p><p><strong>تاریخ و امضا</strong></p></td></tr></table></div><p class=\"gh\"><strong>نمون‌برگ ۱: شناسنامه اثر</strong></p><div class=\"tbl wide\"><table><tr><td colspan=\"6\"><p><strong>مسابقه:</strong></p></td><td colspan=\"8\"><p><strong>گرایش:</strong></p></td></tr><tr><td colspan=\"6\"><p>عنوان اثر:</p></td><td colspan=\"8\"><p>کد ثبت اثر در سامانه:</p></td></tr><tr><td colspan=\"3\"><p>استان:</p></td><td colspan=\"8\"><p>شهرستان:</p></td><td colspan=\"3\"><p>ناحیه/منطقه:</p></td></tr><tr><td colspan=\"7\"><p>نام مدرسه/کد مدرسه:</p></td><td colspan=\"7\"><p>تلفن مدرسه با پیش‌شماره:</p></td></tr><tr><td colspan=\"7\"><p>پژوهش‌سرای دانش‌آموزی:</p></td><td colspan=\"7\"><p>نام تیم:</p></td></tr><tr><td><p><strong>ردیف</strong></p></td><td colspan=\"4\"><p><strong>نام و نام خانوادگی</strong></p></td><td colspan=\"3\"><p><strong>کد ملی</strong></p></td><td><p><strong>پایه</strong></p></td><td colspan=\"3\"><p><strong>رشته تحصیلی</strong></p></td><td><p><strong>سمت</strong></p></td><td><p><strong>تلفن همراه/ثابت</strong></p></td></tr><tr><td><p>۱</p></td><td colspan=\"4\"></td><td colspan=\"3\"></td><td></td><td colspan=\"3\"></td><td><p>سرگروه</p></td><td></td></tr><tr><td><p>۲</p></td><td colspan=\"4\"></td><td colspan=\"3\"></td><td></td><td colspan=\"3\"></td><td><p>عضو</p></td><td></td></tr><tr><td><p>۳</p></td><td colspan=\"4\"></td><td colspan=\"3\"></td><td></td><td colspan=\"3\"></td><td><p>عضو</p></td><td></td></tr><tr><td colspan=\"2\"><p>اهداف</p></td><td colspan=\"12\"></td></tr><tr><td colspan=\"2\"><p>ویژگی‌های برجسته اثر (حداقل ۳ مورد)</p></td><td colspan=\"12\"></td></tr><tr><td colspan=\"2\"><p>توضیحات ۱</p></td><td colspan=\"12\"></td></tr><tr><td colspan=\"2\"><p>توضیحات ۲</p></td><td colspan=\"12\"></td></tr><tr><td colspan=\"2\"><p>توضیحات ۳</p></td><td colspan=\"12\"></td></tr><tr><td colspan=\"2\"><p>کلمات کلیدی</p><p>(۵ تا ۸ کلمه)</p></td><td colspan=\"12\"></td></tr><tr><td colspan=\"2\"><p>مشخصات استاد راهنما / تلفن همراه </p></td><td colspan=\"12\"></td></tr><tr><td colspan=\"4\"><p><strong>نام و نام خانوادگی</strong></p><p><strong>استاد راهنما</strong></p><p><strong>تاریخ و امضا</strong></p></td><td colspan=\"6\"><p><strong>نام و نام خانوادگی</strong></p><p><strong>مدیر واحد آموزشی مجری</strong></p><p><strong>شماره‌تلفن، تاریخ و امضا</strong></p></td><td colspan=\"4\"><p><strong>نام و نام خانوادگی</strong></p><p><strong>مدیر پژوهش‌سرای دانش‌آموزی مجری </strong></p><p><strong>شماره‌تلفن، تاریخ و امضا</strong></p></td></tr></table></div><p class=\"gh\"><strong>پیوست چ: واژه‌نامه و نمایه</strong></p><p>در این پیوست، واژه‌ها و عبارت‌های تخصصی یا خاص این شیوه‌نامه که ممکن است برای دانش‌آموزان ناآشنا باشند، به ترتیب الفبا با توضیحی کوتاه آمده‌اند. </p><div class=\"tbl\"><table><tr><td><p>واژه یا عبارت</p></td><td><p>توضیح</p></td></tr><tr><td><p><strong>آزمون زمینی</strong></p></td><td><p>آزمایش اجزا روی زمین پیش از پرواز؛ مانند آزمون فشار بدنه یا آزمون چتر.</p></td></tr><tr><td><p><strong>آسمان‌نما (برنامه)</strong></p></td><td><p>برنامه آموزشی قطب کشوری نجوم که «سفر یادگیری» هر گرایش و کارنامه آن در آن قرار دارد و رایگان در اختیار دانش‌آموزان است.</p></td></tr><tr><td><p><strong>آلودگی نوری</strong></p></td><td><p>روشنایی اضافه چراغ‌های شهر که آسمان شب را روشن می‌کند و دیدن ستارگان کم‌نور را سخت می‌سازد.</p></td></tr><tr><td><p><strong>ابزار کمک‌آموزشی</strong></p></td><td><p>وسیله‌ای ساخته دست دانش‌آموز، مانند ماکت یا مدل، که یک مفهوم نجومی را ساده و دیدنی می‌کند.</p></td></tr><tr><td><p><strong>اثر</strong></p></td><td><p>هر کاری که دانش‌آموز یا تیم برای داوری در یک گرایش می‌فرستد؛ مانند گزارش رصد، پروژه، محصول، ماکت یا فیلم.</p></td></tr><tr><td><p><strong>اثر فرادانش‌آموزی</strong></p></td><td><p>اثری که آشکارا از توان دانش‌آموز فراتر است یا دیگران (مثلاً بزرگسالان) آن را تهیه یا کامل کرده‌اند؛ چنین اثری به بررسی ویژه و مصاحبه می‌رود.</p></td></tr><tr><td><p><strong>اجرام اعماق آسمان</strong></p></td><td><p>اجرام دور و کم‌نور مانند سحابی‌ها، خوشه‌های ستاره‌ای و کهکشان‌ها.</p></td></tr><tr><td><p><strong>ارتفاع اوج</strong></p></td><td><p>بیشترین ارتفاعی که پرتابگر در پرواز به آن می‌رسد.</p></td></tr><tr><td><p><strong>ارتفاع‌سنج</strong></p></td><td><p>حسگری که ارتفاع را، معمولاً از روی فشار هوا، اندازه می‌گیرد.</p></td></tr><tr><td><p><strong>ارجاع</strong></p></td><td><p>ذکر نشانی منبعی که اطلاعات، داده یا تصویر از آن گرفته شده است.</p></td></tr><tr><td><p><strong>ارزش‌آفرینی</strong></p></td><td><p>تبدیل یک ایده یا دانش به محصول یا خدمتی که برای دیگران سودمند است.</p></td></tr><tr><td><p><strong>ارزش پیشنهادی</strong></p></td><td><p>سودی که محصول برای کاربر دارد و آن را از محصولات مشابه متمایز می‌کند.</p></td></tr><tr><td><p><strong>ارزشیابی مستمر</strong></p></td><td><p>نمره‌ای که معلم در طول هر نوبت تحصیلی بر اساس فعالیت‌های دانش‌آموز در کلاس و بیرون از آن می‌دهد.</p></td></tr><tr><td><p><strong>استوای سماوی</strong></p></td><td><p>دایره‌ای خیالی در آسمان که درست بالای استوای زمین قرار دارد.</p></td></tr><tr><td><p><strong>استهلال</strong></p></td><td><p>تلاش برای دیدن نخستین هلال باریک ماه پس از ماه نو، کمی پس از غروب خورشید در افق غربی.</p></td></tr><tr><td><p><strong>اسطرلاب</strong></p></td><td><p>ابزار نجومی قدیمی برای اندازه‌گیری ارتفاع خورشید و ستارگان و تعیین زمان.</p></td></tr><tr><td><p><strong>اصالت اثر</strong></p></td><td><p>اینکه اثر واقعاً کار خود دانش‌آموز باشد و از جای دیگری برداشته یا ساختگی نباشد.</p></td></tr><tr><td><p><strong>اعتدال و انقلاب</strong></p></td><td><p>اعتدال: دو روز در سال که شب و روز تقریباً برابرند (آغاز بهار و پاییز)؛ انقلاب: بلندترین و کوتاه‌ترین روز سال (آغاز تابستان و زمستان).</p></td></tr><tr><td><p><strong>اعتراض</strong></p></td><td><p>درخواست بررسی دوباره نتیجه داوری؛ فقط در بازه اعلام‌شده تقویم اجرایی و از مسیر تعیین‌شده، با دلیل و مستند ثبت می‌شود.</p></td></tr><tr><td><p><strong>اعلام استفاده از هوش مصنوعی</strong></p></td><td><p>فایلی همراه اثر که نام ابزار هوش مصنوعی، بخشی از کار که در آن به کار رفته، هدف استفاده و پرامپت‌های اصلی را نشان می‌دهد.</p></td></tr><tr><td><p><strong>افق</strong></p></td><td><p>خطی که زمین و آسمان در آن به هم می‌رسند؛ «افق باز» یعنی ساختمان یا کوه بلندی آن سمت را نپوشاند.</p></td></tr><tr><td><p><strong>اقلیدس (Euclid)</strong></p></td><td><p>تلسکوپ فضایی آژانس فضایی اروپا که برای بررسی ماده و انرژی تاریک، از کهکشان‌ها نقشه‌برداری می‌کند.</p></td></tr><tr><td><p><strong>انجمن علمی‌پژوهشی</strong></p></td><td><p>گروهی از دانش‌آموزان یک مدرسه که با برنامه منظم و زیر نظر دبیر، فعالیت‌های علمی و ترویجی نجوم را اجرا می‌کنند.</p></td></tr><tr><td><p><strong>ایستگاه زمینی</strong></p></td><td><p>گیرنده‌ای روی زمین (آنتن و رایانه) که داده‌های ماهواره یا کپسول را دریافت و نمایش می‌دهد.</p></td></tr><tr><td><p><strong>بارش شهابی</strong></p></td><td><p>شب‌هایی از سال که شهاب‌های بیشتری از یک ناحیه آسمان دیده می‌شوند.</p></td></tr><tr><td><p><strong>بالک</strong></p></td><td><p>باله‌های کوچک انتهای پرتابگر که آن را در پرواز پایدار و مستقیم نگه می‌دارند.</p></td></tr><tr><td><p><strong>برگه ارزش</strong></p></td><td><p>برگه‌ای که کاربر، نیاز او، ارزش پیشنهادی و محصولات مشابه را خلاصه می‌کند.</p></td></tr><tr><td><p><strong>بزرگ‌نمایی</strong></p></td><td><p>چند برابر بزرگ‌تر دیده شدن جسم در تلسکوپ نسبت به چشم غیرمسلح.</p></td></tr><tr><td><p><strong>بسته داده</strong></p></td><td><p>مجموعه‌ای از داده‌ها که با قالب مشخص یک‌جا ارسال می‌شود.</p></td></tr><tr><td><p><strong>بوستر</strong></p></td><td><p>پرتابگر کمکی که در آغاز پرواز نیروی بیشتری می‌دهد و سپس جدا می‌شود.</p></td></tr><tr><td><p><strong>پایگاه داده نجومی</strong></p></td><td><p>مجموعه بزرگ و معمولاً آزاد داده‌های رصدی که مأموریت‌ها و رصدخانه‌ها منتشر می‌کنند.</p></td></tr><tr><td><p><strong>پرامپت</strong></p></td><td><p>متن، دستور یا پرسشی که برای گرفتن پاسخ به ابزار هوش مصنوعی داده می‌شود.</p></td></tr><tr><td><p><strong>پرتابگر آبی</strong></p></td><td><p>موشکی ساخته‌شده از بطری پلاستیکی نوشابه که با آب و هوای فشرده به هوا می‌رود.</p></td></tr><tr><td><p><strong>پرسش پژوهشی</strong></p></td><td><p>پرسشی روشن و قابل بررسی که پژوهش برای یافتن پاسخ آن انجام می‌شود.</p></td></tr><tr><td><p><strong>پرواز رسمی</strong></p></td><td><p>پروازی که تیم برای داوری معرفی می‌کند و باید در حضور مربی و با فیلم پیوسته ثبت شود.</p></td></tr><tr><td><p><strong>پژوهانه</strong></p></td><td><p>کمک‌هزینه یا اعتباری که برای انجام یک پژوهش یا استفاده از خدمات آزمایشگاهی داده می‌شود.</p></td></tr><tr><td><p><strong>پژوهش‌سرای دانش‌آموزی</strong></p></td><td><p>مرکز آموزش و پرورش برای فعالیت‌های علمی، آزمایشگاهی و پژوهشی دانش‌آموزان؛ مرحله منطقه‌ای در آن برگزار می‌شود.</p></td></tr><tr><td><p><strong>پژوهشگری</strong></p></td><td><p>یافتن پاسخ یک پرسش علمی با روش درست، داده و تحلیل.</p></td></tr><tr><td><p><strong>پلاکارد</strong></p></td><td><p>تابلو یا برگه‌ای که عنوان برنامه، مکان و تاریخ روی آن نوشته شده و در عکس فعالیت دیده می‌شود.</p></td></tr><tr><td><p><strong>پنل مدیریت داده (Dashboard)</strong></p></td><td><p>صفحه وب یا برنامه‌ای که داده‌های ماهواره را به‌صورت نمودار و جدول نمایش می‌دهد.</p></td></tr><tr><td><p><strong>تبصره</strong></p></td><td><p>توضیح، شرط یا استثنایی که به دنبال یک بند می‌آید و حکم آن را کامل می‌کند.</p></td></tr><tr><td><p><strong>تحلیل خطا</strong></p></td><td><p>برآورد اینکه یک اندازه‌گیری یا محاسبه چقدر ممکن است با مقدار واقعی فاصله داشته باشد.</p></td></tr><tr><td><p><strong>تربیع ماه</strong></p></td><td><p>زمانی که نیمی از قرص ماه روشن دیده می‌شود (تربیع اول و دوم).</p></td></tr><tr><td><p><strong>تس (TESS)</strong></p></td><td><p>ماهواره ناسا برای یافتن سیارات فراخورشیدی با روش گذر.</p></td></tr><tr><td><p><strong>تقدیرنامه و گواهی‌نامه</strong></p></td><td><p>سندی که برای قدردانی یا تأیید همکاری و فعالیت افراد، بر پایه مستندات، صادر می‌شود.</p></td></tr><tr><td><p><strong>تقویم اجرایی</strong></p></td><td><p>جدول زمان‌بندی رسمی مراحل جشنواره، از ثبت‌نام تا اختتامیه (پیوست الف).</p></td></tr><tr><td><p><strong>تلسکوپ</strong></p></td><td><p>ابزاری با عدسی یا آینه که نور اجرام دور را جمع می‌کند و آن‌ها را بزرگ‌تر و پرنورتر نشان می‌دهد.</p></td></tr><tr><td><p><strong>تله‌متری</strong></p></td><td><p>ارسال خودکار داده‌های اندازه‌گیری‌شده، مانند دما و فشار، از ماهواره به ایستگاه زمینی.</p></td></tr><tr><td><p><strong>جداسازی مراحل</strong></p></td><td><p>جدا شدن بخش‌های پرتابگر در حین پرواز؛ مانند جدا شدن بوستر یا کپسول.</p></td></tr><tr><td><p><strong>چشمی</strong></p></td><td><p>عدسی انتهای تلسکوپ که جلوی چشم قرار می‌گیرد و بزرگ‌نمایی را تعیین می‌کند.</p></td></tr><tr><td><p><strong>چکیده</strong></p></td><td><p>خلاصه کوتاه یک مقاله، گزارش یا مأموریت که هدف، روش و نتیجه را در چند جمله می‌گوید.</p></td></tr><tr><td><p><strong>حرکت ظاهری خورشید</strong></p></td><td><p>جابه‌جایی خورشید در آسمان طی روز و سال که از چرخش و گردش زمین ناشی می‌شود.</p></td></tr><tr><td><p><strong>حریم خصوصی</strong></p></td><td><p>حق هر کس بر اینکه عکس، نام و اطلاعات شخصی‌اش بدون اجازه منتشر یا به ابزارها داده نشود.</p></td></tr><tr><td><p><strong>حسگر</strong></p></td><td><p>قطعه الکترونیکی که کمیتی مانند دما، فشار، نور یا شتاب را اندازه می‌گیرد و به داده تبدیل می‌کند.</p></td></tr><tr><td><p><strong>خط پایانه</strong></p></td><td><p>مرز میان بخش روشن و تاریک ماه.</p></td></tr><tr><td><p><strong>داده خام</strong></p></td><td><p>داده‌ها و عکس‌هایی که همان‌طور که اندازه‌گیری یا گرفته شده‌اند، بدون تغییر نگه داشته می‌شوند.</p></td></tr><tr><td><p><strong>دانش‌افزایی</strong></p></td><td><p>فهمیدن توضیح علمی پدیده‌ها و توانایی بازگو کردن درست آن برای دیگران.</p></td></tr><tr><td><p><strong>دانش‌بنیان</strong></p></td><td><p>کسب‌وکار یا محصولی که بر پایه دانش و فناوری ساخته شده است.</p></td></tr><tr><td><p><strong>داور و هیأت داوران</strong></p></td><td><p>کارشناسانی که آثار را بر اساس نمون‌برگ داوری ارزیابی می‌کنند؛ در هر مرحله دو تا پنج داور برای هر گرایش.</p></td></tr><tr><td><p><strong>دایرةالبروج</strong></p></td><td><p>مسیر ظاهری سالانه خورشید در میان ستارگان.</p></td></tr><tr><td><p><strong>دقیقه و ثانیه قوسی</strong></p></td><td><p>واحدهای کوچک زاویه؛ هر درجه ۶۰ دقیقه قوسی و هر دقیقه قوسی ۶۰ ثانیه قوسی است.</p></td></tr><tr><td><p><strong>دنباله‌دار</strong></p></td><td><p>جرمی از یخ و غبار که هنگام نزدیک شدن به خورشید، دنباله‌ای درخشان پیدا می‌کند.</p></td></tr><tr><td><p><strong>دوربین دوچشمی</strong></p></td><td><p>دو تلسکوپ کوچک کنار هم که آسمان را با هر دو چشم نشان می‌دهد.</p></td></tr><tr><td><p><strong>دوره اول متوسطه</strong></p></td><td><p>پایه‌های هفتم، هشتم و نهم.</p></td></tr><tr><td><p><strong>دوره تناوب</strong></p></td><td><p>مدت زمانی که یک پدیده تکراری، مانند تغییر نور ستاره یا گردش یک قمر، یک بار کامل تکرار می‌شود.</p></td></tr><tr><td><p><strong>دوره دوم ابتدایی</strong></p></td><td><p>پایه‌های چهارم، پنجم و ششم دبستان.</p></td></tr><tr><td><p><strong>دوره دوم متوسطه</strong></p></td><td><p>پایه‌های دهم، یازدهم و دوازدهم.</p></td></tr><tr><td><p><strong>ذات‌الحلق</strong></p></td><td><p>ابزار نجومی قدیمی از چند حلقه که دایره‌های مهم آسمان را نشان می‌دهد.</p></td></tr><tr><td><p><strong>رادیوتلسکوپ</strong></p></td><td><p>تلسکوپی که به‌جای نور مرئی، امواج رادیویی اجرام آسمانی مانند خورشید را دریافت می‌کند.</p></td></tr><tr><td><p><strong>راستی‌آزمایی</strong></p></td><td><p>بررسی درستی و اصالت اثر، مستندات یا کارنامه؛ مثلاً با مصاحبه یا اسکن کد QR.</p></td></tr><tr><td><p><strong>راهنمای کاربر</strong></p></td><td><p>دفترچه‌ای که طرز استفاده درست و ایمن از محصول را توضیح می‌دهد.</p></td></tr><tr><td><p><strong>ربع و سدس</strong></p></td><td><p>ابزارهای قدیمی برای اندازه‌گیری ارتفاع خورشید و ستارگان، به شکل یک‌چهارم و یک‌ششم دایره.</p></td></tr><tr><td><p><strong>رصد</strong></p></td><td><p>مشاهده دقیق و برنامه‌ریزی‌شده آسمان، با چشم یا ابزار، همراه با ثبت نتایج.</p></td></tr><tr><td><p><strong>رهاساز</strong></p></td><td><p>سازوکاری که پرتابگر را از راه دور و با فاصله ایمن آزاد می‌کند.</p></td></tr><tr><td><p><strong>زیرسامانه</strong></p></td><td><p>هر بخش ماهواره یا کپسول، مانند منبع تغذیه، رایانه یا ارتباطات، که با بخش‌های دیگر کار می‌کند.</p></td></tr><tr><td><p><strong>ساعت آفتابی</strong></p></td><td><p>ابزاری که با سایه یک شاخص، ساعت روز را نشان می‌دهد.</p></td></tr><tr><td><p><strong>سامانه بازیابی</strong></p></td><td><p>وسیله‌ای مانند چتر که سرعت فرود را کم می‌کند تا محموله سالم به زمین برسد.</p></td></tr><tr><td><p><strong>سامانه سها (my.medu.ir)</strong></p></td><td><p>سامانه خدمات آموزشی وزارت آموزش و پرورش که ثبت‌نام و بارگذاری آثار در آن انجام می‌شود.</p></td></tr><tr><td><p><strong>ستاره دوتایی گرفتی</strong></p></td><td><p>دو ستاره که به دور هم می‌گردند و گاهی یکی جلوی دیگری را می‌گیرد و نورشان کم می‌شود؛ مانند رأس‌الغول.</p></td></tr><tr><td><p><strong>ستاره قطبی</strong></p></td><td><p>ستاره‌ای نزدیک قطب شمال آسمان که تقریباً ثابت دیده می‌شود؛ ارتفاع آن تقریباً برابر عرض جغرافیایی محل است.</p></td></tr><tr><td><p><strong>سفر یادگیری</strong></p></td><td><p>مسیر آموزشی گام‌به‌گام هر گرایش در برنامه آسمان‌نما که با پرسش همراه است و نمره آن تا ۱۰ امتیاز در داوری اثر دارد.</p></td></tr><tr><td><p><strong>سکوی پرتاب</strong></p></td><td><p>پایه‌ای که پرتابگر روی آن قرار می‌گیرد و از آنجا پرتاب می‌شود.</p></td></tr><tr><td><p><strong>سهمیه</strong></p></td><td><p>تعداد آثاری که از هر منطقه یا استان می‌توانند به مرحله بعد راه یابند.</p></td></tr><tr><td><p><strong>سیارک</strong></p></td><td><p>جرم سنگی کوچکی که به دور خورشید می‌گردد.</p></td></tr><tr><td><p><strong>سیاره فراخورشیدی</strong></p></td><td><p>سیاره‌ای که به دور ستاره‌ای غیر از خورشید می‌گردد.</p></td></tr><tr><td><p><strong>شاخص</strong></p></td><td><p>میله یا چوب عمودی که از روی طول و جهت سایه آن، حرکت ظاهری خورشید بررسی می‌شود.</p></td></tr><tr><td><p><strong>شبیه‌سازی پرواز</strong></p></td><td><p>پیش‌بینی رفتار پرتابگر با محاسبه یا نرم‌افزارهایی مانند OpenRocket، پیش از پرتاب.</p></td></tr><tr><td><p><strong>شدت سیگنال دریافتی (RSSI)</strong></p></td><td><p>عددی که قوی یا ضعیف بودن سیگنال رادیویی دریافتی را نشان می‌دهد.</p></td></tr><tr><td><p><strong>شکل‌های ظاهری ماه (اهله)</strong></p></td><td><p>تغییر بخش روشن ماه در طول ماه قمری، از هلال تا بدر و دوباره تا هلال.</p></td></tr><tr><td><p><strong>شناسنامه اثر</strong></p></td><td><p>نمون‌برگ ۱؛ فرمی که مشخصات اثر، اعضای تیم و توضیح کوتاه کار در آن نوشته می‌شود.</p></td></tr><tr><td><p><strong>شهاب</strong></p></td><td><p>رد نوری که از سوختن ذره‌ای کوچک از فضا در جو زمین پدید می‌آید.</p></td></tr><tr><td><p><strong>شیوه‌نامه اجرایی جشنواره</strong></p></td><td><p>بخشنامه اصلی وزارت آموزش و پرورش برای همه رشته‌های جشنواره علمی‌پژوهشی؛ این شیوه‌نامه بر پایه آن نوشته شده است.</p></td></tr><tr><td><p><strong>صورت فلکی</strong></p></td><td><p>گروهی از ستارگان که در آسمان نقش آشنایی می‌سازند و نام دارند؛ مانند شکارچی یا دب اکبر.</p></td></tr><tr><td><p><strong>ضامن ایمنی</strong></p></td><td><p>قطعه‌ای که تا پیش از آمادگی کامل، جلوی پرتاب ناخواسته را می‌گیرد.</p></td></tr><tr><td><p><strong>طول جغرافیایی</strong></p></td><td><p>فاصله زاویه‌ای یک مکان به سمت شرق یا غرب از نصف‌النهار مبدأ، بر حسب درجه.</p></td></tr><tr><td><p><strong>عرض جغرافیایی</strong></p></td><td><p>فاصله زاویه‌ای یک مکان از خط استوا به سمت شمال یا جنوب، بر حسب درجه.</p></td></tr><tr><td><p><strong>علم شهروندی</strong></p></td><td><p>مشارکت مردم و دانش‌آموزان در پژوهش‌های واقعی علمی، مثلاً با تحلیل داده‌های آماده نجومی.</p></td></tr><tr><td><p><strong>فاصله کانونی</strong></p></td><td><p>فاصله عدسی یا آینه اصلی تلسکوپ تا نقطه‌ای که تصویر در آن تشکیل می‌شود.</p></td></tr><tr><td><p><strong>فایل فشرده (ZIP)</strong></p></td><td><p>یک فایل که چند فایل دیگر را در خود جا می‌دهد تا همه با هم ارسال شوند؛ پوشه مستندات با نام کد تیم فشرده می‌شود.</p></td></tr><tr><td><p><strong>فشارسنج</strong></p></td><td><p>وسیله‌ای که فشار هوای داخل پرتابگر را نشان می‌دهد.</p></td></tr><tr><td><p><strong>فناوری‌های ارتباط بی‌سیم (Wi-Fi، Bluetooth، LoRa)</strong></p></td><td><p>روش‌های ارسال داده بدون سیم؛ LoRa برای فاصله‌های دور با مصرف انرژی کم مناسب است.</p></td></tr><tr><td><p><strong>فیلتر خورشیدی</strong></p></td><td><p>فیلتر استانداردی که جلوی ابزار نصب می‌شود تا رصد خورشید بی‌خطر باشد؛ بدون آن هرگز نباید به خورشید نگاه کرد.</p></td></tr><tr><td><p><strong>قالب‌های فایل (PDF، MP4، Excel، CSV)</strong></p></td><td><p>PDF برای سندهایی که روی همه دستگاه‌ها یکسان دیده می‌شوند، MP4 برای فیلم، Excel برای صفحه‌گسترده و CSV برای جدول ساده داده.</p></td></tr><tr><td><p><strong>قانون سوم کپلر</strong></p></td><td><p>رابطه دوره گردش و اندازه مدار: نسبت مکعب شعاع مدار به مجذور دوره تناوب، برای همه قمرهای یک سیاره ثابت است.</p></td></tr><tr><td><p><strong>قدر</strong></p></td><td><p>عددی برای بیان درخشندگی ستاره؛ هرچه قدر کمتر باشد، ستاره پرنورتر است.</p></td></tr><tr><td><p><strong>قطب استانی</strong></p></td><td><p>پژوهش‌سرایی که برگزاری و داوری مرحله استانی مسابقات نجوم را در استان بر عهده دارد.</p></td></tr><tr><td><p><strong>قطب کشوری نجوم و فناوری‌های فضایی</strong></p></td><td><p>مرکزی که طراحی، آموزش، نظارت و داوری کشوری مسابقات نجوم را بر عهده دارد و از کانال شاد astrospace@ اطلاع‌رسانی می‌کند.</p></td></tr><tr><td><p><strong>قمر</strong></p></td><td><p>جرمی که به دور یک سیاره می‌گردد؛ مانند ماه برای زمین یا قمرهای گالیله‌ای برای مشتری.</p></td></tr><tr><td><p><strong>قیمت‌گذاری</strong></p></td><td><p>تعیین قیمت محصول بر پایه هزینه، ارزش آن برای کاربر و قیمت محصولات مشابه.</p></td></tr><tr><td><p><strong>کارآفرینی</strong></p></td><td><p>تبدیل ایده و دانش به محصول یا خدمتی که برای دیگران ارزش دارد.</p></td></tr><tr><td><p><strong>کاربرگ</strong></p></td><td><p>برگه‌ای برای ثبت مشاهدات و داده‌ها که دانش‌آموز آن را پر می‌کند.</p></td></tr><tr><td><p><strong>کاربرگ عمومی ثبت مشاهدات</strong></p></td><td><p>کاربرگی که برای پروژه‌های طراحی‌شده توسط خود دانش‌آموز (غیر از پروژه‌های پیشنهادی) به کار می‌رود.</p></td></tr><tr><td><p><strong>کاربر هدف</strong></p></td><td><p>گروهی از افراد که محصول برای رفع نیاز آن‌ها طراحی می‌شود.</p></td></tr><tr><td><p><strong>کارنامه سفر یادگیری</strong></p></td><td><p>تصویر نتیجه سفر یادگیری با نمره از ۱۰ و کد QR که جزو مستندات اثر ارسال می‌شود.</p></td></tr><tr><td><p><strong>کاوشگری</strong></p></td><td><p>کشف پدیده‌ها با پرسیدن و مشاهده مستقیم؛ نخستین گام مسیر رشد.</p></td></tr><tr><td><p><strong>کپسول مأموریت</strong></p></td><td><p>بخش جداشونده پرتابگر که محموله را حمل می‌کند و با چتر یا سامانه دیگر سالم فرود می‌آید.</p></td></tr><tr><td><p><strong>کپی‌برداری علمی</strong></p></td><td><p>استفاده از کار، نوشته یا طرح دیگران به نام خود، بدون ذکر منبع.</p></td></tr><tr><td><p><strong>کد تیم</strong></p></td><td><p>شناسه تیم در سامانه؛ پوشه فشرده مستندات اثر با همین نام بارگذاری می‌شود.</p></td></tr><tr><td><p><strong>کد QR</strong></p></td><td><p>کد مربعی که با دوربین تلفن همراه خوانده می‌شود و اطلاعاتی را نشان می‌دهد.</p></td></tr><tr><td><p><strong>کره سماوی</strong></p></td><td><p>کره‌ای خیالی که ستارگان روی آن دیده می‌شوند و زمین در مرکز آن است.</p></td></tr><tr><td><p><strong>کن‌ست (CanSat)</strong></p></td><td><p>ماهواره آموزشی بسیار کوچک به اندازه یک قوطی نوشابه؛ الگوی بخش علمی کپسول در فصل ۴.</p></td></tr><tr><td><p><strong>کهکشان راه شیری</strong></p></td><td><p>کهکشانی که منظومه شمسی در آن قرار دارد و در آسمان تاریک به‌صورت نواری کم‌نور دیده می‌شود.</p></td></tr><tr><td><p><strong>گایا (Gaia)</strong></p></td><td><p>تلسکوپ فضایی آژانس فضایی اروپا که موقعیت، فاصله و حرکت میلیاردها ستاره را اندازه می‌گیرد.</p></td></tr><tr><td><p><strong>گذر سیاره</strong></p></td><td><p>عبور سیاره از جلوی ستاره میزبانش که نور ستاره را اندکی کم می‌کند.</p></td></tr><tr><td><p><strong>گرایش</strong></p></td><td><p>هر یک از هشت شاخه مسابقات نجوم و فناوری‌های فضایی؛ مانند «کاوشگران کوچک آسمان» یا «ماهواره مکعبی».</p></td></tr><tr><td><p><strong>مالکیت فکری</strong></p></td><td><p>حق صاحب یک ایده، اختراع یا اثر برای استفاده از آن و جلوگیری از کپی دیگران.</p></td></tr><tr><td><p><strong>ماه‌گرفتگی و خورشیدگرفتگی</strong></p></td><td><p>ماه‌گرفتگی: رفتن ماه به سایه زمین؛ خورشیدگرفتگی: پوشیده شدن قرص خورشید با ماه.</p></td></tr><tr><td><p><strong>ماه نو</strong></p></td><td><p>زمانی که ماه تقریباً میان زمین و خورشید است و بخش روشن آن دیده نمی‌شود.</p></td></tr><tr><td><p><strong>ماهواره مکعبی (CubeSat)</strong></p></td><td><p>ماهواره کوچک استاندارد که واحد پایه آن (1U) مکعبی به ضلع حدود ۱۰ سانتی‌متر است.</p></td></tr><tr><td><p><strong>محموله</strong></p></td><td><p>باری که پرتابگر یا ماهواره حمل می‌کند؛ مانند تخم‌مرغ خام در فصل ۴ یا حسگرها در ماهواره.</p></td></tr><tr><td><p><strong>مدار</strong></p></td><td><p>مسیری که یک جرم به دور جرم دیگر می‌پیماید.</p></td></tr><tr><td><p><strong>مرحله استانی</strong></p></td><td><p>مرحله دوم که آثار برگزیده منطقه‌ها در قطب استانی داوری می‌شوند.</p></td></tr><tr><td><p><strong>مرحله کشوری</strong></p></td><td><p>مرحله پایانی که آثار برگزیده استان‌ها در قطب کشوری داوری می‌شوند.</p></td></tr><tr><td><p><strong>مرحله منطقه‌ای</strong></p></td><td><p>نخستین مرحله مسابقات که در پژوهش‌سرای منطقه برگزار می‌شود.</p></td></tr><tr><td><p><strong>مستندات اثر</strong></p></td><td><p>همه فایل‌هایی (فرم، عکس، فیلم، داده) که همراه اثر فرستاده می‌شوند تا داور بتواند کار را بررسی کند.</p></td></tr><tr><td><p><strong>مسیر رشد دانش‌آموز</strong></p></td><td><p>ترتیب گام‌های کاوشگری تا کارآفرینی که گرایش‌ها بر اساس آن چیده شده‌اند (بند «پ» بخش اول).</p></td></tr><tr><td><p><strong>مصاحبه</strong></p></td><td><p>گفت‌وگوی داوران با دانش‌آموز درباره اثر، برای سنجش فهم او و اطمینان از اینکه کار خود اوست.</p></td></tr><tr><td><p><strong>مقارنه</strong></p></td><td><p>نزدیک دیده شدن دو یا چند جرم آسمانی در آسمان.</p></td></tr><tr><td><p><strong>منبع تغذیه</strong></p></td><td><p>بخش تأمین برق ماهواره یا کپسول؛ مانند باتری و مدار تنظیم ولتاژ.</p></td></tr><tr><td><p><strong>منحنی نور</strong></p></td><td><p>نموداری که تغییر درخشندگی (قدر) یک ستاره را در طول زمان نشان می‌دهد.</p></td></tr><tr><td><p><strong>مهارت‌ورزی</strong></p></td><td><p>به کار بردن دانش در ساخت، اندازه‌گیری و کار با ابزار.</p></td></tr><tr><td><p><strong>میدان دید (FOV)</strong></p></td><td><p>بخشی از آسمان که هم‌زمان در تلسکوپ یا دوربین دیده می‌شود.</p></td></tr><tr><td><p><strong>میکروکنترلر</strong></p></td><td><p>رایانه بسیار کوچک روی یک برد، مانند Arduino یا ESP32، که حسگرها و قطعات را کنترل می‌کند.</p></td></tr><tr><td><p><strong>مأموریت پایه</strong></p></td><td><p>بخش الزامی گرایش مأموریت فضایی: رساندن تخم‌مرغ خام به ارتفاع و بازگرداندن سالم آن.</p></td></tr><tr><td><p><strong>ناسا (NASA)</strong></p></td><td><p>سازمان ملی هوانوردی و فضایی ایالات متحده.</p></td></tr><tr><td><p><strong>نرم‌افزار نجومی</strong></p></td><td><p>برنامه رایانه یا تلفن همراه که آسمان هر زمان و مکان را شبیه‌سازی می‌کند.</p></td></tr><tr><td><p><strong>نقشه آسمان</strong></p></td><td><p>نقشه‌ای که جای ستارگان و صورت‌های فلکی را در آسمان نشان می‌دهد.</p></td></tr><tr><td><p><strong>نمون‌برگ</strong></p></td><td><p>فرم رسمی شیوه‌نامه؛ مانند نمون‌برگ شناسنامه اثر یا نمون‌برگ داوری.</p></td></tr><tr><td><p><strong>نمون‌برگ داوری</strong></p></td><td><p>جدول معیارها و امتیازهایی که داوران با آن هر اثر را ارزیابی می‌کنند (بند ۶ هر فصل).</p></td></tr><tr><td><p><strong>نمون‌برگ نظارت بر داوری</strong></p></td><td><p>فرمی که ناظر قطب کشوری با آن روند داوری مرحله استانی را بررسی می‌کند (پیوست ب).</p></td></tr><tr><td><p><strong>نوآوری</strong></p></td><td><p>طراحی راه‌حل یا سامانه‌ای تازه برای یک مسئله.</p></td></tr><tr><td><p><strong>واسنجی (کالیبراسیون)</strong></p></td><td><p>تنظیم و درجه‌بندی ابزار یا حسگر با مقایسه آن با یک مقدار معلوم.</p></td></tr><tr><td><p><strong>هلال ماه</strong></p></td><td><p>بخش روشن و باریک ماه که در روزهای آغاز ماه قمری دیده می‌شود.</p></td></tr><tr><td><p><strong>هوش مصنوعی</strong></p></td><td><p>ابزارهای رایانه‌ای مانند گفت‌وگونماها که متن، تصویر یا کد تولید می‌کنند؛ استفاده از آن‌ها قواعد ویژه دارد.</p></td></tr></table></div>", "kavoshgaran": "<p class=\"gh\"><strong>۱ـ۱. مقدمه:</strong></p><p>آسمان، بزرگ‌ترین آزمایشگاه طبیعت است که در دسترس همه قرار دارد و حتی با چشم غیرمسلح می‌توان در آن به کاوش پرداخت. در گرایش «کاوشگران کوچک آسمان»، دانش‌آموزان یک پدیده آسمانی را در یک بازه زمانی مشخص و به‌طور منظم مشاهده می‌کنند، مشاهدات خود را با دقت ثبت می‌کنند و با کنار هم گذاشتن آن‌ها، الگوها و تغییرات طبیعی آسمان را کشف می‌کنند.</p><p>هدف این گرایش، پرورش دقت، نظم و روحیه کاوشگری در دانش‌آموزان است. در این گرایش، دانش‌آموز تنها نگاه نمی‌کند؛ بلکه <strong>مشاهده می‌کند، ثبت می‌کند، مقایسه می‌کند و نتیجه می‌گیرد.</strong></p><p>در مسیر رشد دانش‌آموز در مسابقات (بند «پ» بخش اول)، این گرایش گام «کاوشگری» را برای دانش‌آموزان دوره دوم ابتدایی دنبال می‌کند: دانش‌آموز بدون نیاز به دانش تخصصی پیشین، پاسخ یک پرسش ساده را از راه مشاهده مستقیم آسمان می‌یابد.</p><p class=\"gh\"><strong>۱ـ۲. شرایط شرکت‌کنندگان:</strong></p><p>تمام دانش‌آموزان <strong>دوره دوم ابتدایی (پایه‌های چهارم، پنجم و ششم)</strong> می‌توانند <strong>به‌صورت انفرادی یا تیم دونفره</strong> در این گرایش شرکت‌کنند. شرایط مشترک ثبت‌نام و تیم‌ها در بند «ت» بخش اول آمده است.</p><p class=\"gh\"><strong>۱ـ۳. شرایط اختصاصی اثر:</strong></p><p><strong>۱ـ۳ـ۱. مراحل انجام کار:</strong> دانش‌آموز یکی از پروژه‌های پیشنهادی بند ۱ـ۳ـ۲ یا پروژه‌ای در همان سطح را انتخاب کرده و مراحل زیر را انجام می‌دهد:</p><p>۱- <strong>طرح پرسش:</strong> بیان یک پرسش ساده که پروژه به آن پاسخ می‌دهد؛ مانند «آیا ماه هر شب در یک ساعت، در یک جای آسمان دیده می‌شود؟»</p><p>۲- <strong>مشاهده منظم:</strong> مشاهده پدیده در زمان، مکان و شرایط مشخص و به تعداد دفعات تعیین‌شده.</p><p>۳- <strong>ثبت در کاربرگ</strong><strong> </strong><strong>ویژه پروژه</strong><strong>:</strong> ثبت هر مشاهده در کاربرگ مخصوص پروژه (پیوست پ در بخش سوم)، همراه با تاریخ، ساعت، مکان و وضعیت آسمان.</p><p>۴- <strong>نمایش یافته‌ها:</strong> ارائه نتایج در قالب جدول، نمودار ساده، نقاشی، نقشه یا هر قالب خلاقانه دیگر.</p><p>۵- <strong>نتیجه‌گیری:</strong> بیان الگو یا تغییری که کشف شده و پاسخ به پرسش ابتدایی.</p><p><strong>ت</strong><strong>ذکر مهم</strong><strong>: </strong>به‌منظور حفظ اصالت پژوهش و استمرار پایش‌های بلندمدت، مشاهدات نباید متکی به نرم‌افزارها یا اپلیکیشن‌های دیجیتال باشد و تمامی مراحل باید به‌شیوه میدانی و مستقیم انجام گیرد. در غیر این صورت اثر از مرحله داوری حذف می‌گردد.</p><p class=\"gh\"><strong>۱ـ۳ـ۲. پروژه‌های پیشنهادی:</strong></p><p>دانش‌آموز یکی از پروژه‌های پیشنهادی زیر را انتخاب می‌کند. شرح کامل هر پروژه و خروجی‌های آن در پیوست پ (بخش سوم) و کاربرگ ویژه هر پروژه پس از آن آمده است؛ با کلیک روی نام هر پروژه، شرح آن را ببینید:</p><p>الف) آسمان شهر من چقدر روشن است؟</p><p>ب) صورت فلکی من در حال سفر است</p><p>پ) ماه را دنبال کن</p><p>ت) ردپای خورشید</p><p>ث) بررسی سایه شاخص در طول دو ماه</p><p>ج) بررسی تغییر زمان غروب خورشید طی ۳۰ روز</p><p>چ) تقویم آسمان صاف</p><p>ح) کدام بخش آسمان ستاره بیشتری دارد؟</p><p>خ) دفترچه کاوشگر آسمان</p><p><strong>تذکر ۱:</strong> دانش‌آموزان می‌توانند به‌جز پروژه‌های پیشنهادی، پروژه‌هایی در همین سطح طراحی و اجرا نمایند و برای ثبت مشاهدات از کاربرگ عمومی (کاربرگ ۱) استفاده کنند. پروژه‌های طولانی‌تر و منظم‌تر که داده‌های بیشتری تولید می‌کنند، از امتیاز بیشتری برخوردارند.</p><p><strong>تذکر ۲:</strong> استفاده از ابزار رصدی مانند دوربین دوچشمی یا تلسکوپ در این گرایش الزامی نیست و هدف اصلی، مشاهده است. در صورت استفاده از ابزار، نقشه آسمان یا نرم‌افزار نجومی، نام آن در کاربرگ (بخش «ابزار یا نقشه مورد استفاده») ذکر شود.</p><p><strong>۱ـ۳ـ۳. کاربرگ ثبت مشاهدات:</strong> ثبت مشاهدات در <strong>کاربرگ مخصوص هر پروژه</strong> (پیوست پ در بخش سوم) الزامی است. کاربرگ را می‌توان به‌صورت کاغذی یا در قالب فایل Excel که قطب کشوری نجوم و فناوری‌های فضایی منتشر می‌کند، تکمیل نمود. ثبت تاریخ و ساعت هر مشاهده الزامی است.</p><p><strong>۱ـ۳ـ۴. ارائه یافته‌ها در قالب فیلم:</strong> دانش‌آموز یافته‌های خود را در قالب <strong>فیلم ۳ تا ۵ دقیقه‌ای</strong> ارائه می‌دهد و در آن، با زبان ساده و با زبان خود، پرسش پروژه، روش مشاهده، یافته‌ها و نتیجه را توضیح می‌دهد.</p><p class=\"gh\"><strong>۱ـ۳ـ۵. ایمنی:</strong></p><p>• نگاه مستقیم به خورشید، با چشم غیرمسلح یا با هر ابزار نوری، ممنوع است. در پروژه‌های خورشیدی فقط سایه‌ها مشاهده شوند.</p><p>• مشاهدات شبانه و خارج از منزل با حضور والدین یا مربی انجام شود.</p><p><strong>تذکر:</strong> به شرایط عمومی مسابقات در بند «ت» بخش اول شیوه‌نامه توجه شود.</p><p class=\"gh\"><strong>۱ـ۴. مستندات موردنیاز اثر:</strong></p><p>علاوه بر مستندات مشترک همه گرایش‌ها (بند «ت» بخش اول)، مستندات زیر نیز در همان فایل فشرده (ZIP) ارسال گردد:</p><p>۱- در نمون‌برگ ۱ (شناسنامه اثر): در توضیحات ۱ پرسش پروژه و در توضیحات ۲ شرح مختصر نوآوری‌ها آورده شود.</p><p>۲- <strong>کاربرگ ثبت مشاهدات</strong> تکمیل‌شده، به‌صورت تصویر کاغذ یا فایل Excel منتشرشده از سوی قطب کشوری (از همان کاربرگ پیشنهادی پیوست پ استفاده شود).</p><p>۳- مستندات کاوشگری مانند نقاشی‌ها، نقشه‌ها، جدول‌ها و نمودارها.</p><p>۴- <strong>فیلم ۳ تا ۵ دقیقه‌ای</strong> با فرمت MP4 و حجم حداکثر ۷۵ مگابایت.</p><p>۵- چند تصویر از مراحل انجام مشاهدات که حضور دانش‌آموز در آن‌ها مشخص باشد.</p><p class=\"gh\"><strong>۱ـ۵. مراحل اجرایی (فرایند داوری):</strong></p><p><strong>۱ـ۵ـ۱. مرحله منطقه‌ای:</strong> دانش‌آموزانی که در سامانه ثبت‌نام نموده‌اند، آثار خود را در موعد مقرر (تقویم اجرایی، پیوست الف) به پژوهش‌سرای منطقه ارسال می‌نمایند. آثار در این مرحله، تحت نظارت معاونت آموزش متوسطه منطقه و توسط پژوهش‌سرای دانش‌آموزی منطقه، بر اساس نمون‌برگ ۲ داوری شده و برگزیدگان مطابق با سهمیه منطقه به مرحله استانی معرفی می‌گردند. لازم است پژوهش‌سرای منطقه پیش از معرفی، آثار برگزیده را برای رفع نقاط ضعف و تقویت نقاط قوت راهنمایی نماید.</p><p><strong>۱ـ۵ـ۲. مرحله اول استانی:</strong> آثار توسط قطب استانی نجوم و فناوری‌های فضایی، تحت نظارت کارشناس نظارت و پیگیری امور پژوهش‌سراهای دانش‌آموزی استان، بر اساس نمون‌برگ ۲ داوری می‌شوند.</p><p><strong>۱ـ۵ـ۳. مرحله دوم استانی:</strong> شامل مصاحبه کوتاه و غیرحضوری (آنلاین) داوران با دانش‌آموز است که با پرسش‌های ساده و در فضایی صمیمی انجام می‌شود. حضور یکی از والدین یا مربی در کنار دانش‌آموز بلامانع است، اما پاسخ‌ها باید از سوی خود دانش‌آموز ارائه شود. در آثار تیمی، هر دو عضو به‌صورت همزمان شرکت می‌نمایند. قطب استانی پیش از معرفی آثار منتخب به قطب کشوری، آن‌ها را راهنمایی می‌نماید.</p><p><strong>۱ـ۵ـ۴. مرحله اول کشوری:</strong> آثار ارسالی از استان‌ها به‌صورت غیرحضوری و بر اساس نمون‌برگ ۲ ارزیابی می‌شوند و آثار منتخب با تأیید هیئت داوران به مرحله دوم کشوری راه می‌یابند.</p><p><strong>۱ـ۵ـ۵. مرحله دوم کشوری:</strong> شامل مصاحبه غیرحضوری (آنلاین) داوران با دانش‌آموز، به همان شیوه مرحله دوم استانی است. آثار منتخب پس از مصاحبه و بر اساس بالاترین امتیاز معرفی می‌گردند.</p><p class=\"gh\"><strong>۱ـ۶. نمون‌برگ داوری:</strong></p><p class=\"gh\"><strong>نمون‌برگ ۲: داوری غیرحضوری کاوشگران کوچک آسمان</strong></p><div class=\"tbl wide\"><table><tr><td colspan=\"2\"><p><strong>عنوان اثر:</strong></p></td><td colspan=\"2\"><p><strong>کد ثبت‌شده اثر در سامانه:</strong></p></td></tr><tr><td><p><strong>استان:</strong></p></td><td><p><strong>شهر:</strong></p></td><td><p><strong>منطقه/ناحیه:</strong></p></td><td><p><strong>نام مدرسه:</strong></p></td></tr><tr><td><p><strong>نام و نام خانوادگی دانش‌آموز/دانش‌آموزان</strong></p></td><td><p><strong>کد ملی</strong></p></td><td><p><strong>شماره تماس</strong></p></td><td><p><strong>پایه تحصیلی</strong></p></td></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr></table></div><div class=\"tbl wide\"><table><tr><td><p><strong>ردیف</strong></p></td><td><p><strong>معیار ارزیابی</strong></p></td><td><p><strong>حداکثر امتیاز</strong></p></td><td><p><strong>امتیاز کسب‌شده</strong></p></td><td><p><strong>توضیحات</strong></p></td></tr><tr><td><p>۱</p></td><td><p><strong>انتخاب موضوع و طرح پرسش:</strong> روشن بودن پرسش پروژه و تناسب آن با سن دانش‌آموز</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۲</p></td><td><p><strong>تداوم و نظم مشاهدات:</strong> انجام مشاهدات در زمان‌ها و دفعات تعیین‌شده و طول بازه مشاهده</p></td><td><p><strong>۱۳</strong></p></td><td></td><td></td></tr><tr><td><p>۳</p></td><td><p><strong>ثبت دقیق در کاربرگ:</strong> ثبت کامل تاریخ، ساعت، مکان، وضعیت آسمان و جزئیات هر مشاهده</p></td><td><p><strong>۱۳</strong></p></td><td></td><td></td></tr><tr><td><p>۴</p></td><td><p><strong>صحت علمی مشاهدات و نتیجه:</strong> درستی مشاهدات و هماهنگی نتیجه با داده‌های ثبت‌شده</p></td><td><p><strong>۱۴</strong></p></td><td></td><td></td></tr><tr><td><p>۵</p></td><td><p><strong>نمایش و تحلیل یافته‌ها:</strong> تهیه جدول، نمودار ساده یا نقشه و کشف الگو از روی داده‌ها</p></td><td><p><strong>۱۴</strong></p></td><td></td><td></td></tr><tr><td><p>۶</p></td><td><p><strong>خلاقیت در ارائه یافته‌ها:</strong> استفاده از قالب‌های مناسب و خلاقانه مانند نقاشی، نقشه و تقویم تصویری</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۷</p></td><td><p><strong>فیلم ارائه یافته‌ها:</strong> توضیح روشن پرسش، روش، یافته‌ها و نتیجه با زبان خود دانش‌آموز و رعایت زمان</p></td><td><p><strong>۱۳</strong></p></td><td></td><td></td></tr><tr><td><p>۸</p></td><td><p><strong>مستندات فرایند کار:</strong> تصاویر مراحل مشاهده که حضور دانش‌آموز را نشان دهد</p></td><td><p><strong>۵</strong></p></td><td></td><td></td></tr><tr><td><p>۹</p></td><td><p><strong>سفر یادگیری آسمان‌نما: </strong>نمره کارنامه سفر یادگیری همین گرایش در برنامه آسمان‌نما (۰ تا ۱۰)، پس از راستی‌آزمایی کد QR؛ در آثار تیمی میانگین نمره اعضا</p></td><td><p><strong>۱۰</strong></p></td><td></td><td></td></tr><tr><td colspan=\"2\"><p><strong>جمع نهایی امتیاز</strong></p></td><td><p><strong>۱۰۰</strong></p></td><td></td><td></td></tr></table></div><div class=\"tbl wide\"><table><tr><td colspan=\"3\"><p><strong>نام و نام خانوادگی داور اول منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p><p><strong>نام و نام خانوادگی داور دوم منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p><p><strong>نام و نام خانوادگی داور سوم منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p></td></tr><tr><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>مدیر پژوهش‌سرای دانش‌آموزی مجری</strong></p><p><strong>تاریخ و امضا</strong></p></td><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>مدیر پژوهش‌سرای قطب استانی نجوم و فناوری‌های فضایی</strong></p><p><strong>تاریخ و امضا</strong></p></td><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>کارشناس امور پژوهش‌سراهای دانش‌آموزی</strong></p><p><strong>تاریخ و امضا</strong></p></td></tr><tr><td colspan=\"3\"><p><strong>راهنمای داوری:</strong></p><p>۱- امتیازدهی متناسب با سن دانش‌آموزان دوره دوم ابتدایی انجام شود. ملاک اصلی، مشاهده واقعی و ثبت منظم است، نه زیبایی یا هزینه ارائه.</p><p>۲- پروژه‌های طولانی‌تر و منظم‌تر که داده‌های بیشتری تولید کرده‌اند، در ردیف‌های ۲ و ۵ امتیاز بیشتری می‌گیرند.</p><p>۳- در صورتی که شواهد نشان دهد مشاهدات یا نتیجه‌گیری عمدتاً توسط بزرگسالان انجام شده است، مطابق بند «ث» «وظایف و استانداردهای اخلاقی داوری» اقدام می‌شود.</p></td></tr></table></div><p class=\"gh\"><strong>پیوست پ: پروژه‌های پیشنهادی و کاربرگ‌های فصل ۱ (کاوشگران کوچک آسمان)</strong></p><p class=\"gh\"><strong>شرح پروژه‌های پیشنهادی</strong></p><p><strong>الف)</strong><strong> آسمان شهر من چقدر روشن است؟ </strong>(بررسی تأثیر آلودگی نوری بر تعداد ستارگان قابل مشاهده )</p><p>یک صورت فلکی شاخص (مانند شکارچی یا دب اکبر) در سه محل متفاوت (مرکز شهر، منطقه میانی و حاشیه شهر یا روستا) رصد و تعداد ستاره‌های قابل مشاهده آن روی یک نقشه چاپی یکسان برای هر سه محل (تهیه‌شده و چاپ‌شده از نرم‌افزارهای نجومی) علامت‌گذاری و شمرده می‌شود. رصد در هر سه محل با چشم غیرمسلح، در ساعت‌های نزدیک به هم و زمانی انجام شود که صورت فلکی دست‌کم ۳۰ درجه بالای افق باشد. در پایان، تعداد ستارگان سه محل با هم مقایسه می‌شود تا اثر آلودگی نوری بر دیدن آسمان شب مشخص شود. همچنین در صورت تمایل، پیشنهاد می‌شود آسمان با نقشه‌های برنامه جهانی علم شهروندی Globe at Night مقایسه شود؛ در این برنامه، شرکت‌کنندگان در شب‌های بدون ماه، یک صورت فلکی مشخص را با هفت نقشه که ستارگان کم‌نورتر را به‌تدریج نشان می‌دهند مقایسه می‌کنند. دانش‌آموز باید داده واقعی و مقایسه‌ای تولید کند. شمارش در هر محل دست‌کم دو بار و در شب‌های بدون ماه انجام شود.</p><p><strong>خروجی:</strong> نقشه‌های علامت‌گذاری‌شده، عکس از هر محل، کاربرگ الف و نمودار مقایسه سه محل.</p><p><strong>ب)</strong><strong> صورت فلکی من در حال سفر است</strong><strong>! (</strong>بررسی جابه‌جایی ظاهری یک صورت فلکی)</p><p>یک صورت فلکی شاخص (مانند دب اکبر، ذات‌الکرسی یا شکارچی)، از یک محل ثابت و در یک ساعت ثابت، در دست‌کم ۱۰ شب در طول یک ماه مشاهده و موقعیت آن در یک قاب ثابت (با نشانه‌های ثابت افق مانند درخت یا ساختمان) رسم می‌شود. در پایان، نقشه‌ها روی هم (یا با کمک کاغذ شفاف) مقایسه می‌شوند تا جابه‌جایی ظاهری صورت فلکی در طول ماه مشخص شود.</p><p><strong>خروجی:</strong> ۱۰ نقاشی هم‌اندازه با تاریخ و ساعت، کاربرگ ب و یک نقشه نهایی از مسیر جابه‌جایی ظاهری صورت فلکی.</p><p><strong>پ)</strong><strong> ماه را دنبال کن (</strong>بررسی تغییر اندازه بخش روشن ماه طی ۱۵ روز)</p><p>شکل ظاهری ماه و جای آن در آسمان، از یک محل ثابت و هر شب حدود نیم تا یک ساعت پس از غروب خورشید، از ابتدا تا نیمه ماه قمری (دست‌کم ۱۰ شب) ثبت و شکل ماه با رنگ‌آمیزی دایره‌های هم‌اندازه نمایش داده می‌شود. </p><p>هر شب، تاریخ، ساعت، شکل ماه، وضعیت آسمان و میزان تقریبی بخش روشن ماه ثبت می‌شود و در پایان، دانش‌آموز یک تقویم تصویری ماه می‌سازد و روند تغییر را تحلیل می‌کند.</p><p><strong>خروجی:</strong> کاربرگ پ (تقویم تصویری ماه) و توضیح روند تغییر شکل و جابه‌جایی ماه.</p><p><strong>ت)</strong><strong> ردپای خورشید</strong> (بررسی مسیر حرکت نوک سایه در طول یک روز)</p><p>یک شاخص (میله یا مداد) کاملاً عمود و ثابت در محلی آفتابی نصب و نوک سایه آن از صبح تا عصر، هر یک ساعت یک‌بار، روی صفحه علامت‌گذاری و طول سایه اندازه‌گیری می‌شود. شاخص در طول مشاهده به هیچ وجه جابه‌جا نشود. عمود بودن شاخص با گونیا یا شاقول بررسی شود. در پایان، نقاط به هم وصل می‌شوند و یک مسیر یا نقشه از حرکت سایه ایجاد می‌شود. </p><p><strong>خروجی:</strong> مسیر نوک سایه، کاربرگ ت، نمودار طول سایه در ساعات مختلف و تعیین زمان کوتاه‌ترین سایه.</p><p class=\"gh\"><strong>ث) بررسی سایه شاخص در طول دو ماه</strong></p><p>طول سایه یک شاخص ثابت، در یک ساعت مشخص (مثلاً ساعت ۱۲)، هر هفته یک‌بار و دست‌کم به مدت ۸ هفته اندازه‌گیری و ثبت می‌شود. در تمام مدت، محل و ارتفاع شاخص، محل اندازه‌گیری و ساعت اندازه‌گیری ثابت می‌ماند و ارتفاع شاخص نیز ثبت می‌شود.</p><p><strong>خروجی:</strong> کاربرگ ث، نمودار تغییر طول سایه و ارتباط آن با تغییر فصل.</p><p class=\"gh\"><strong>ج) بررسی تغییر زمان غروب خورشید طی ۳۰ روز</strong></p><p>زمان غروب خورشید (لحظه ناپدید شدن کامل قرص خورشید در افق) و محل آن روی افق غربی، نسبت به نشانه‌های ثابت (مانند ساختمان، کوه یا درخت)، به مدت ۳۰ روز از یک مکان ثابت ثبت می‌شود. برای حفظ ایمنی چشم، محل و زمان غروب از روی عکس یا با نگاه به نشانه‌های افق ثبت شود؛ خیره شدن به قرص خورشید، حتی هنگام غروب، و استفاده از دوربین دوچشمی یا تلسکوپ برای این کار ممنوع است.</p><p><strong>خروجی:</strong> کاربرگ ج، نقاشی افق با محل غروب در روزهای مختلف و نمودار تغییر زمان غروب.</p><p><strong>چ)</strong><strong> تقویم آسمان صاف (</strong>بررسی میزان مناسب بودن آسمان برای رصد طی ۳۰ روز)</p><p>وضعیت آسمان (صاف، نیمه‌ابری، ابری) به مدت ۳۰ شب، از یک مکان ثابت و در ساعتی مشخص (مثلاً ساعت ۲۱) ثبت می‌شود. </p><p>دانش‌آموز باید هر شب وضعیت آسمان را ثبت کند: صاف، نیمه‌ابری، ابری و در پایان مشخص کند: کدام شب‌ها برای رصد مناسب‌تر بوده است؟ و سپس نتایج را در قالب نمودار و تقویم تصویری یک‌ماهه نمایش دهد و تحلیل کند.</p><p><strong>خروجی:</strong> کاربرگ چ، نمودار تعداد شب‌های صاف، نیمه‌ابری و ابری و تعیین بهترین شب‌ها برای رصد.</p><p><strong>ح)</strong><strong> کدام بخش آسمان ستاره بیشتری دارد</strong><strong>؟</strong>(شمردن تعداد ستاره‌ها در بخشهای مختلف در ابتدا، وسط و انتهای ماه قمری )</p><p>از یک محل ثابت با آسمان نسبتاً تاریک و در ساعتی ثابت، در هر جهت (شمال، جنوب، شرق و غرب)، دانش‌آموز از درون یک لوله یا قاب مقوایی ثابت، به آسمان در ارتفاع حدود نیمه‌ی راه افق تا بالای سر نگاه می‌کند و ستاره‌های درون قاب را می‌شمارد؛ این کار سه بار تکرار و میانگین گرفته می‌شود. این شمارش در شب‌هایی در ابتدا، میانه و انتهای ماه قمری تکرار می‌شود تا اثر نور ماه نیز بررسی شود.</p><p><strong>خروجی:</strong> کاربرگ ح، نمودار تعداد ستارگان در هر بخش و نتیجه‌گیری درباره اثر نور ماه و نورهای شهری.</p><p><strong>خ)</strong><strong> دفترچه کاوشگر آسمان </strong>(تحلیل داده‌های آسمان طی ۳۰ شب)</p><p>هر شب، در ساعتی ثابت و از یک محل ثابت، تاریخ، ساعت، وضعیت آسمان، شکل ماه، صورت فلکی دیده‌شده و یک رویداد جالب در کاربرگ خ ثبت می‌شود و در پایان، اطلاعات ۳۰ شب تحلیل می‌شود.</p><p><strong>خروجی:</strong> کاربرگ خ و پاسخ به پرسش‌هایی مانند «چند شب صاف داشتیم؟»، «ماه چند شب دیده شد؟» و «کدام عوامل رصد را بهتر یا بدتر کردند؟»</p><p class=\"gh\"><strong>کاربرگ‌های ثبت مشاهدات</strong></p><p>برای هر پروژه پیشنهادی یک کاربرگ ویژه در ادامه آمده است. کاربرگ ۱ برای پروژه‌هایی است که دانش‌آموز خود طراحی می‌کند. در صورت نیاز به سطرهای بیشتر، از کاربرگ اضافه استفاده شود.</p><p class=\"gh\"><strong>کاربرگ ۱: کاربرگ عمومی ثبت مشاهدات</strong></p><div class=\"tbl wide\"><table><tr><td><p><strong>نام و نام خانوادگی دانش‌آموز/دانش‌آموزان:</strong></p></td><td><p><strong>پایه تحصیلی:</strong></p></td></tr><tr><td colspan=\"2\"><p><strong>پرسش پروژه:</strong></p></td></tr><tr><td><p><strong>محل مشاهده:</strong></p></td><td><p><strong>ابزار یا نقشه مورد استفاده:</strong></p></td></tr><tr><td colspan=\"2\"><p><strong>عنوان پروژه:</strong></p></td></tr></table></div><div class=\"tbl wide\"><table><tr><td><p><strong>ردیف</strong></p></td><td><p><strong>تاریخ</strong></p></td><td><p><strong>ساعت</strong></p></td><td><p><strong>وضعیت آسمان</strong></p></td><td><p><strong>آنچه مشاهده یا اندازه‌گیری شد</strong></p></td><td><p><strong>توضیح یا رویداد جالب</strong></p></td></tr><tr><td><p>۱</p></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td><p>۲</p></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td><p>۳</p></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td><p>۴</p></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td><p>۵</p></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td><p>۶</p></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td><p>۷</p></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td><p>۸</p></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td><p>۹</p></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td><p>۱۰</p></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td><p>۱۱</p></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td><p>۱۲</p></td><td></td><td></td><td></td ><td><p>۳</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۴</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۵</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۶</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۷</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۸</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۹</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۱۰</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۱۱</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۱۲</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۱۳</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۱۴</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۱۵</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۱۶</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۱۷</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۱۸</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۱۹</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۲۰</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۲۱</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۲۲</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۲۳</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۲۴</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۲۵</p></td><td></td><td></td><td></td><td
