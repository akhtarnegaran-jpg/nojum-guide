ong>آماده‌سازی داده‌ها:</strong> مرتب‌سازی و پاک‌سازی در حد نیاز، و ذکر داده‌های کنارگذاشته‌شده و دلیل آن.</p><p>۵- <strong>تحلیل:</strong> انجام محاسبات و رسم جدول‌ها و نمودارها با روش مناسب.</p><p>۶- <strong>تفسیر و مقایسه:</strong> بیان معنای نجومی نتایج و مقایسه آن‌ها با نتایج مقاله پایه.</p><p>۷- <strong>محدودیت‌ها:</strong> بیان منابع خطا، محدودیت‌های داده و روش و میزان تعمیم‌پذیری نتیجه.</p><p>۸- <strong>نتیجه‌گیری و ارائه:</strong> پاسخ به پرسش پژوهش در گزارش و فیلم.</p><p><strong>۶ـ۳ـ۴. ابزار تحلیل:</strong> تحلیل با نرم‌افزار Excel یا هر صفحه‌گسترده دیگر کاملاً پذیرفته است و برنامه‌نویسی (مانند Python) شرط ورود نیست. تحلیل‌های پیشرفته‌تر، در صورت استفاده درست و تسلط دانش‌آموز، در ارزیابی کیفیت تحلیل لحاظ می‌شوند. نام و نسخه نرم‌افزارها و متن کدهای استفاده‌شده باید در مستندات بیاید.</p><p><strong>۶ـ۳ـ۵. گزارش پژوهش:</strong> گزارش در قالب Word و PDF، حداکثر در ۲۰ صفحه و مطابق جدول ۶ـ۱ (راهنمای تدوین گزارش پژوهش) تنظیم شود و شامل این بخش‌ها باشد: چکیده؛ مقدمه و معرفی مقاله پایه؛ پرسش پژوهش؛ داده‌ها و روش؛ نتایج (جدول‌ها، نمودارها و محاسبات)؛ بحث و مقایسه با مقاله پایه؛ محدودیت‌ها؛ نتیجه‌گیری؛ منابع.</p><p class=\"gh\"><strong>جدول ۶ـ۱: راهنمای تدوین گزارش پژوهش</strong></p><div class=\"tbl wide\"><table><tr><td><p>گزارش حداکثر در ۲۰ صفحه، با حاشیه ۱٫۵ سانتی‌متر از چهار طرف و با رعایت موارد زیر ارائه گردد:</p><p>متن اصلی به زبان فارسی، راست‌چین و تراز دوطرفه، فاصله بین خطوط ۱٫۱۵، تک‌ستونی، با قلم B Nazanin اندازه ۱۲.</p><p>عنوان: ۱ یا ۲ خط، قلم B Nazanin پررنگ، اندازه ۱۴.</p><p>نام نویسندگان و استاد راهنما: قلم B Nazanin پررنگ، اندازه ۱۰.</p><p>چکیده (خلاصه‌ای از پرسش، داده، روش و نتیجه): قلم B Nazanin، اندازه ۱۲؛ کلمات کلیدی حداکثر ۵ کلمه.</p><p>مقدمه و معرفی مقاله پایه: پرسش، داده، روش و نتیجه مقاله پایه.</p><p>پرسش پژوهش؛ داده‌ها و روش (منبع و مسیر دریافت داده، آماده‌سازی و روش تحلیل).</p><p>نتایج (جدول‌ها، نمودارها و محاسبات)؛ بحث و مقایسه با مقاله پایه؛ محدودیت‌ها؛ نتیجه‌گیری؛ پیشنهاد برای ادامه پژوهش.</p><p>منابع: منابع فارسی با قلم B Nazanin اندازه ۱۱ و منابع انگلیسی با قلم Times New Roman اندازه ۱۰، مطابق استانداردهای مرجع‌نویسی؛ پایگاه‌های داده نیز به‌عنوان منبع ذکر شوند.</p><p>شرح شکل‌ها و نمودارها در زیر آن‌ها و شرح جدول‌ها در بالای آن‌ها نوشته شود؛ همه عناوین اصلی با قلم B Nazanin پررنگ اندازه ۱۲.</p><p><strong>تذکر:</strong> رعایت این راهنما برای همه شرکت‌کنندگان این گرایش الزامی است.</p></td></tr></table></div><p><strong>۶ـ۳ـ۶. فیلم ارائه:</strong> شرکت‌کنندگان پژوهش خود را در یک فیلم ۱۰ تا ۱۵ دقیقه‌ای ارائه می‌دهند. ساختار پیشنهادی فیلم:</p><div class=\"tbl wide\"><table><tr><td><p><strong>بخش</strong></p></td><td><p><strong>زمان تقریبی</strong></p></td><td><p><strong>محتوا</strong></p></td></tr><tr><td><p><strong>معرفی</strong></p></td><td><p>۱ دقیقه</p></td><td><p>معرفی شرکت‌کنندگان، عنوان و پرسش پژوهش</p></td></tr><tr><td><p><strong>مقاله پایه</strong></p></td><td><p>۲ تا ۳ دقیقه</p></td><td><p>پرسش، داده، روش و نتیجه اصلی مقاله با زبان خود</p></td></tr><tr><td><p><strong>مسیر پژوهش</strong></p></td><td><p>۳ تا ۵ دقیقه</p></td><td><p>دریافت و آماده‌سازی داده، روش تحلیل و نمایش مراحل کار در نرم‌افزار</p></td></tr><tr><td><p><strong>نتایج و تفسیر</strong></p></td><td><p>۳ تا ۵ دقیقه</p></td><td><p>نمودارها، نتایج و مقایسه با مقاله پایه</p></td></tr><tr><td><p><strong>محدودیت‌ها و جمع‌بندی</strong></p></td><td><p>۱ دقیقه</p></td><td><p>خطاها، محدودیت‌ها، پاسخ به پرسش و پیشنهاد برای ادامه</p></td></tr></table></div><p>در آثار تیمی، هر یک از اعضا باید بخشی از ارائه را بر عهده داشته باشد.</p><p><strong>تذکر ۱:</strong> استفاده از هوش مصنوعی و ابزارهای مبتنی بر آن در خلاصه‌سازی مقاله، ترجمه، نگارش متن یا نوشتن کد، به شرط ذکر صریح در گزارش و ارسال پرامپت‌ها، بلامانع است؛ اما این ابزارها نباید جای فهم، تحلیل و تلاش علمی دانش‌آموز را بگیرند. شرکت‌کنندگان باید بر همه مراحل کار تسلط کامل داشته باشند و در مصاحبه بتوانند از آن دفاع کنند.</p><p><strong>تذکر ۲:</strong> در استفاده از داده‌ها و تصاویر پایگاه‌های علمی، شرایط استفاده و شیوه ارجاع‌دهی هر پایگاه داده که در راهنمای بسته آمده، رعایت شود.</p><p><strong>تذکر ۳:</strong> به شرایط عمومی مسابقات در بند «ت» بخش اول شیوه‌نامه توجه شود.</p><p class=\"gh\"><strong>۶ـ۴. مستندات موردنیاز اثر:</strong></p><p>علاوه بر مستندات مشترک همه گرایش‌ها (بند «ت» بخش اول)، مستندات زیر نیز در همان فایل فشرده (ZIP) ارسال گردد:</p><p>۱- در نمون‌برگ ۱ (شناسنامه اثر): در توضیحات ۱ عنوان بسته پژوهشی انتخاب‌شده، در توضیحات ۲ پرسش پژوهش و در توضیحات ۳ شرح مختصر نوآوری‌ها آورده شود.</p><p>۲- <strong>گزارش پژوهش</strong> در قالب Word و PDF (حداکثر ۲۰ صفحه).</p><p>۳- <strong>فیلم ارائه </strong><strong>۱۰</strong><strong> تا </strong><strong>۱۵</strong><strong> دقیقه‌ای</strong> با فرمت MP4 و حجم حداکثر ۲۰۰ مگابایت. عدم ارسال یا ناخوانا بودن فیلم موجب حذف اثر از داوری می‌شود.</p><p>۴- <strong>فایل‌های داده و تحلیل:</strong> داده‌های دریافت‌شده، فایل Excel یا صفحه‌گسترده تحلیل و متن کدها (در صورت استفاده).</p><p>۵- در بسته‌هایی که داده توسط دانش‌آموز دریافت می‌شود، <strong>شرح مسیر دریافت داده</strong> (نشانی، تاریخ، تنظیمات و تعداد داده‌ها).</p><p>۶- پرامپت‌های استفاده‌شده در ابزارهای مبتنی بر هوش مصنوعی (در صورت استفاده).</p><p>۷- تأییدیه رسمی مراکز علمی‌پژوهشی (در صورت مراجعه به این مراکز).</p><p class=\"gh\"><strong>۶ـ۵. مراحل اجرایی (فرایند داوری):</strong></p><p><strong>۶ـ۵ـ۱. مرحله منطقه‌ای:</strong> دانش‌آموزانی که در سامانه ثبت‌نام نموده‌اند، آثار خود را در موعد مقرر (تقویم اجرایی، پیوست الف) به پژوهش‌سرای منطقه ارسال می‌نمایند. آثار در این مرحله، تحت نظارت معاونت آموزش متوسطه منطقه و توسط پژوهش‌سرای دانش‌آموزی منطقه، بر اساس نمون‌برگ ۲ داوری شده و برگزیدگان مطابق با سهمیه منطقه به مرحله استانی معرفی می‌گردند. لازم است پژوهش‌سرای منطقه پیش از معرفی، آثار برگزیده را برای رفع نقاط ضعف و تقویت نقاط قوت راهنمایی نماید.</p><p><strong>۶ـ۵ـ۲. مرحله اول استانی:</strong> آثار توسط قطب استانی نجوم و فناوری‌های فضایی، تحت نظارت کارشناس نظارت و پیگیری امور پژوهش‌سراهای دانش‌آموزی استان، بر اساس نمون‌برگ ۲ داوری می‌شوند و آثار دارای بالاترین امتیاز به مرحله بعد معرفی می‌گردند.</p><p><strong>۶ـ۵ـ۳. مرحله دوم استانی:</strong> شامل مصاحبه غیرحضوری (آنلاین) داوران با صاحبان اثر برای راستی‌آزمایی موارد مندرج در نمون‌برگ ۲ است. در مصاحبه، فهم مقاله پایه، مسیر دریافت داده و روش تحلیل بررسی می‌شود و ممکن است از شرکت‌کنندگان خواسته شود بخشی از تحلیل را در حضور داوران تکرار یا توضیح دهند. در آثار تیمی، همه اعضا باید به‌صورت همزمان شرکت نمایند. قطب استانی پیش از معرفی آثار منتخب به قطب کشوری، آن‌ها را راهنمایی می‌نماید.</p><p><strong>۶ـ۵ـ۴. مرحله اول کشوری:</strong> آثار ارسالی از استان‌ها به‌صورت غیرحضوری و بر اساس نمون‌برگ ۲ ارزیابی می‌شوند و آثار منتخب با تأیید هیئت داوران به مرحله دوم کشوری راه می‌یابند.</p><p><strong>۶ـ۵ـ۵. مرحله دوم کشوری:</strong> شامل مصاحبه غیرحضوری (آنلاین) داوران با صاحبان اثر، به همان شیوه مرحله دوم استانی است. آثار منتخب پس از مصاحبه و بر اساس بالاترین امتیاز معرفی می‌گردند.</p><p class=\"gh\"><strong>۶ـ۶. نمون‌برگ داوری:</strong></p><p class=\"gh\"><strong>نمون‌برگ ۲: داوری غیرحضوری پژوهش و تحلیل داده‌های نجومی</strong></p><div class=\"tbl wide\"><table><tr><td colspan=\"2\"><p><strong>عنوان اثر:</strong></p></td><td colspan=\"2\"><p><strong>کد ثبت‌شده اثر در سامانه:</strong></p></td></tr><tr><td><p><strong>استان:</strong></p></td><td><p><strong>شهر:</strong></p></td><td><p><strong>منطقه/ناحیه:</strong></p></td><td><p><strong>بسته پژوهشی انتخاب‌شده:</strong></p></td></tr><tr><td><p><strong>نام و نام خانوادگی دانش‌آموز/دانش‌آموزان</strong></p></td><td><p><strong>کد ملی</strong></p></td><td><p><strong>شماره تماس</strong></p></td><td><p><strong>پایه تحصیلی</strong></p></td></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr></table></div><div class=\"tbl wide\"><table><tr><td><p><strong>ردیف</strong></p></td><td><p><strong>معیار ارزیابی</strong></p></td><td><p><strong>حداکثر امتیاز</strong></p></td><td><p><strong>امتیاز کسب‌شده</strong></p></td><td><p><strong>توضیحات</strong></p></td></tr><tr><td><p>۱</p></td><td><p><strong>فهم مقاله پایه:</strong> بیان درست پرسش، داده، روش و نتیجه مقاله با زبان خود، در گزارش و فیلم</p></td><td><p><strong>۱۴</strong></p></td><td></td><td></td></tr><tr><td><p>۲</p></td><td><p><strong>پرسش پژوهش:</strong> روشن و مشخص بودن پرسش و ارتباط آن با بسته و مقاله پایه</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۳</p></td><td><p><strong>دریافت و آماده‌سازی داده:</strong> مستندسازی منبع و مسیر دریافت داده، شناخت کمیت‌ها و واحدها و آماده‌سازی درست داده‌ها</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۴</p></td><td><p><strong>کیفیت تحلیل:</strong> انتخاب روش مناسب، درستی محاسبات و استفاده صحیح از نرم‌افزار</p></td><td><p><strong>۱۸</strong></p></td><td></td><td></td></tr><tr><td><p>۵</p></td><td><p><strong>نمودارها و جدول‌ها:</strong> درستی، خوانایی و تناسب نمودارها و جدول‌ها با پرسش پژوهش</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۶</p></td><td><p><strong>تفسیر علمی و مقایسه با مقاله پایه:</strong> استدلال علمی، معنای نجومی نتایج و مقایسه آن‌ها با مقاله پایه</p></td><td><p><strong>۱۳</strong></p></td><td></td><td></td></tr><tr><td><p>۷</p></td><td><p><strong>محدودیت‌ها و خطاها:</strong> شناخت منابع خطا و محدودیت‌های داده و روش</p></td><td><p><strong>۵</strong></p></td><td></td><td></td></tr><tr><td><p>۸</p></td><td><p><strong>ساختار گزارش و ارجاع‌دهی:</strong> رعایت قالب گزارش، نگارش علمی روشن و ارجاع درست به منابع و پایگاه‌های داده</p></td><td><p><strong>۵</strong></p></td><td></td><td></td></tr><tr><td><p>۹</p></td><td><p><strong>ارائه در فیلم و تسلط:</strong> انسجام ارائه، نمایش مسیر واقعی پژوهش و تسلط همه اعضا بر کار</p></td><td><p><strong>۸</strong></p></td><td></td><td></td></tr><tr><td><p>۱۰</p></td><td><p><strong>سفر یادگیری آسمان‌نما: </strong>نمره کارنامه سفر یادگیری همین گرایش در برنامه آسمان‌نما (۰ تا ۱۰)، پس از راستی‌آزمایی کد QR؛ در آثار تیمی میانگین نمره اعضا</p></td><td><p><strong>۱۰</strong></p></td><td></td><td></td></tr><tr><td colspan=\"2\"><p><strong>جمع نهایی امتیاز</strong></p></td><td><p><strong>۱۰۰</strong></p></td><td></td><td></td></tr></table></div><div class=\"tbl wide\"><table><tr><td colspan=\"3\"><p><strong>نام و نام خانوادگی داور اول منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p><p><strong>نام و نام خانوادگی داور دوم منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p><p><strong>نام و نام خانوادگی داور سوم منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p></td></tr><tr><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>مدیر پژوهش‌سرای دانش‌آموزی مجری</strong></p><p><strong>تاریخ و امضا</strong></p></td><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>مدیر پژوهش‌سرای قطب استانی نجوم و فناوری‌های فضایی</strong></p><p><strong>تاریخ و امضا</strong></p></td><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>کارشناس امور پژوهش‌سراهای دانش‌آموزی</strong></p><p><strong>تاریخ و امضا</strong></p></td></tr><tr><td colspan=\"3\"><p><strong>راهنمای داوری:</strong></p><p>• پیچیدگی ابزار تحلیل به‌خودی‌خود امتیاز ندارد؛ تحلیل درست و مستند با Excel می‌تواند امتیاز کامل ردیف ۴ را بگیرد.</p><p>• نتیجه‌ای که با مقاله پایه متفاوت است، اگر درست تحلیل و دلیل تفاوت به‌خوبی بحث شده باشد، ارزشمند است.</p><p>• اثری که فقط مقاله پایه را خلاصه کند و تحلیل داده نداشته باشد، در ردیف‌های ۳ تا ۷ امتیازی نمی‌گیرد.</p><p>• ناتوانی شرکت‌کنندگان در توضیح روش تحلیل یا تکرار بخشی از آن در مصاحبه، موجب کسر امتیاز از ردیف‌های مربوط می‌شود.</p></td></tr></table></div>", "cubesat": "<p class=\"gh\"><strong>۷ـ۱. مقدمه:</strong></p><p>ماهواره‌های مکعبی (CubeSat) از دستاوردهای نوین فناوری فضایی به شمار می‌روند که با ساختاری استاندارد، ابعاد کوچک و هزینه ساخت و توسعه نسبتاً پایین، فرصت‌های گسترده‌ای را برای آموزش، پژوهش و اجرای مأموریت‌های علمی فراهم کرده‌اند. این ماهواره‌ها که واحد پایه آن‌ها (1U) ابعادی در حدود ۱۰×۱۰×۱۰ سانتی‌متر دارد، با وجود اندازه کوچک، قابلیت انجام مأموریت‌های متنوعی همچون پایش شرایط محیطی، جمع‌آوری و پردازش داده‌ها، انجام آزمایش‌های علمی و برقراری ارتباط با ایستگاه‌های زمینی را دارند. ویژگی‌هایی همچون ساختار ساده‌تر، قابلیت توسعه و امکان طراحی مأموریت‌های متنوع، ماهواره‌های مکعبی را به بستری مناسب برای آموزش عملی مفاهیم علوم و مهندسی فضایی تبدیل کرده است.</p><p>در همین راستا، گرایش «ماهواره مکعبی» در هشتمین دوره مسابقات پژوهش‌سراهای دانش‌آموزی، با هدف شناسایی و پرورش استعدادهای دانش‌آموزی، تقویت خلاقیت و توسعه مهارت‌های علمی و فنی در حوزه فناوری فضایی برگزار می‌شود. در این گرایش، دانش‌آموزان در قالب تیم‌های مهندسی و با بهره‌گیری از دانش فیزیک، ریاضی، الکترونیک، برنامه‌نویسی و مخابرات، به تعریف یک مأموریت علمی مشخص، طراحی و ساخت ماهواره مکعبی آموزشی، راه‌اندازی ایستگاه زمینی و جمع‌آوری، ذخیره‌سازی و ارسال داده‌های واقعی می‌پردازند. در کنار طراحی و اجرای مأموریت، <strong>مستندسازی مراحل پروژه و ارائه گزارش علمی و فنی</strong> نیز از ارکان مهم این گرایش محسوب می‌شود. تیم‌ها باید فرایند شکل‌گیری ایده، اهداف و ضرورت مأموریت، انتخاب تجهیزات، طراحی و ساخت زیرسامانه‌ها، برنامه‌نویسی، آزمایش‌ها، داده‌های دریافتی، نتایج عملکرد و چالش‌های فنی را در قالب گزارشی منسجم ارائه دهند و با استناد به شواهد و نتایج آزمایش‌ها، دلایل تصمیم‌های مهندسی و میزان موفقیت مأموریت خود را تشریح کنند.</p><p>در مسیر رشد دانش‌آموز در مسابقات (بند «پ» بخش اول)، این گرایش در گام «نوآوری» قرار دارد: تیم، مأموریتی را تعریف می‌کند و برای تحقق آن، یک سامانه کامل را طراحی، ساخت و یکپارچه‌سازی می‌کند.</p><p class=\"gh\"><strong>۷ـ۲. شرایط شرکت‌کنندگان:</strong></p><p>تمام دانش‌آموزان <strong>دوره‌های اول و دوم متوسطه</strong> می‌توانند <strong>به‌صورت تیم دو یا سه‌نفره</strong> در این گرایش شرکت‌کنند. شرایط مشترک ثبت‌نام و تیم‌ها در بند «ت» بخش اول آمده است.</p><p><strong>تذکر:</strong> تقسیم نقش (سازه و توان، الکترونیک و نرم‌افزار، ارتباطات و ایستگاه زمینی) توصیه می‌شود؛ اما همه اعضا باید بر کل مأموریت مسلط باشند.</p><p class=\"gh\"><strong>۷ـ۳. شرایط اختصاصی اثر:</strong></p><p><strong>۷ـ۳ـ۱. اجزای مأموریت:</strong> در گرایش «ماهواره مکعبی»، هر تیم دانش‌آموزی موظف است با تعریف یک مأموریت علمی یا کاربردی مشخص، یک مدل مهندسی از ماهواره مکعبی آموزشی طراحی و ساخته و عملکرد آن را در شرایط آزمایشگاهی یا محیطی ارزیابی کند. مأموریت باید دارای هدفی روشن، قابل اندازه‌گیری و قابل ارزیابی باشد و تمامی مراحل جمع‌آوری، انتقال، دریافت و پردازش داده‌ها را در بر گیرد.</p><div class=\"tbl wide\"><table><tr><td><p><strong>جزء</strong></p></td><td><p><strong>شرح</strong></p></td></tr><tr><td><p><strong>تعریف مأموریت</strong></p></td><td><p>تعیین یک هدف علمی یا کاربردی مشخص که از طریق اندازه‌گیری پارامترهای فیزیکی یا محیطی قابل تحقق باشد. تیم باید هدف مأموریت، پارامترهای مورد اندازه‌گیری، کاربرد داده‌ها و نتایج مورد انتظار را مشخص کند.</p></td></tr><tr><td><p><strong>ماهواره مکعبی مدل (بخش فضایی)</strong></p></td><td><p>طراحی و ساخت یک مدل آموزشی ماهواره مکعبی در ابعاد 1U (تقریباً ۱۰×۱۰×۱۰ سانتی‌متر)، مجهز به حسگرهای متناسب با مأموریت، سامانه پردازش و ذخیره‌سازی داده‌ها، منبع تغذیه و تجهیزات ارتباطی لازم.</p></td></tr><tr><td><p><strong>سامانه ارتباطی</strong></p></td><td><p>طراحی و پیاده‌سازی یک یا چند لینک ارتباطی متناسب با نیاز مأموریت، به‌منظور انتقال داده‌های اندازه‌گیری‌شده از ماهواره مدل به ایستگاه زمینی و بررسی عملکرد و قابلیت اطمینان ارتباط.</p></td></tr><tr><td><p><strong>ایستگاه زمینی (بخش زمینی)</strong></p></td><td><p>طراحی و راه‌اندازی ایستگاه زمینی با قابلیت دریافت داده‌های ارسالی از ماهواره مدل، پردازش و تحلیل اطلاعات، نمایش نتایج و ذخیره‌سازی داده‌ها برای ارزیابی عملکرد مأموریت.</p></td></tr></table></div><p>مستندسازی و گزارش مأموریت: تیم‌ها موظف‌اند تمامی مراحل تعریف مأموریت، طراحی و ساخت ماهواره مدل، انتخاب حسگرها، پیاده‌سازی سامانه ارتباطی، راه‌اندازی ایستگاه زمینی، آزمایش‌ها و نتایج حاصل از پردازش داده‌ها را در قالب گزارش علمی و فنی مستند ارائه کنند. همچنین باید میزان دستیابی به اهداف مأموریت و دلایل انتخاب راهکارهای فنی خود را تشریح کنند.</p><p><strong>نکته مهم</strong> این است که مأموریت باید محور اصلی طراحی کل سامانه باشد؛ یعنی انتخاب حسگرها، تجهیزات ارتباطی، نحوه پردازش اطلاعات و ساختار ایستگاه زمینی همگی باید متناسب با هدف مأموریت انجام شوند.</p><p><strong>۷ـ۳ـ۲. نقشه راه ساخت:</strong> تیم‌های شرکت‌کننده موظف‌اند فرایند طراحی و اجرای مأموریت ماهواره مکعبی آموزشی خود را مطابق مراحل زیر برنامه‌ریزی و اجرا کنند. در هر مرحله، فعالیت‌های فنی و پژوهشی باید به‌صورت مستند ثبت شده و خروجی‌های مشخصی برای ارزیابی عملکرد سامانه ارائه شود. تمامی مراحل باید متناسب با اهداف مأموریت انتخابی و با تأکید بر هماهنگی میان ماهواره مدل، سامانه ارتباطی و ایستگاه زمینی انجام شوند.</p><div class=\"tbl wide\"><table><tr><td><p><strong>مرحله</strong></p></td><td><p><strong>کار</strong></p></td><td><p><strong>خروجی (شاهد داوری)</strong></p></td></tr><tr><td><p><strong>۱. تعریف مأموریت</strong></p></td><td><div class=\"tbl wide\"><table><tr><td></td><td><p>انتخاب یک مأموریت علمی یا کاربردی، تعیین اهداف، پارامترهای مورد اندازه‌گیری، کاربرد داده‌ها و معیارهای ارزیابی موفقیت مأموریت.</p></td></tr></table></div></td><td><p>شرح مأموریت، اهداف، کمیت‌های مورد اندازه‌گیری، نتایج مورد انتظار و معیارهای سنجش موفقیت.</p></td></tr><tr><td><p><strong>۲. </strong>طراحی مفهومی و معماری سامانه</p></td><td><p>تعیین ساختار کلی ماهواره مدل، انتخاب حسگرها، پردازنده، منبع تغذیه، تجهیزات ارتباطی و مشخص‌کردن ارتباط میان زیرسامانه‌ها و ایستگاه زمینی.</p></td><td><p>نمودار بلوکی سامانه، فهرست قطعات و تجهیزات، مشخصات فنی اجزا، برآورد مصرف توان و طرح اولیه جانمایی قطعات.</p></td></tr><tr><td><p><strong>۳. </strong>طراحی و ساخت ماهواره مدل</p></td><td><p>طراحی و ساخت بدنه ماهواره در ابعاد 1U، پیاده‌سازی مدارهای الکترونیکی، نصب حسگرها و تجهیزات ارتباطی و برنامه‌نویسی سامانه جمع‌آوری و ارسال داده‌ها.</p></td><td><p>مدل ساخته‌شده ماهواره، نقشه‌های طراحی، مدارهای الکترونیکی، مستندات برنامه‌نویسی و تصاویر مراحل ساخت.</p></td></tr><tr><td><p><strong>۴. </strong>آزمایش و کالیبراسیون حسگرها</p></td><td><p>بررسی عملکرد حسگرها، آزمایش اندازه‌گیری پارامترهای مأموریت، مقایسه داده‌ها با مقادیر مرجع و ارزیابی دقت و پایداری اندازه‌گیری‌ها.</p></td><td><p>جدول نتایج اندازه‌گیری، مستندات کالیبراسیون، نمودارهای مقایسه‌ای و تحلیل خطای حسگرها.</p></td></tr><tr><td><p><strong>۵. </strong>طراحی و راه‌اندازی سامانه ارتباطی</p></td><td><p>انتخاب و پیاده‌سازی یک یا چند لینک ارتباطی متناسب با مأموریت، تعیین ساختار داده‌های ارسالی و آزمایش انتقال اطلاعات از ماهواره مدل به گیرنده زمینی.</p></td><td><p>مشخصات لینک ارتباطی، ساختار بسته‌های داده، نتایج آزمون ارتباط، بررسی برد و کیفیت انتقال اطلاعات.</p></td></tr><tr><td><p><strong>۶. </strong>طراحی و راه‌اندازی ایستگاه زمینی</p></td><td><p>طراحی و پیاده‌سازی بخش سخت‌افزاری و نرم‌افزاری ایستگاه زمینی برای دریافت داده‌ها، پردازش اطلاعات، ذخیره‌سازی و نمایش نتایج اندازه‌گیری‌ها.</p></td><td><p>ایستگاه زمینی عملیاتی، نرم‌افزار دریافت و پردازش داده‌ها، تصاویر محیط نمایش اطلاعات و نمونه فایل‌های ثبت‌شده.</p></td></tr><tr><td><p><strong>۷. </strong>یکپارچه‌سازی زیرسامانه‌ها</p></td><td><p>اتصال و هماهنگ‌سازی حسگرها، پردازنده، سامانه تغذیه، تجهیزات ارتباطی و ایستگاه زمینی و بررسی عملکرد صحیح مجموعه به‌عنوان یک سامانه واحد.</p></td><td><p>مدل نهایی مونتاژشده، نقشه اتصالات، مستندات یکپارچه‌سازی و نتایج آزمون عملکرد زیرسامانه‌های متصل.</p></td></tr><tr><td><p><strong>۸. </strong>اجرای مأموریت و آزمون عملکرد سامانه</p></td><td><p>اجرای عملی مأموریت تعریف‌شده، جمع‌آوری داده‌های واقعی، ارسال اطلاعات به ایستگاه زمینی و بررسی صحت دریافت، پایداری عملکرد و قابلیت اطمینان سامانه.</p></td><td><p>فیلم اجرای مأموریت، فایل داده‌های دریافتی، گزارش آزمون‌ها، نتایج ارزیابی عملکرد و بررسی خطاهای احتمالی.</p></td></tr><tr><td><p><strong>۹. </strong>تحلیل نتایج و ارائه گزارش نهایی</p></td><td><p>پردازش و تحلیل داده‌های جمع‌آوری‌شده، ارزیابی میزان تحقق اهداف مأموریت، بررسی نقاط قوت و ضعف سامانه و ارائه نتایج علمی و فنی پروژه.</p></td><td><p>گزارش جامع مأموریت، نمودارها و نتایج تحلیل داده‌ها، مستندات فنی، جمع‌بندی عملکرد و پیشنهادهای بهبود سامانه.</p></td></tr></table></div><p class=\"gh\"><strong>۷ـ۳ـ۳. ماهواره مکعبی آموزشی: </strong></p><p class=\"gh\"><strong>الزامات فنی و عملکردی ماهواره مکعبی آموزشی</strong></p><p>در طراحی و ساخت ماهواره مکعبی آموزشی، رعایت ابعاد 1U، انتخاب تجهیزات متناسب با نیازهای مأموریت و توجه به هماهنگی زیرسامانه‌های سخت‌افزاری و نرم‌افزاری الزامی است. تیم‌ها در انتخاب قطعات، حسگرها، فناوری‌های ارتباطی و بسترهای نرم‌افزاری آزادی عمل دارند، مشروط بر آنکه الزامات فنی و عملکردی مندرج در جدول زیر رعایت شود.</p><div class=\"tbl wide\"><table><tr><td><p>زیرسامانه</p></td><td><p>الزامات فنی و عملکردی</p></td></tr><tr><td><p>۱. سازه و بدنه ماهواره</p></td><td><p>طراحی و ساخت بدنه ماهواره در ابعاد تعیین‌شده با استفاده از مواد مناسب مانند آلومینیوم، پلکسی‌گلاس، پلاستیک یا قطعات چاپ سه‌بعدی؛ جانمایی اصولی تجهیزات، تثبیت ایمن قطعات و فراهم‌کردن امکان دسترسی به اجزای داخلی برای بررسی و تعمیر.</p></td></tr><tr><td><p>۲. سامانه تأمین و مدیریت توان</p></td><td><p>تأمین انرژی زیرسامانه‌ها از طریق باتری مستقل و دارای مدار محافظ، مدیریت مصرف انرژی و پایش وضعیت باتری. استفاده از پنل خورشیدی و سامانه مدیریت شارژ به‌عنوان قابلیت تکمیلی قابل ارائه است.</p></td></tr><tr><td><p>۳. رایانه مرکزی و پردازش اطلاعات</p></td><td><p>استفاده از بردهای پردازشی یا میکروکنترلرهایی مانند Arduino، ESP32 یا نمونه‌های مشابه برای مدیریت عملکرد ماهواره، دریافت اطلاعات حسگرها، پردازش اولیه داده‌ها و کنترل فرایند ذخیره‌سازی و ارسال اطلاعات.</p></td></tr><tr><td><p>۴. سامانه حسگرها و اندازه‌گیری</p></td><td><p>انتخاب و به‌کارگیری حسگرهای متناسب با مأموریت برای اندازه‌گیری حداقل سه کمیت فیزیکی یا محیطی مرتبط، همراه با بررسی صحت و دقت داده‌ها از طریق آزمایش، کالیبراسیون یا مقایسه با تجهیزات مرجع.</p></td></tr><tr><td><p>۵. سامانه ذخیره‌سازی داده‌ها</p></td><td><p>ثبت و ذخیره‌سازی اطلاعات اندازه‌گیری‌شده در حافظه داخلی یا خارجی، همراه با شناسه یا زمان ثبت داده‌ها و امکان بازیابی اطلاعات برای پردازش یا ارسال به ایستگاه زمینی.</p></td></tr><tr><td><p>۶. سامانه ارتباطات و انتقال داده</p></td><td><p>طراحی و پیاده‌سازی لینک ارتباطی بی‌سیم میان ماهواره مدل و ایستگاه زمینی با استفاده از فناوری‌هایی مانند Wi-Fi، Bluetooth، LoRa یا سایر روش‌های ارتباطی مناسب. داده‌ها باید در قالب بسته‌های مشخص ارسال شوند و امکان بررسی صحت دریافت و کیفیت ارتباط وجود داشته باشد.</p></td></tr><tr><td><p>۷. نرم‌افزار کنترل و مدیریت مأموریت</p></td><td><p>برنامه‌نویسی و پیاده‌سازی نرم‌افزار داخلی ماهواره برای مدیریت حسگرها، کنترل فرایند اندازه‌گیری، ذخیره‌سازی و ارسال داده‌ها، پایش وضعیت زیرسامانه‌ها و شناسایی و ثبت خطاهای احتمالی.</p></td></tr><tr><td><p>۸. ایستگاه زمینی و سامانه دریافت اطلاعات</p></td><td><p>طراحی و راه‌اندازی ایستگاه زمینی متناسب با فناوری ارتباطی انتخاب‌شده، با قابلیت دریافت اطلاعات ارسالی از ماهواره، بررسی صحت داده‌ها، ذخیره‌سازی، پردازش و آماده‌سازی اطلاعات برای تحلیل و نمایش.</p></td></tr><tr><td><p>۹. پنل مدیریت، پردازش و نمایش داده‌ها</p></td><td><p>طراحی و توسعه یک پنل مدیریتی (Dashboard) در قالب صفحه وب مبتنی بر HTML و فناوری‌های مرتبط، وب‌سایت، نرم‌افزار رایانه‌ای یا اپلیکیشن موبایل، با قابلیت نمایش لحظه‌ای اطلاعات حسگرها، ارائه داده‌ها به‌صورت عددی و نموداری، نمایش وضعیت ارتباط، مشاهده اطلاعات ثبت‌شده و ارائه نتایج پردازش و تحلیل داده‌های مأموریت.</p></td></tr></table></div><p><strong>قابلیت‌های تکمیلی و نوآورانه:</strong> تیم‌ها می‌توانند متناسب با اهداف مأموریت، قابلیت‌هایی مانند ارتباط دوطرفه و ارسال فرمان از ایستگاه زمینی به ماهواره، مدیریت هوشمند انرژی، استفاده از پنل خورشیدی، پایش جهت‌گیری با حسگرهای اینرسی، ثبت و نمایش هشدارها، کنترل از راه دور، توسعه پنل‌های مدیریتی پیشرفته و استفاده از روش‌های نوین پردازش و تحلیل داده‌ها را به سامانه خود اضافه کنند. این قابلیت‌ها در صورت ارتباط با اهداف مأموریت و ارائه عملکرد عملی، می‌توانند به‌عنوان ویژگی‌های تکمیلی و نوآورانه مورد ارزیابی قرار گیرند.</p><p><strong>یکپارچه‌سازی و ارزیابی عملکرد:</strong> تمامی زیرسامانه‌ها باید در قالب یک سامانه هماهنگ عمل کنند؛ به‌گونه‌ای که داده‌های مرتبط با مأموریت توسط حسگرهای ماهواره اندازه‌گیری و جمع‌آوری شده، پس از پردازش اولیه و ذخیره‌سازی، از طریق لینک ارتباطی به ایستگاه زمینی منتقل شوند. در ایستگاه زمینی نیز اطلاعات باید به‌درستی دریافت، پردازش، تحلیل و در پنل مدیریتی نمایش داده شوند. تیم‌ها موظف‌اند این فرایند را به‌صورت عملی اجرا کرده و عملکرد سامانه را از نظر صحت اندازه‌گیری، کیفیت انتقال داده‌ها، پایداری ارتباط و میزان تحقق اهداف مأموریت ارزیابی کنند.</p><p><strong>مستندسازی و گزارش علمی و فنی:</strong> تیم‌های شرکت‌کننده موظف‌اند مراحل تعریف مأموریت، طراحی و ساخت ماهواره، انتخاب تجهیزات و حسگرها، طراحی مدارها، برنامه‌نویسی، پیاده‌سازی لینک ارتباطی، توسعه ایستگاه زمینی و پنل مدیریت، آزمایش‌های انجام‌شده و نتایج پردازش و تحلیل داده‌ها را در قالب گزارشی علمی و فنی ارائه کنند. گزارش باید شامل نقشه‌ها و نمودارهای طراحی، مشخصات تجهیزات، تصاویر مراحل ساخت، مستندات نرم‌افزاری، نمونه داده‌های ثبت‌شده، نتایج آزمایش‌ها، تحلیل خطاها و ارزیابی میزان موفقیت مأموریت باشد.</p><p class=\"gh\"><strong>۷ـ۳ـ۴. ایستگاه زمینی و سامانه ارتباطی:</strong></p><p> ایستگاه زمینی باید متناسب با مأموریت تعریف‌شده و فناوری ارتباطی ماهواره مدل طراحی و راه‌اندازی شود و قابلیت دریافت، پردازش، ذخیره‌سازی، تحلیل و نمایش اطلاعات را داشته باشد. ارتباط میان ماهواره و ایستگاه زمینی باید به‌صورت بی‌سیم و از طریق فناوری‌هایی مانند Wi-Fi، Bluetooth، LoRa یا سایر روش‌های ارتباطی مناسب برقرار شود.</p><p>تیم‌ها موظف‌اند یک پنل مدیریت و پایش اطلاعات (Dashboard) در قالب صفحه وب مبتنی بر HTML، وب‌سایت، نرم‌افزار رایانه‌ای یا اپلیکیشن طراحی و پیاده‌سازی کنند. این پنل باید امکان نمایش لحظه‌ای داده‌های حسگرها، وضعیت ارتباط، ولتاژ باتری و زمان آخرین داده دریافتی را فراهم کرده و اطلاعات مأموریت را به‌صورت عددی و نموداری نمایش دهد. همچنین قابلیت ثبت، ذخیره‌سازی و بازیابی اطلاعات، از جمله در قالب فایل CSV، و شناسایی بسته‌های داده ازدست‌رفته از طریق شماره‌گذاری بسته‌ها الزامی است.</p><p>آزمون عملکرد لینک ارتباطی باید در حداقل سه فاصله متفاوت و دو وضعیت جهت‌گیری آنتن یا فرستنده و گیرنده انجام شود. تیم‌ها موظف‌اند نتایج آزمایش‌ها را شامل تعداد بسته‌های ارسالی و دریافتی، درصد بسته‌های سالم، میزان ازدست‌رفتن داده‌ها و در صورت امکان قدرت سیگنال دریافتی (RSSI) ثبت و تحلیل کنند. نتایج این آزمون‌ها باید همراه با مستندات پنل مدیریت، نمونه داده‌های دریافتی و نمودارهای عملکرد ارتباط در گزارش علمی و فنی مأموریت ارائه شود.</p><p class=\"gh\"><strong>۷ـ۳ـ۵. الزامات ایمنی و مقررات:</strong></p><p>به‌منظور حفظ ایمنی شرکت‌کنندگان، تجهیزات، تمامی تیم‌ها موظف‌اند در مراحل طراحی، ساخت، آزمایش و اجرای مأموریت ماهواره مکعبی آموزشی، اصول ایمنی و مقررات مربوط را رعایت کنند.</p><p><strong>ایمنی عمومی:</strong> استفاده از مواد منفجره، مواد آتش‌زا، سامانه‌های پیشران، تجهیزات تولید شعله و منابع ولتاژ خطرناک در طراحی و ساخت ماهواره آموزشی ممنوع است.</p><p><strong>ایمنی سامانه تغذیه:</strong> استفاده از باتری‌های آسیب‌دیده، بادکرده یا فاقد شرایط ایمنی مجاز نیست. باتری‌ها باید دارای مدار حفاظتی مناسب باشند و فرایند شارژ، اتصالات الکتریکی و تأمین انرژی زیرسامانه‌ها مطابق اصول ایمنی الکتریکی انجام شود.</p><p><strong>ایمنی و مقررات ارتباطات بی‌سیم:</strong> استفاده از ماژول‌های ارتباطی آموزشی مانند Wi-Fi، Bluetooth، LoRa یا سایر تجهیزات مشابه، صرفاً در باندهای فرکانسی و محدوده توان مجاز و با رعایت مقررات سازمان تنظیم مقررات و ارتباطات رادیویی امکان‌پذیر است. هرگونه تغییر در توان خروجی یا تجهیزات ارتباطی باید در چارچوب مقررات مربوط انجام شود.</p><p><strong>محدودیت تجهیزات ارتباط ماهواره‌ای:</strong> در این گرایش، دریافت مستقیم سیگنال از ماهواره‌های واقعی و نصب یا بهره‌برداری از تجهیزات تخصصی دریافت ماهواره‌ای جزو فعالیت‌های مسابقه نیست. ارتباطات صرفاً میان ماهواره مکعبی مدل و ایستگاه زمینی طراحی‌شده توسط تیم‌ها برقرار می‌شود.</p><p><strong>ایمنی ساخت و آزمایش:</strong> تمامی قطعات الکترونیکی، سیم‌کشی‌ها، اتصالات، حسگرها و تجهیزات ارتباطی باید به‌صورت ایمن نصب شوند. انجام آزمایش‌ها نیز باید در محیط مناسب و با رعایت اصول ایمنی تجهیزات و افراد صورت گیرد.</p><p><strong>تبصره:</strong> مسئولیت رعایت الزامات ایمنی و مقررات مربوط در تمامی مراحل طراحی، ساخت و اجرای مأموریت بر عهده تیم شرکت‌کننده و مربی راهنمای آن است. رعایت این الزامات از شرایط ضروری پذیرش و ارزیابی پروژه خواهد بود.</p><p><strong>تذکر:</strong> استفاده از هوش مصنوعی در برنامه‌نویسی، طراحی یا نگارش، با ذکر صریح و ارسال پرامپت‌ها بلامانع است. به شرایط عمومی مسابقات در بند «ت» بخش اول شیوه‌نامه نیز توجه شود. </p><p class=\"gh\"><strong>۷ـ۴. مستندات موردنیاز اثر:</strong></p><p>تیم‌های شرکت‌کننده موظف‌اند علاوه بر مستندات مشترک همه گرایش‌ها (بند «ت» بخش اول)، مستندات پروژه را در همان فایل فشرده (ZIP)، شامل موارد زیر ارسال کنند:</p><p><strong>۱</strong><strong>. نمون‌برگ شماره </strong><strong>۱</strong><strong>:</strong> تکمیل نمون‌برگ شامل چکیده و اهداف مأموریت در توضیحات ۱، مشخصات فنی و قابلیت‌های ماهواره در توضیحات ۲ و نوآوری‌ها و ویژگی‌های متمایز پروژه در توضیحات ۳.</p><p><strong>۲</strong><strong>. گزارش علمی و فنی:</strong> ارائه گزارش در قالب PDF (حداکثر ۲۵ صفحه) مطابق نقشه راه پروژه، شامل تعریف مأموریت، مراحل طراحی و ساخت، مشخصات زیرسامانه‌ها، حسگرها، لینک ارتباطی، ایستگاه زمینی، نتایج آزمایش‌ها، تحلیل داده‌ها و چالش‌ها و اصلاحات انجام‌شده.</p><p><strong>۳</strong><strong>. فیلم ارائه و عملکرد پروژه:</strong> فیلمی حداکثر ۱۰ دقیقه‌ای با فرمت MP4 و حجم حداکثر ۱۵۰ مگابایت، شامل بخش‌های زیر به ترتیب:</p><p>• معرفی تیم، مأموریت و اهداف پروژه.</p><p>• نمایش ساختار ماهواره، تجهیزات و زیرسامانه‌ها.</p><p>• نمایش عملکرد حسگرها و جمع‌آوری داده‌ها.</p><p>• آزمون لینک ارتباطی و انتقال اطلاعات.</p><p>• نمایش پنل مدیریت تحت وب، نرم‌افزار یا اپلیکیشن ایستگاه زمینی.</p><p>• اجرای پیوسته چرخه مأموریت از اندازه‌گیری تا دریافت، پردازش و نمایش داده‌ها.</p><p>• تحلیل نتایج و جمع‌بندی عملکرد مأموریت.</p><p>تمامی اعضای تیم باید در ارائه مشارکت داشته باشند.</p><p><strong>۴</strong><strong>. فایل‌های طراحی:</strong> نقشه یا مدل سه‌بعدی بدنه، شماتیک مدارها یا دیاگرام بلوکی سامانه، فهرست قطعات و تصاویر مراحل ساخت.</p><p><strong>۵</strong><strong>. داده‌ها و کدها:</strong> فایل‌های داده و نتایج آزمایش‌ها در قالب CSV یا قالب‌های قابل بررسی، کدهای برنامه‌نویسی ماهواره و ایستگاه زمینی و فایل‌های مربوط به پنل مدیریت.</p><p><strong>۶</strong><strong>. مستندات هوش مصنوعی:</strong> نام ابزارها، موارد استفاده و پرامپت‌های اصلی در صورت بهره‌گیری از هوش مصنوعی.</p><p><strong>تذکر:</strong> ارسال کامل و خوانای مستندات و فیلم عملکرد پروژه الزامی است. نمونه فیزیکی و عملیاتی ماهواره نیز باید در مراحل حضوری یا به درخواست داوران ارائه شود.</p><p class=\"gh\"><strong>۷ـ۵. مراحل اجرایی (فرایند داوری):</strong></p><p><strong>۷ـ۵ـ۱. مرحله منطقه‌ای:</strong> تیم‌هایی که در سامانه ثبت‌نام نموده‌اند، آثار خود را در موعد مقرر (تقویم اجرایی، پیوست الف) به پژوهش‌سرای منطقه ارسال می‌نمایند. آثار در این مرحله، تحت نظارت معاونت آموزش متوسطه منطقه و توسط پژوهش‌سرای دانش‌آموزی منطقه، بر اساس نمون‌برگ ۲ و صرفاً بر پایه مستندات و فیلم داوری شده و برگزیدگان مطابق با سهمیه منطقه به مرحله استانی معرفی می‌گردند. لازم است پژوهش‌سرای منطقه پیش از معرفی، آثار برگزیده را برای رفع نقاط ضعف و تقویت نقاط قوت راهنمایی نماید.</p><p><strong>۷ـ۵ـ۲. مرحله اول استانی:</strong> آثار توسط قطب استانی نجوم و فناوری‌های فضایی، تحت نظارت کارشناس نظارت و پیگیری امور پژوهش‌سراهای دانش‌آموزی استان، بر اساس نمون‌برگ ۲ داوری می‌شوند و آثار دارای بالاترین امتیاز به مرحله بعد معرفی می‌گردند.</p><p><strong>۷ـ۵ـ۳. مرحله دوم استانی:</strong> شامل مصاحبه غیرحضوری (آنلاین) داوران با صاحبان اثر برای راستی‌آزمایی موارد مندرج در نمون‌برگ ۲ است و همه اعضای تیم باید به‌صورت همزمان شرکت نمایند. در مصاحبه ممکن است از تیم خواسته شود ماهواره را روشن کرده و ارسال و دریافت تله‌متری را به‌صورت زنده نشان دهد. قطب استانی در صورت فراهم بودن شرایط، می‌تواند این مرحله را به‌صورت حضوری برگزار نماید.</p><p><strong>۷ـ۵ـ۴. مرحله اول کشوری:</strong> آثار ارسالی از استان‌ها به‌صورت غیرحضوری و بر اساس نمون‌برگ ۲ ارزیابی می‌شوند و آثار منتخب با تأیید هیئت داوران به مرحله دوم کشوری راه می‌یابند.</p><p><strong>۷ـ۵ـ۵. مرحله دوم کشوری:</strong> شامل مصاحبه غیرحضوری (آنلاین) یا حضوری داوران با صاحبان اثر، به همان شیوه مرحله دوم استانی است. آثار منتخب پس از مصاحبه و بر اساس بالاترین امتیاز معرفی می‌گردند.</p><p class=\"gh\"><strong>۷ـ۶. نمون‌برگ داوری:</strong></p><p class=\"gh\"><strong>نمون‌برگ ۲: داوری غیرحضوری ماهواره مکعبی</strong></p><div class=\"tbl wide\"><table><tr><td colspan=\"3\"><p><strong>عنوان اثر:</strong></p></td><td colspan=\"4\"><p><strong>کد ثبت‌شده اثر در سامانه:</strong></p></td></tr><tr><td colspan=\"2\"><p><strong>استان:</strong></p></td><td><p><strong>شهر:</strong></p></td><td><p><strong>منطقه/ناحیه:</strong></p></td><td colspan=\"3\"><p><strong>دوره تحصیلی:</strong></p></td></ براسیون و مقایسه با مرجع (۳)، دقت و پایداری اندازه‌گیری‌ها (۳)</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۶</p></td><td><p><strong>رایانه مرکزی و نرم‌افزار مأموریت</strong></p></td><td colspan=\"2\"><p>مدیریت حسگرها و پردازش اولیه اطلاعات (۳)، ثبت، ذخیره‌سازی و بازیابی داده‌ها (۳)، مدیریت عملکرد زیرسامانه‌ها و شناسایی خطاها (۲)</p></td><td><p><strong>۸</strong></p></td><td></td><td></td></tr><tr><td><p>۷</p></td><td><p><strong>سامانه ارتباطی و انتقال داده‌ها</strong></p></td><td colspan=\"2\"><p>برقراری ارتباط بی‌سیم پایدار (۴)، ساختار بسته‌های داده و بررسی صحت دریافت (۳)، آزمون ارتباط در سه فاصله و دو وضعیت جهت‌گیری و تحلیل کیفیت انتقال (۴)</p></td><td><p><strong>۱۱</strong></p></td><td></td><td></td></tr><tr><td><p>۸</p></td><td><p><strong>ایستگاه زمینی و پنل مدیریت</strong></p></td><td colspan=\"2\"><p>دریافت صحیح اطلاعات (۳)، طراحی پنل تحت وب، نرم‌افزار یا اپلیکیشن و نمایش لحظه‌ای اطلاعات و وضعیت سامانه (۳)، پردازش داده‌ها و نمایش نمودارها (۳)، ذخیره‌سازی و بازیابی داده‌ها در قالب CSV (۲)، شناسایی بسته‌های ازدست‌رفته (۲)</p></td><td><p><strong>۱۳</strong></p></td><td></td><td></td></tr><tr><td><p>۹</p></td><td><p><strong>یکپارچه‌سازی و اجرای مأموریت</strong></p></td><td colspan=\"2\"><p>عملکرد هماهنگ زیرسامانه‌ها از اندازه‌گیری تا نمایش اطلاعات (۴)، پایداری و قابلیت اطمینان عملکرد سامانه (۳)، اجرای عملی و نمایش پیوسته چرخه مأموریت (۲)</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۱۰</p></td><td><p><strong>تحلیل داده‌ها و نتایج مأموریت</strong></p></td><td colspan=\"2\"><p>پردازش و ارائه نمودارهای تحلیلی (۳)، ارزیابی میزان تحقق اهداف و نتایج مأموریت (۲)، تحلیل خطاها و محدودیت‌های عملکرد سامانه (۲)</p></td><td><p><strong>۷</strong></p></td><td></td><td></td></tr><tr><td><p>۱۱</p></td><td><p><strong>مستندسازی و ارائه پروژه</strong></p></td><td colspan=\"2\"><p>گزارش علمی و فنی منطبق با نقشه راه (۳)، ارائه فایل‌های طراحی، کدها، داده‌ها و فیلم عملکرد (۲)، ثبت مشکلات و اصلاحات انجام‌شده (۱)، مشارکت اعضای تیم در ارائه (۱)</p></td><td><p><strong>۷</strong></p></td><td></td><td></td></tr><tr><td><p>۱۲</p></td><td><p><strong>خلاقیت و نوآوری</strong></p></td><td colspan=\"2\"><p>ارائه ایده‌ها و راهکارهای خلاقانه و قابلیت‌های تکمیلی مرتبط با مأموریت، همراه با اثبات عملکرد عملی آن‌ها</p></td><td><p><strong>۳</strong></p></td><td></td><td></td></tr><tr><td><p>۱۳</p></td><td><p><strong>سفر یادگیری آسمان‌نما</strong></p></td><td colspan=\"2\"><p>نمره کارنامه سفر یادگیری همین گرایش در برنامه آسمان‌نما (۰ تا ۱۰)، پس از راستی‌آزمایی کد QR؛ در آثار تیمی میانگین نمره اعضا</p></td><td><p><strong>۱۰</strong></p></td><td></td><td></td></tr><tr><td colspan=\"4\"><p><strong>جمع نهایی امتیاز</strong></p></td><td><p><strong>۱۰۰</strong></p></td><td></td><td></td></tr></table></div><div class=\"tbl wide\"><table><tr><td colspan=\"3\"><p><strong>نام و نام خانوادگی داور اول منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p><p><strong>نام و نام خانوادگی داور دوم منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p><p><strong>نام و نام خانوادگی داور سوم منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p></td></tr><tr><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>مدیر پژوهش‌سرای دانش‌آموزی مجری</strong></p><p><strong>تاریخ و امضا</strong></p></td><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>مدیر پژوهش‌سرای قطب استانی نجوم و فناوری‌های فضایی</strong></p><p><strong>تاریخ و امضا</strong></p></td><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>کارشناس امور پژوهش‌سراهای دانش‌آموزی</strong></p><p><strong>تاریخ و امضا</strong></p></td></tr><tr><td colspan=\"3\"><p><strong>راهنمای داوری:</strong></p><p>۱. <strong>ارزیابی مستند و مبتنی بر شواهد:</strong> امتیاز هر معیار بر اساس مستندات علمی و فنی، نتایج آزمایش‌ها، داده‌های ثبت‌شده و عملکرد قابل مشاهده در فیلم یا مراحل حضوری اختصاص می‌یابد. ادعاهای فاقد شواهد معتبر، امتیازی دریافت نخواهند کرد.</p><p>۲. <strong>تناسب با سطح تحصیلی:</strong> عمق طراحی، محاسبات، برنامه‌نویسی و تحلیل داده‌ها متناسب با دوره تحصیلی دانش‌آموزان ارزیابی می‌شود. استفاده از تجهیزات ساده و متعارف آموزشی، در صورت تحقق کامل الزامات فنی و عملکردی، مانع کسب امتیاز کامل نخواهد بود.</p><p>۳. <strong>اولویت عملکرد و قابلیت اطمینان:</strong> صحت اندازه‌گیری‌ها، پایداری ارتباط، عملکرد یکپارچه زیرسامانه‌ها و پردازش صحیح اطلاعات در ایستگاه زمینی بر پیچیدگی تجهیزات اولویت دارد. سامانه‌ای ساده، پایدار و قابل توضیح، ارزشمندتر از سامانه‌ای پیچیده با عملکرد نامطمئن است.</p><p>۴. <strong>ارزیابی خلاقیت و نوآوری:</strong> نوآوری‌ها و قابلیت‌های تکمیلی زمانی مشمول امتیاز می‌شوند که با اهداف مأموریت ارتباط داشته باشند و عملکرد آن‌ها به‌صورت عملی یا با شواهد معتبر اثبات شود.</p><p>۵. <strong>ارزیابی عملی و تسلط تیم:</strong> در مراحل حضوری، توانایی نمایش عملکرد واقعی ماهواره، لینک ارتباطی و پنل مدیریت، همراه با تسلط اعضای تیم بر طراحی و اجرای پروژه بررسی می‌شود. ناتوانی در نمایش یا تشریح بخش‌های ادعاشده، موجب کسر امتیاز از معیارهای مرتبط خواهد شد.</p><p>۶. <strong>رعایت الزامات و اصالت اثر:</strong> رعایت مقررات ایمنی، ارائه مستندات ضروری و اصالت فعالیت‌های طراحی، ساخت و برنامه‌نویسی الزامی است. موارد عدم انطباق مطابق ضوابط شیوه‌نامه بررسی و اعمال خواهد شد.</p></td></tr></table></div>", "karafarini": "<p class=\"gh\"><strong>۸ـ۱. مقدمه:</strong></p><p>ساعت آفتابی‌ای که سال‌ها در حیاط یک مدرسه زمان را نشان می‌دهد، نقشه آسمانی که یک خانواده با آن نخستین صورت فلکی را پیدا می‌کند، یا ماکت ماهواره‌ای که در یک پارک کنجکاوی کودکان را برمی‌انگیزد؛ همه این‌ها نمونه‌هایی از <strong>دانشی</strong> هستند که به <strong>ارزش</strong> تبدیل شده‌اند.</p><p>در گرایش «کارآفرینی دانش‌بنیان نجومی و فناوری‌های فضایی»، تیم دانش‌آموزی با تکیه بر دانش نجوم، <strong>محصولی</strong> طراحی کرده و می‌سازد که برای یک <strong>کاربر واقعی</strong> ارزش داشته باشد؛ چیزی که مدرسه، پارک، گروه نجوم آماتوری یا خانواده‌ای حاضر باشد از آن استفاده کند یا برای آن هزینه بپردازد. هدف این گرایش انعقاد قرارداد یا راه‌اندازی کسب‌وکار نیست؛ هدف آن است که دانش‌آموز تجربه کند چگونه یک نیاز را می‌شناسد، دانش علمی را در طراحی به کار می‌گیرد، محصولی دقیق و ایمن می‌سازد، آن را با کاربر می‌آزماید و هزینه و ارزش آن را می‌سنجد.</p><p>تفاوت این گرایش با گرایش «نجوم رصدی و ریاضیات نجومی» روشن است: در آنجا دانش‌آموز ابزار را می‌سازد تا <strong>خودش</strong> با آن اندازه‌گیری کند؛ در اینجا محصول برای <strong>دیگران</strong> ساخته می‌شود و باید درست کار کند، ماندگار باشد، راهنمای استفاده داشته باشد و کاربر بتواند به‌سادگی از آن بهره ببرد.</p><p>در مسیر رشد دانش‌آموز در مسابقات (بند «پ» بخش اول)، این گرایش گام پایانی، یعنی «کارآفرینی و ارزش‌آفرینی»، است: دانش نجوم به محصولی تبدیل می‌شود که برای یک کاربر واقعی ارزش دارد.</p><p class=\"gh\"><strong>۸ـ۲. شرایط شرکت‌کنندگان:</strong></p><p>تمام دانش‌آموزان <strong>دوره‌های اول و دوم متوسطه</strong> می‌توانند <strong>به‌صورت تیم دو یا سه‌نفره</strong> در این گرایش شرکت‌کنند. شرایط مشترک ثبت‌نام و تیم‌ها در بند «ت» بخش اول آمده است.</p><p><strong>تذکر:</strong> همه اعضای تیم باید بر اصول علمی و مراحل ساخت محصول تسلط داشته باشند.</p><p class=\"gh\"><strong>۸ـ۳. شرایط اختصاصی اثر:</strong></p><p><strong>۸ـ۳ـ۱. محصول:</strong> هر تیم یک محصول <strong>فیزیکی</strong> مرتبط با نجوم یا فناوری‌های فضایی طراحی و می‌سازد که سه ویژگی داشته باشد:</p><p>۱- <strong>کارکرد علمی درست:</strong> دانش نجومی در کارکرد محصول نقش اصلی داشته باشد و محصول به‌درستی و با دقت مشخص کار کند (نه فقط تزئین با نقش نجومی).</p><p>۲- <strong>کاربر مشخص:</strong> معلوم باشد محصول برای چه کسی و برای رفع چه نیازی ساخته شده است.</p><p>۳- <strong>ارزش قابل سنجش:</strong> کیفیت ساخت، ماندگاری، سهولت استفاده و منطق هزینه و قیمت آن قابل دفاع باشد.</p><p><strong>۸ـ۳ـ۲. فهرست ایده‌ها:</strong> تیم‌ها می‌توانند از ایده‌های زیر یا ایده‌های هم‌سطح دیگر در همین دسته‌ها استفاده کنند:</p><div class=\"tbl wide\"><table><tr><td><p><strong>دسته</strong></p></td><td><p><strong>محصول</strong></p></td><td><p><strong>نکته علمی یا فنی کلیدی</strong></p></td><td><p><strong>سطح پیشنهادی</strong></p></td></tr><tr><td rowspan=\"2\"><p><strong>الف) المان‌ها و سازه‌های نجومی فضای عمومی</strong></p></td><td><p>ساعت آفتابی افقی یا استوایی</p></td><td><p>شاخص موازی محور زمین (زاویه برابر عرض جغرافیایی)؛ تصحیح طول جغرافیایی و معادله زمان</p></td><td><p>دوره اول و دوم</p></td></tr><tr><td><p>ساعت آفتابی انسانی (بیضوی) در حیاط</p></td><td><p>سایه بازدیدکننده شاخص است؛ جای ایستادن بر اساس ماه سال تغییر می‌کند</p></td><td><p>دوره دوم</p></td></tr><tr><td rowspan=\"4\"><p><strong>الف) المان‌ها و سازه‌های نجومی فضای عمومی</strong></p></td><td><p>مدل مقیاسی منظومه شمسی در یک مسیر</p></td><td><p>مقیاس یکسان برای فاصله‌ها (و در صورت امکان اندازه‌ها)؛ تابلوی آموزشی هر سیاره</p></td><td><p>دوره اول و دوم</p></td></tr><tr><td><p>نشانگر طلوع و غروب خورشید در اعتدال‌ها و انقلاب‌ها</p></td><td><p>سمت طلوع و غروب در عرض جغرافیایی محل؛ الهام از بناهای نجومی ایرانی</p></td><td><p>دوره دوم</p></td></tr><tr><td><p>ماکت بزرگ ماهواره، کاوشگر یا تلسکوپ فضایی به‌عنوان المان شهری</p></td><td><p>تناسب درست ابعاد، اجزای اصلی و تابلوی معرفی دقیق مأموریت</p></td><td><p>دوره اول و دوم</p></td></tr><tr><td><p>کره سماوی یا ذات‌الحلق بزرگ</p></td><td><p>دایره‌های استوای سماوی، دایرةالبروج و محور قطبی با زاویه درست محل</p></td><td><p>دوره دوم</p></td></tr><tr><td rowspan=\"8\"><p><strong>ب) ابزارها و کیت‌های آموزشی</strong></p></td><td><p>نقشه چرخان آسمان (پلانیسفر) فارسی</p></td><td><p>طراحی برای عرض جغرافیایی ایران؛ نام‌های فارسی صورت‌های فلکی و ستارگان</p></td><td><p>دوره اول و دوم</p></td></tr><tr><td><p>اسطرلاب آموزشی با دفترچه راهنما</p></td><td><p>تصویر کردن کره آسمان بر صفحه برای عرض جغرافیایی محل؛ تمرین‌های کاربردی</p></td><td><p>دوره دوم</p></td></tr><tr><td><p>افلاک‌نمای مکانیکی (منظومه شمسی یا زمین-ماه-خورشید)</p></td><td><p>نسبت درست دوره‌های گردش با چرخ‌دنده یا تسمه</p></td><td><p>دوره دوم</p></td></tr><tr><td><p>مدل فازهای ماه، فصل‌ها یا گرفت‌ها</p></td><td><p>هندسه درست نور و سایه؛ قابل استفاده در کلاس</p></td><td><p>دوره اول</p></td></tr><tr><td><p>کیت ساخت ساعت آفتابی یا قطب‌نمای نجومی برای کلاس</p></td><td><p>قطعات آماده با دستورالعمل گام‌به‌گام و برگه فعالیت</p></td><td><p>دوره اول</p></td></tr><tr><td><p>دستگاه تصویر کردن خورشید (روزنه‌ای یا آینه‌ای)</p></td><td><p>مشاهده غیرمستقیم و ایمن خورشید و لکه‌ها یا گرفت‌ها</p></td><td><p>دوره اول و دوم</p></td></tr><tr><td><p>تلسکوپ آموزشی شکستی یا بازتابی با پایه دابسونی</p></td><td><p>محاسبه بزرگنمایی، نسبت کانونی و حد تفکیک؛ پایه پایدار؛ هم‌محورسازی؛ هشدار ایمنی خورشید</p></td><td><p>دوره اول و دوم</p></td></tr><tr><td><p>رادیوتلسکوپ آموزشی خورشید (بشقاب، LNB و سیگنال‌سنج)</p></td><td><p>دریافت گسیل رادیویی طبیعی خورشید؛ پهنای پرتو آنتن؛ آزمون گذر خورشید؛ فقط گیرنده و بدون فرستنده</p></td><td><p>دوره دوم</p></td></tr><tr><td rowspan=\"5\"><p><strong>پ) ابزارهای فناورانه برای منجمان آماتور</strong></p></td><td><p>پایه ردیاب ساده برای عکاسی نجومی</p></td><td><p>چرخش هم‌گام با چرخش زمین حول محور قطبی؛ آزمون با عکس نوردهی طولانی</p></td><td><p>دوره دوم</p></td></tr><tr><td><p>نگهدارنده تلفن همراه برای عکاسی از پشت چشمی</p></td><td><p>هم‌محوری دوربین و چشمی؛ سازگاری با چند نوع گوشی و چشمی</p></td><td><p>دوره اول و دوم</p></td></tr><tr><td><p>سنجنده آلودگی نوری آسمان</p></td><td><p>اندازه‌گیری درخشندگی آسمان شب با حسگر نور و کالیبراسیون</p></td><td><p>دوره دوم</p></td></tr><tr><td><p>ایستگاه پایش ابر و هوا برای رصدخانه</p></td><td><p>تشخیص ابر با حسگر دمای فروسرخ، رطوبت و نقطه شبنم</p></td><td><p>دوره دوم</p></td></tr><tr><td><p>ستاره‌نمای رومیزی</p></td><td><p>نقشه دقیق صورت‌های فلکی و چرخش آسمان برای عرض جغرافیایی محل</p></td><td><p>دوره دوم</p></td></tr><tr><td rowspan=\"2\"><p><strong>ت) فضاهای نجومی و آسمان‌نامه‌ها</strong></p></td><td><p>تجهیز اتاق یا گوشه نجوم مدرسه</p></td><td><p>مجموعه‌ای از ابزارها، تابلوها و فعالیت‌های آموزشی با درستی علمی</p></td><td><p>دوره اول و دوم</p></td></tr><tr><td><p>سقف یا دیوار آسمان‌نما</p></td><td><p>جای دقیق ستارگان و صورت‌های فلکی، با روشنایی متناسب با قدر ستارگان</p></td><td><p>دوره اول و دوم</p></td></tr><tr><td><p><strong>ت) فضاهای نجومی و آسمان‌نامه‌ها</strong></p></td><td><p>آسمان‌نامه سالانه یا نقشه و اطلس چاپی فارسی آسمان</p></td><td><p>داده‌های دقیق از منابع معتبر برای شهر یا منطقه؛ تصویر مناسب نقشه؛ نام‌های فارسی ستارگان؛ خوانایی زیر نور قرمز</p></td><td><p>دوره اول و دوم</p></td></tr></table></div><p><strong>تذکر:</strong> موارد زیر در این گرایش پذیرفته نمی‌شوند: (۱) محصولات تزئینی و صنایع دستی که دانش نجومی در کارکرد آن‌ها نقشی ندارد؛ (۲) محصولات صرفاً نرم‌افزاری؛ (۳) هر محصولی برای دیدن مستقیم خورشید (مانند عینک یا فیلتر خورشیدی دست‌ساز)، به دلیل خطر جدی برای چشم.</p><p><strong>۸ـ۳ـ۳. مسیر خلق ارزش:</strong> تیم مسیر زیر را طی کرده و خروجی هر مرحله را مستند می‌کند:</p><div class=\"tbl wide\"><table><tr><td><p><strong>مرحله</strong></p></td><td><p><strong>کار</strong></p></td><td><p><strong>خروجی (شاهد داوری)</strong></p></td></tr><tr><td><p><strong>۱. شناخت نیاز</strong></p></td><td><p>گفت‌وگو با کاربران احتمالی و تعریف کاربر هدف</p></td><td><p>برگه ارزش: کاربر، نیاز، ارزش پیشنهادی، محصولات مشابه</p></td></tr><tr><td><p><strong>۲. پشتوانه علمی</strong></p></td><td><p>استخراج اصول و محاسبات نجومی محصول</p></td><td><p>شرح اصول علمی و محاسبات (مثلاً زاویه شاخص، مقیاس، نسبت چرخ‌دنده‌ها)</p></td></tr><tr><td><p><strong>۳. طراحی</strong></p></td><td><p>بررسی چند گزینه و انتخاب طرح نهایی</p></td><td><p>طرح یا نقشه با ابعاد، فهرست مواد، دلیل انتخاب</p></td></tr><tr><td><p><strong>۴. ساخت نمونه</strong></p></td><td><p>ساخت نمونه نخست و نهایی</p></td><td><p>عکس و فیلم مراحل ساخت</p></td></tr><tr><td><p><strong>۵. آزمون عملکرد</strong></p></td><td><p>سنجش دقت و کارکرد در شرایط واقعی</p></td><td><p>جدول آزمون؛ مثلاً مقایسه زمان ساعت آفتابی با زمان رسمی در دست‌کم پنج نوبت</p></td></tr><tr><td><p><strong>۶. آزمون با کاربر</strong></p></td><td><p>استفاده کاربران واقعی و دریافت بازخورد</p></td><td><p>فرم بازخورد دست‌کم ۱۰ کاربر و اصلاحات انجام‌شده</p></td></tr><tr><td><p><strong>۷. منطق اقتصادی</strong></p></td><td><p>برآورد هزینه ساخت و قیمت پیشنهادی</p></td><td><p>جدول هزینه، قیمت پیشنهادی و دلیل آن</p></td></tr><tr><td><p><strong>۸. آماده‌سازی برای کاربر</strong></p></td><td><p>تهیه راهنمای استفاده</p></td><td><p>دفترچه راهنمای کاربر</p></td></tr></table></div><p><strong>۸ـ۳ـ۴. نردبان ارزش:</strong> ارزش محصول در پنج پله سنجیده می‌شود. پله‌های ۱ تا ۳ الزامی و پله‌های ۴ و ۵ امتیازی‌اند:</p><div class=\"tbl wide\"><table><tr><td><p><strong>پله</strong></p></td><td><p><strong>شاهد</strong></p></td><td><p><strong>وضعیت</strong></p></td></tr><tr><td><p>۱</p></td><td><p>محصول به‌درستی و با دقت مشخص کار می‌کند</p></td><td><p>الزامی</p></td></tr><tr><td><p>۲</p></td><td><p>کاربران واقعی آن را آزموده و بازخورد داده‌اند</p></td><td><p>الزامی</p></td></tr><tr><td><p>۳</p></td><td><p>هزینه ساخت، قیمت پیشنهادی و راهنمای استفاده مشخص است</p></td><td><p>الزامی</p></td></tr><tr><td><p>۴</p></td><td><p>دستورالعمل تولید نسخه‌های بعدی تهیه یا بیش از یک نمونه ساخته شده است</p></td><td><p>امتیازی</p></td></tr><tr><td><p>۵</p></td><td><p>شواهد فروش، پیش‌سفارش، سفارش یا نصب در محل یک میزبان (مانند مدرسه یا پارک) با تأیید آن مجموعه</p></td><td><p>امتیازی</p></td></tr></table></div><p class=\"gh\"><strong>۸ـ۳ـ۵. الزامات ایمنی:</strong></p><p>• سازه‌های فضای عمومی باید پایدار، بدون لبه تیز و مقاوم در برابر باد، باران و آفتاب باشند.</p><p>• کار با ابزار برش، جوش، هویه و دستگاه‌های برقی زیر نظر مربی و با تجهیزات حفاظتی انجام شود.</p><p>• محصولات برقی باید سیم‌کشی ایمن و منبع تغذیه مناسب داشته باشند.</p><p>• هیچ محصولی نباید کاربر را به دیدن مستقیم خورشید تشویق کند.</p><p>• تلسکوپ و دوربین فقط با فیلتر خورشیدی استاندارد که روی دهانه جلویی بسته می‌شود به سمت خورشید گرفته شوند؛ رادیوتلسکوپ آموزشی فقط گیرنده امواج طبیعی اجرام آسمانی است.</p><p><strong>تذکر:</strong> هر فروش، سفارش یا توافق باید مکتوب و با اطلاع و تأیید مربی و ولی انجام شود و ارائه شواهد ساختگی موجب حذف اثر است. مقدمات ارزش‌آفرینی، قیمت‌گذاری، مالکیت فکری و نمونه فرم سفارش در کتابچه راهنمای این گرایش آمده است.</p><p><strong>تذکر:</strong> استفاده از هوش مصنوعی در طراحی یا نگارش، با ذکر صریح و ارسال پرامپت‌ها بلامانع است. به شرایط عمومی مسابقات در بند «ت» بخش اول شیوه‌نامه نیز توجه شود.</p><p class=\"gh\"><strong>۸ـ۴. مستندات موردنیاز اثر:</strong></p><p>علاوه بر مستندات مشترک همه گرایش‌ها (بند «ت» بخش اول)، مستندات زیر نیز در همان فایل فشرده (ZIP) ارسال گردد:</p><p>۱- در نمون‌برگ ۱ (شناسنامه اثر): در توضیحات ۱ چکیده محصول، در توضیحات ۲ کاربر هدف و ارزش پیشنهادی و در توضیحات ۳ شرح مختصر نوآوری‌ها آورده شود.</p><p>۲- <strong>گزارش پروژه</strong> در قالب PDF (حداکثر ۲۰ صفحه) با ساختار مسیر خلق ارزش (بند ۸ـ۳ـ۳).</p><p>۳- <strong>فیلم ارائه</strong> حداکثر ۱۰ دقیقه‌ای با فرمت MP4 و حجم حداکثر ۱۵۰ مگابایت، شامل این بخش‌ها: (۱) نیاز و کاربر؛ (۲) اصول علمی؛ (۳) طراحی و ساخت؛ (۴) آزمون عملکرد؛ (۵) استفاده کاربران از محصول؛ (۶) هزینه، قیمت و ارزش. همه اعضا در ارائه سهم داشته باشند. عدم ارسال یا ناواضح بودن فیلم موجب حذف اثر از داوری می‌شود.</p><p>۴- <strong>دفترچه راهنمای کاربر</strong> محصول (PDF).</p><p>۵- <strong>فرم‌های بازخورد کاربران</strong> و جدول خلاصه آن‌ها.</p><p class=\"gh\"><strong>۶- جدول هزینه ساخت و قیمت پیشنهادی.</strong></p><p>۷- دستورالعمل تولید و مستندات فروش، پیش‌سفارش یا نصب (در صورت وجود).</p><p>۸- پرامپت‌های استفاده‌شده در ابزارهای مبتنی بر هوش مصنوعی (در صورت استفاده).</p><p><strong>تذکر:</strong> ارائه موافقت‌نامه با نهاد میزبان الزامی نیست. نمونه محصول در مراحل حضوری یا به درخواست داوران ارائه می‌شود.</p><p class=\"gh\"><strong>۸ـ۵. مراحل اجرایی (فرایند داوری):</strong></p><p><strong>۸ـ۵ـ۱. مرحله منطقه‌ای:</strong> تیم‌هایی که در سامانه ثبت‌نام نموده‌اند، آثار خود را در موعد مقرر (تقویم اجرایی، پیوست الف) به پژوهش‌سرای منطقه ارسال می‌نمایند. آثار در این مرحله، تحت نظارت معاونت آموزش متوسطه منطقه و توسط پژوهش‌سرای دانش‌آموزی منطقه، بر اساس نمون‌برگ ۲ و بر پایه مستندات و فیلم داوری شده و برگزیدگان مطابق با سهمیه منطقه به مرحله استانی معرفی می‌گردند. لازم است پژوهش‌سرای منطقه پیش از معرفی، آثار برگزیده را برای رفع نقاط ضعف و تقویت نقاط قوت راهنمایی نماید.</p><p><strong>۸ـ۵ـ۲. مرحله اول استانی:</strong> آثار توسط قطب استانی نجوم و فناوری‌های فضایی، تحت نظارت کارشناس نظارت و پیگیری امور پژوهش‌سراهای دانش‌آموزی استان، بر اساس نمون‌برگ ۲ داوری می‌شوند و آثار دارای بالاترین امتیاز به مرحله بعد معرفی می‌گردند.</p><p><strong>۸ـ۵ـ۳. مرحله دوم استانی:</strong> شامل مصاحبه غیرحضوری (آنلاین) داوران با صاحبان اثر برای راستی‌آزمایی موارد مندرج در نمون‌برگ ۲ است و همه اعضای تیم باید به‌صورت همزمان شرکت نمایند. در مصاحبه ممکن است از تیم خواسته شود کارکرد محصول را به‌صورت زنده نشان دهد. قطب استانی در صورت فراهم بودن شرایط، می‌تواند این مرحله را به‌صورت حضوری برگزار نماید.</p><p><strong>۸ـ۵ـ۴. مرحله اول کشوری:</strong> آثار ارسالی از استان‌ها به‌صورت غیرحضوری و بر اساس نمون‌برگ ۲ ارزیابی می‌شوند و آثار منتخب با تأیید هیئت داوران به مرحله دوم کشوری راه می‌یابند.</p><p><strong>۸ـ۵ـ۵. مرحله دوم کشوری:</strong> شامل مصاحبه غیرحضوری (آنلاین) یا حضوری داوران با صاحبان اثر، به همان شیوه مرحله دوم استانی است. آثار منتخب پس از مصاحبه و بر اساس بالاترین امتیاز معرفی می‌گردند.</p><p class=\"gh\"><strong>۸ـ۶. نمون‌برگ داوری:</strong></p><p class=\"gh\"><strong>نمون‌برگ ۲: داوری غیرحضوری کارآفرینی دانش‌بنیان نجومی و فناوری‌های فضایی</strong></p><div class=\"tbl wide\"><table><tr><td colspan=\"2\"><p><strong>عنوان اثر (نام محصول):</strong></p></td><td colspan=\"2\"><p><strong>کد ثبت‌شده اثر در سامانه:</strong></p></td></tr><tr><td><p><strong>استان:</strong></p></td><td><p><strong>شهر:</strong></p></td><td><p><strong>منطقه/ناحیه:</strong></p></td><td><p><strong>دوره تحصیلی:</strong></p></td></tr><tr><td><p><strong>نام و نام خانوادگی دانش‌آموزان</strong></p></td><td><p><strong>کد ملی</strong></p></td><td><p><strong>شماره تماس</strong></p></td><td><p><strong>پایه تحصیلی</strong></p></td></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr></table></div><div class=\"tbl wide\"><table><tr><td><p><strong>ردیف</strong></p></td><td><p><strong>معیار</strong></p></td><td><p><strong>شاهد قابل بررسی در /* ---------- router ---------- */

function route() {
  var h = (location.hash || '').slice(1), m;

  var sp = $('.splash'); if (sp) sp.remove();
  if (!entered || h === 'splash' || h === '') return splash();
  if (h === 'guide') return guideList();
  if ((m = h.match(/^g-([a-z]+)$/))) return guideRead(m[1]);
  if (h === 'books') return booksList();
  if ((m = h.match(/^b-([a-z]+)-(\d+)$/))) return reader(book(m[1]), +m[2]);
  if ((m = h.match(/^b-([a-z]+)$/))) return booklet(book(m[1]));
  if (h === 'quiz') return quizHome();
  if (h === 'reg') return register();
  if ((m = h.match(/^q-([a-z]+)$/))) return quizMap(m[1]);
  if ((m = h.match(/^qp-([a-z]+)-(\d+)$/))) return play(m[1], +m[2]);
  if ((m = h.match(/^card-([a-z]+)$/))) return cardView(m[1]);

/* ---------- registration ---------- */
var GRADES = ['چهارم', 'پنجم', 'ششم', 'هفتم', 'هشتم', 'نهم', 'دهم', 'یازدهم', 'دوازدهم'];
var BRANCHES = ['نظری — ریاضی و فیزیک', 'نظری — علوم تجربی', 'نظری — ادبیات و علوم انسانی', 'نظری — علوم و معارف اسلامی', 'فنی و حرفه‌ای', 'کاردانش'];
function isHigh(g) { return ['دهم', 'یازدهم', 'دوازدهم'].indexOf(g) >= 0; }
function gradeText(u) { if (!u) return ''; return 'پایه ' + u.grade + (isHigh(u.grade) && u.branch ? ' — ' + u.branch : ''); }
function register(next) {

    '<div class="fld photo"><div class="pv" id="pv">' + (photo ? '<img src="' + photo + '" alt=""/>' : IC.cam) + '</div><div><label>عکس (اختیاری)</label><input type="file" id="ph" accept="image/*" style="display:none"/><div class="row-btn"><button class="btn ghost" id="phb" type="button">' + IC.cam + 'انتخاب عکس</button>' + (photo ? '<button class="btn ghost" id="phd" type="button">حذف</button>' : '') + '</div></div></div>' +
    fld('fn', 'نام', u.fn, true) + fld('ln', 'نام خانوادگی', u.ln, true) +

    '<div class="fld" id="brw"' + (isHigh(u.grade) ? '' : ' hidden') + '><label for="br">رشته / شاخه <i>*</i></label><select id="br"><option value="">انتخاب کنید</option>' + BRANCHES.map(function (g) { return '<option' + (u.branch === g ? ' selected' : '') + '>' + g + '</option>'; }).join('') + '</select></div>' +
    fld('sc', 'نام مدرسه', u.school) + fld('hs', 'نام پژوهش‌سرا', u.house) + fld('ct', 'شهر / منطقه', u.city) +
    '<div class="err" id="er"></div><div class="row-btn"><button class="btn" id="ok">' + (S.user ? 'ذخیره تغییرات' : 'ثبت و شروع سفر') + '</button></div></div>');
  function fld(id, l, v, req) { return '<div class="fld"><label for="' + id + '">' + l + (req ? ' <i>*</i>' : '') + '</label><input id="' + id + '" value="' + esc(v || '') + '" autocomplete="off"/></div>'; }

  $('#ok').onclick = function () {
    var v = function (id) { return $('#' + id).value.trim(); };

    S.user = { fn: v('fn'), ln: v('ln'), grade: g, branch: isHigh(g) ? v('br') : '', school: v('sc'), house: v('hs'), city: v('ct'), photo: photo };

  };
}

/* ---------- quiz ---------- */
var PTS = [10, 6, 3, 1], QPER = 3, MAXSTAGE = 30;
function qs(id) { if (!S.quiz[id]) S.quiz[id] = { res: {} }; return S.quiz[id]; }
function qstat(id) {
  var Q = QZ[id], r = qs(id).res, pts = 0, stars = 0, n = 0;
  for (var k in r) { pts += r[k].pts; stars += r[k].stars; n++; }
  var max = Q.ST.length * MAXSTAGE;
  return { pts: pts, stars: stars, done: n, total: Q.ST.length, max: max, score: Math.round(pts / max * 200) / 10 };
}
function needUser(nx) { if (S.user) return false; try { sessionStorage.setItem('asman-next', nx); } catch (e) {} go('reg'); return true; }
function quizHome() {
  if (needUser('quiz')) return;
  setBar('سفر یادگیری');
  var u = S.user;
  render('<div class="qhead">' + avatar(u) + '<div><b style="font-size:15px">' + esc(u.fn + ' ' + u.ln) + '</b><br/><small style="color:var(--muted)">' + esc(gradeText(u)) + '</small></div><button class="btn ghost" id="ed" style="margin-inline-start:auto;padding:6px 12px;font-size:13px">ویرایش</button></div>' +
    '<p class="note2" style="margin:0 0 12px">در هر گرایش، مطلب به مطلب پیش برو: هر مرحله یک متن کوتاه از کتابچه راهنما و سه پرسش دارد. با پاسخ درست، مرحله بعد باز می‌شود. پاسخ درست در تلاش اول ۱۰ امتیاز، دوم ۶، سوم ۳ و بعد از آن ۱ امتیاز دارد. در هر مرحله می‌توانی کارنامه‌ات را بگیری.</p>' +
    trackGrid('q-', function (b) {
      if (!QZ[b.id]) return '<small>به‌زودی</small>';
      var s = qstat(b.id);
      return '<small>' + fa(s.done) + ' از ' + fa(s.total) + ' مرحله — نمره ' + fa(s.score) + ' از ۲۰</small><div class="prog"><i style="width:' + Math.round(100 * s.done / s.total) + '%"></i></div>';
    }));
  bindGrid(); $('#ed').onclick = function () { go('reg'); };
}
function unlocked(id, i) { return i === 0 || !!qs(id).res[i - 1]; }
function quizMap(id) {
  if (needUser('q-' + id)) return;
  var b = book(id), Q = QZ[id];
  if (!Q) { setBar(b.title); return render('<div class="empty">پرسش‌های این گرایش به‌زودی اضافه می‌شود.</div>'); }

  parts.forEach(function (p) { p.vy += .28; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--; fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.fillStyle = p.c; fctx.globalAlpha = Math.min(1, p.life / 30); fctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fctx.restore(); });
  anim = parts.length ? requestAnimationFrame(tick) : 0;
}

/* ---------- settings ---------- */
function settings() {
  var bg = document.createElement('div'); bg.className = 'sheet-bg';
  var sh = document.createElement('div'); sh.className = 'sheet';
  sh.innerHTML = '<div class="grip"></div><h3>تنظیمات</h3>' +
    '<div class="srow"><span>اندازه متن</span><span class="seg">' + [14, 16, 18, 20].map(function (v) { return '<button data-fs="' + v + '" aria-pressed="' + (S.fs === v) + '">' + fa(v) + '</button>'; }).join('') + '</span></div>' +
    '<div class="srow"><span>زمینه</span><span class="seg">' + [['system', 'خودکار'], ['light', 'روشن'], ['dark', 'تیره']].map(function (v) { return '<button data-th="' + v[0] + '" aria-pressed="' + (S.theme === v[0]) + '">' + v[1] + '</button>'; }).join('') + '</span></div>' +
    '<div class="srow"><span>مشخصات من</span><button class="btn ghost" data-go="reg" style="padding:6px 12px;font-size:13px">ویرایش</button></div>' +
    '<div class="srow"><span>درباره آسمان‌نما</span><span style="font-size:12.5px;color:var(--muted)">نسخه ۲٫۳ — هشتمین دوره</span></div>';
  function close() { bg.remove(); sh.remove(); }
  bg.onclick = close;
  sh.querySelectorAll('[data-fs]').forEach(function (b) { b.onclick = function () { S.fs = +b.dataset.fs; save(); applyPrefs(); close(); settings(); }; });
  sh.querySelectorAll('[data-th]').forEach(function (b) { b.onclick = function () { S.theme = b.dataset.th; save(); applyPrefs(); close(); settings(); }; });
  sh.querySelector('[data-go]').onclick = function () { close(); go('reg'); };
  document.body.appendChild(bg); document.body.appendChild(sh);
}

route();
})();
</script>
