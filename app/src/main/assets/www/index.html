><p>◯</p></td><td></td><td></td></tr><tr><td><p>۲۶</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۲۷</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۲۸</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۲۹</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr><tr><td><p>۳۰</p></td><td></td><td></td><td></td><td><p>◯</p></td><td></td><td></td></tr></table></div><div class=\"tbl wide\"><table><tr><td><p><strong>پرسش‌های پایانی: چند شب صاف داشتیم؟ ماه چند شب دیده شد؟ کدام صورت فلکی بیشتر دیده شد؟ چه عواملی رصد را بهتر یا بدتر کرد؟</strong></p></td></tr></table></div>", "baznemaei": "<p class=\"gh\"><strong>۲ـ۱. مقدمه:</strong></p><p>آسمان سرشار از پرسش‌های شگفت‌انگیز است: چرا ماه هر شب شکل تازه‌ای دارد؟ چرا فصل‌ها تغییر می‌کنند؟ ستارگان چگونه متولد می‌شوند؟ نجوم با همین پرسش‌ها، یکی از جذاب‌ترین دریچه‌ها برای علاقه‌مند کردن کودکان به علم است.</p><p>گرایش «بازنمایی خلاق مفاهیم نجوم» فرصتی است تا دانش‌آموزان دوره دوم ابتدایی یک مفهوم یا پدیده نجومی را انتخاب کنند، درباره آن بیاموزند و آموخته‌های خود را در قالب یک فیلم کوتاه، به شکلی درست و خلاقانه برای دیگران بازگو کنند.</p><p>قالب‌هایی مانند ماکت و مدل، دست‌سازه، پوستر، نقاشی، روزنامه دیواری، کتابچه مصور، داستان و نرم‌افزار آموزشی در دوره‌های گذشته با عنوان «ارائه محتوا و مدل‌سازی» اثر اصلی بودند. در این دوره، این قالب‌ها به <strong>ابزارهای کمک‌آموزشی</strong> تبدیل شده‌اند و دانش‌آموز می‌تواند از آن‌ها برای نمایش بهتر مفهوم بهره بگیرد. استفاده از این ابزارها اختیاری است، اما در صورت کاربرد مؤثر امتیاز دارد.</p><p>محور اصلی این گرایش، <strong>بازنمایی خلاق پدیده‌های کیهانی است؛ به عبارت دیگر، ترجمه خلاقانه مفاهیم علمی نجوم به زبان هنر.</strong> اثری ساده که مفهوم را درست و روشن نشان دهد، از اثری زیبا که خطای علمی دارد ارزشمندتر است.</p><p>در مسیر رشد دانش‌آموز در مسابقات (بند «پ» بخش اول)، این گرایش گام «دانش‌افزایی» را برای دانش‌آموزان دوره دوم ابتدایی دنبال می‌کند: دانش‌آموز توضیح علمی یک پدیده را می‌آموزد و آن را به زبان خود برای دیگران بازگو می‌کند. ساخت و به‌کارگیری ابزارهای کمک‌آموزشی نیز، زمینه‌ای برای ورود دانش‌آموز به گام «مهارت‌ورزی» فراهم می‌کند.</p><p class=\"gh\"><strong>۲ـ۲. شرایط شرکت‌کنندگان:</strong></p><p>تمام دانش‌آموزان <strong>دوره دوم ابتدایی (پایه‌های چهارم، پنجم و ششم)</strong> می‌توانند <strong>به‌صورت انفرادی یا تیم دونفره</strong> در این گرایش شرکت‌کنند. شرایط مشترک ثبت‌نام و تیم‌ها در بند «ت» بخش اول آمده است.</p><p><strong>تذکر:</strong> در آثار تیمی، حضور هر دو عضو در فیلم و مشارکت آنان در بیان مطالب الزامی است.</p><p class=\"gh\"><strong>۲ـ۳. شرایط اختصاصی اثر:</strong></p><p><strong>۲ـ۳ـ۱. قالب اثر:</strong> اثر این گرایش یک <strong>فیلم ۵ تا ۱۰ دقیقه‌ای</strong> است که در آن دانش‌آموز یک مفهوم یا پدیده نجومی را با زبان خود توضیح می‌دهد. در تهیه فیلم موارد زیر رعایت شود:</p><p>• فیلم به <strong>یک موضوع مشخص</strong> بپردازد. برای مثال، «علت تغییر شکل ظاهری ماه» موضوعی مناسب است، اما «همه‌چیز درباره ماه» موضوعی بیش از حد گسترده است.</p><p>• مطالب با زبان خود دانش‌آموز بیان شود. خواندن متن از روی کاغذ یا صفحه نمایش مجاز نیست؛ استفاده از کارت‌های یادداشت کوتاه برای یادآوری ترتیب مطالب بلامانع است.</p><p>• شکل ارائه آزاد است. دانش‌آموز می‌تواند رو به دوربین صحبت کند، مطالب را برای چند مخاطب (مانند همکلاسی‌ها یا اعضای خانواده) توضیح دهد، یا ارائه را با داستان یا نمایش همراه کند.</p><p>• والدین یا مربی می‌توانند در فیلم‌برداری، تهیه وسایل و رعایت ایمنی همکاری کنند، اما بیان مطالب و ساخت ابزارها باید بر عهده خود دانش‌آموز باشد.</p><p><strong>۲ـ۳ـ۲. انتخاب موضوع:</strong> موضوع باید برای دانش‌آموزان جذاب باشد، در مدت تعیین‌شده به‌طور کامل و درست قابل توضیح باشد، و بتوان آن را با مدل، تصویر، آزمایش ساده یا مشاهده آسمان نمایش داد. موضوعات زیر به‌عنوان نمونه پیشنهاد می‌شوند و دانش‌آموزان می‌توانند با راهنمایی مربی یا والدین، موضوعات مرتبط دیگری نیز انتخاب کنند:</p><p>• <strong>زمین و خورشید:</strong> شب و روز، حرکت ظاهری خورشید، تغییر سایه‌ها، پیدایش فصل‌ها</p><p>• <strong>ماه:</strong> شکل‌های ظاهری ماه، ماه‌گرفتگی و خورشیدگرفتگی</p><p>• <strong>منظومه شمسی:</strong> مقایسه اندازه‌ها و فاصله‌ها، سیارات سنگی و گازی، سیارک، دنباله‌دار و شهاب</p><p>• <strong>ستارگان و کهکشان:</strong> صورت‌های فلکی، چرخه زندگی ستارگان، جایگاه زمین در کهکشان راه شیری</p><p>• <strong>فضا و فناوری:</strong> گرانش، تلسکوپ‌ها، ماهواره‌ها، مأموریت‌ها و دستاوردهای فضایی ایران و جهان</p><p><strong>۲ـ۳ـ۳. ابزارهای کمک‌آموزشی (اختیاری):</strong> دانش‌آموز می‌تواند برای نمایش بهتر مفهوم، ابزارهایی مانند ماکت، مدل مقیاسی، دست‌سازه، پوستر، نقاشی، روزنامه دیواری، کتابچه مصور یا نمایش عروسکی تهیه کرده و در فیلم به کار گیرد.</p><p>• ابزار باید ساخته خود دانش‌آموز باشد و به فهم درست مفهوم کمک کند. زیبایی ظاهری یا هزینه ساخت ملاک امتیاز نیست.</p><p>• در صورتی که اندازه‌ها یا فاصله‌ها در مدل یا تصویر به مقیاس واقعی نیستند، این موضوع در فیلم بیان شود.</p><p><strong>۲ـ۳ـ۴. </strong><strong>دقت علمی:</strong> دانش‌آموز با استفاده از قدرت تخیل خود، مفاهیم علمی را به شکلی زیبا و منطقی بازسازی کند و با ارائه خود بتواند دنیای واقعی نجوم را روایت کند. دانش‌آموزان و مربیان به برداشت‌های نادرست رایج زیر توجه نمایند:</p><p>• علت فصل‌ها کج بودن محور چرخش زمین است، نه تغییر فاصله زمین تا خورشید.</p><p>• تغییر شکل ظاهری ماه ناشی از تغییر زاویه دید ما نسبت به نیمه روشن ماه است، نه سایه زمین.</p><p>• حرکت ظاهری خورشید در آسمان نتیجه چرخش زمین به دور خود است.</p><p>• خورشید ستاره‌ای متوسط است و ستارگان دیگر به دلیل فاصله زیاد، کوچک و کم‌نور دیده می‌شوند.</p><p>• گرانش در فضا نیز وجود دارد.</p><p>• شهاب، ذره‌ای از سنگ یا غبار است که در جو زمین می‌سوزد، نه ستاره‌ای در حال سقوط.</p><p class=\"gh\"><strong>۲ـ۳ـ۵. ایمنی:</strong></p><p>• رعایت استانداردهای ایمنی در استفاده از ابزارها و در ساخت و کار با مواد، برای حفظ سلامت دانش‌آموز الزامی است.</p><p>• نگاه مستقیم به خورشید، با چشم غیرمسلح یا با هر ابزار نوری، ممنوع است.</p><p>• استفاده از وسایل برنده، داغ یا برقی (مانند تفنگ چسب یا لامپ) تنها با حضور والدین یا مربی مجاز است.</p><p><strong>تذکر:</strong> به شرایط عمومی مسابقات در بند «ت» بخش اول شیوه‌نامه توجه شود.</p><p class=\"gh\"><strong>۲ـ۴. مستندات موردنیاز اثر:</strong></p><p>علاوه بر مستندات مشترک همه گرایش‌ها (بند «ت» بخش اول)، مستندات زیر نیز در همان فایل فشرده (ZIP) ارسال گردد:</p><p>۱- در نمون‌برگ ۱ (شناسنامه اثر): در توضیحات ۱ موضوع انتخاب‌شده و دلیل انتخاب آن، در توضیحات ۲ ابزار کمک‌آموزشی ساخته‌شده و آنچه نشان می‌دهد (یا عبارت «بدون ابزار»)، و در توضیحات ۳ مهم‌ترین مطلبی که دانش‌آموز درباره موضوع آموخته است (در یک یا دو جمله)، منابع مورد استفاده (کتاب، سایت، فیلم، مربی و ...) و افرادی که همکاری داشته‌اند و نوع همکاری آنان (مانند فیلم‌برداری یا تهیه وسایل) آورده شود.</p><p>۲- <strong>فیلم ۵ تا ۱۰ دقیقه‌ای</strong> با فرمت MP4 و حجم حداکثر ۱۵۰ مگابایت.</p><p>۳- در صورت استفاده از ابزار کمک‌آموزشی: سه تا شش تصویر از مراحل ساخت که حضور دانش‌آموز در آن‌ها مشخص باشد، و یک تصویر کامل از ابزار نهایی، در قالب یک فایل پاورپوینت. </p><p>۴- اصل ابزار کمک‌آموزشی، در صورت درخواست داوران در هر مرحله.</p><p class=\"gh\"><strong>۲ـ۵. مراحل اجرایی (فرایند داوری):</strong></p><p><strong>۲ـ۵ـ۱. مرحله منطقه‌ای:</strong> دانش‌آموزانی که در سامانه سها (my.medu.ir) ثبت‌نام نموده‌اند، آثار خود را در موعد مقرر (تقویم اجرایی، پیوست الف) به پژوهش‌سرای منطقه ارسال می‌نمایند. آثار در این مرحله، تحت نظارت معاونت آموزش متوسطه منطقه و توسط پژوهش‌سرای دانش‌آموزی منطقه، بر اساس نمون‌برگ ۲ داوری شده و برگزیدگان مطابق با سهمیه منطقه به مرحله استانی معرفی می‌گردند. لازم است پژوهش‌سرای منطقه پیش از معرفی، آثار برگزیده را برای رفع نقاط ضعف و تقویت نقاط قوت راهنمایی نماید.</p><p><strong>۲ـ۵ـ۲. مرحله اول استانی:</strong> آثار توسط قطب استانی نجوم و فناوری‌های فضایی، تحت نظارت کارشناس نظارت و پیگیری امور پژوهش‌سراهای دانش‌آموزی استان، بر اساس نمون‌برگ ۲ داوری می‌شوند. دانش‌آموزان در صورت صلاحدید داوران باید آمادگی ارسال ابزار کمک‌آموزشی به قطب استانی را داشته باشند.</p><p><strong>۲ـ۵ـ۳. مرحله دوم استانی:</strong> این مرحله شامل مصاحبه کوتاه و غیرحضوری (آنلاین) داوران با دانش‌آموز است. داوران با پرسش‌های ساده و در فضایی صمیمی، میزان فهم دانش‌آموز از موضوع و نقش او در ساخت ابزار و تهیه فیلم را بررسی می‌کنند. حضور یکی از والدین یا مربی در کنار دانش‌آموز بلامانع است، اما پاسخ‌ها باید از سوی خود دانش‌آموز ارائه شود. در آثار تیمی، هر دو عضو به‌صورت همزمان شرکت می‌نمایند. قطب استانی باید پیش از معرفی آثار منتخب به قطب کشوری، آن‌ها را راهنمایی نماید.</p><p><strong>۲ـ۵ـ۴. مرحله اول کشوری:</strong> آثار ارسالی از استان‌ها به‌صورت غیرحضوری و بر اساس نمون‌برگ ۲ ارزیابی می‌شوند و آثار منتخب با تأیید هیئت داوران به مرحله دوم کشوری راه می‌یابند. دانش‌آموزان در صورت صلاحدید داوران باید آمادگی ارسال ابزار کمک‌آموزشی به قطب کشوری را داشته باشند.</p><p><strong>۲ـ۵ـ۵. مرحله دوم کشوری:</strong> این مرحله شامل مصاحبه غیرحضوری (آنلاین) داوران با دانش‌آموز، به همان شیوه مرحله دوم استانی، است. آثار منتخب پس از مصاحبه و بر اساس بالاترین امتیاز معرفی می‌گردند.</p><p class=\"gh\"><strong>۲ـ۶. نمون‌برگ داوری:</strong></p><p class=\"gh\"><strong>نمون‌برگ ۲: داوری غیرحضوری بازنمایی خلاق مفاهیم نجوم</strong></p><div class=\"tbl wide\"><table><tr><td colspan=\"2\"><p><strong>عنوان اثر:</strong></p></td><td colspan=\"2\"><p><strong>کد ثبت‌شده اثر در سامانه:</strong></p></td></tr><tr><td><p><strong>استان:</strong></p></td><td><p><strong>شهر:</strong></p></td><td><p><strong>منطقه/ناحیه:</strong></p></td><td><p><strong>نام مدرسه:</strong></p></td></tr><tr><td><p><strong>نام و نام خانوادگی دانش‌آموز/دانش‌آموزان</strong></p></td><td><p><strong>کد ملی</strong></p></td><td><p><strong>شماره تماس</strong></p></td><td><p><strong>پایه تحصیلی</strong></p></td></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr></table></div><div class=\"tbl wide\"><table><tr><td><p><strong>ردیف</strong></p></td><td><p><strong>معیار ارزیابی</strong></p></td><td><p><strong>حداکثر امتیاز</strong></p></td><td><p><strong>امتیاز کسب‌شده</strong></p></td><td><p><strong>توضیحات</strong></p></td></tr><tr><td><p>۱</p></td><td><p><strong>درستی علمی محتوا:</strong> صحت مطالب نجومی، پرهیز از برداشت‌های نادرست رایج و اشاره به محدودیت‌های مدل (مانند مقیاس) در صورت نیاز</p></td><td><p><strong>۱۸</strong></p></td><td></td><td></td></tr><tr><td><p>۲</p></td><td><p><strong>فهم مفهوم:</strong> میزان درک دانش‌آموز از موضوع و توانایی بیان آن با زبان خود، به جای تکرار مطالب حفظ‌شده</p></td><td><p><strong>۱۴</strong></p></td><td></td><td></td></tr><tr><td><p>۳</p></td><td><p><strong>انتخاب موضوع:</strong> جذابیت موضوع، مشخص و متمرکز بودن آن و تناسب با سن دانش‌آموز</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۴</p></td><td><p><strong>خلاقیت در بازنمایی:</strong> شیوه تازه و جذاب برای نمایش یا توضیح پدیده نجومی</p></td><td><p><strong>۱۴</strong></p></td><td></td><td></td></tr><tr><td><p>۵</p></td><td><p><strong>کاربرد ابزار کمک‌آموزشی:</strong> نقش مؤثر ابزار در نمایش مفهوم و ارتباط روشن آن با موضوع</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۶</p></td><td><p><strong>کیفیت علمی و ساخت ابزار:</strong> درستی علمی ابزار، دقت و وضوح اجزا و ساخته شدن توسط خود دانش‌آموز</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۷</p></td><td><p><strong>روشنی و جذابیت ارائه:</strong> توضیح روشن و قابل فهم، ترتیب منطقی مطالب و بیان روان</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۸</p></td><td><p><strong>کیفیت فنی فیلم:</strong> وضوح تصویر و صدا و قابل مشاهده بودن ابزارها</p></td><td><p><strong>۴</strong></p></td><td></td><td></td></tr><tr><td><p>۹</p></td><td><p><strong>رعایت قالب و زمان:</strong> مدت ۵ تا ۱۰ دقیقه، تمرکز بر یک موضوع و کامل بودن مستندات</p></td><td><p><strong>۴</strong></p></td><td></td><td></td></tr><tr><td><p>۱۰</p></td><td><p><strong>سفر یادگیری آسمان‌نما: </strong>نمره کارنامه سفر یادگیری همین گرایش در برنامه آسمان‌نما (۰ تا ۱۰)، پس از راستی‌آزمایی کد QR؛ در آثار تیمی میانگین نمره اعضا</p></td><td><p><strong>۱۰</strong></p></td><td></td><td></td></tr><tr><td colspan=\"2\"><p><strong>جمع نهایی امتیاز</strong></p></td><td><p><strong>۱۰۰</strong></p></td><td></td><td></td></tr></table></div><div class=\"tbl wide\"><table><tr><td colspan=\"3\"><p><strong>نام و نام خانوادگی داور اول منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p><p><strong>نام و نام خانوادگی داور دوم منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p><p><strong>نام و نام خانوادگی داور سوم منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p></td></tr><tr><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>مدیر پژوهش‌سرای دانش‌آموزی مجری</strong></p><p><strong>تاریخ و امضا</strong></p></td><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>مدیر پژوهش‌سرای قطب استانی نجوم و فناوری‌های فضایی</strong></p><p><strong>تاریخ و امضا</strong></p></td><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>کارشناس امور پژوهش‌سراهای دانش‌آموزی</strong></p><p><strong>تاریخ و امضا</strong></p></td></tr><tr><td colspan=\"3\"><p><strong>راهنمای داوری:</strong></p><p>۱- ردیف‌های ۵ و ۶ تنها در صورت استفاده از ابزار کمک‌آموزشی امتیاز می‌گیرند. اثر بدون ابزار در سایر ردیف‌ها به‌طور کامل ارزیابی می‌شود.</p><p>۲- امتیازدهی متناسب با سن و امکانات مورد انتظار از دانش‌آموز دوره دوم ابتدایی انجام شود. تدوین حرفه‌ای، جلوه‌های ویژه یا هزینه ساخت ابزار امتیاز اضافه ندارد.</p><p>۳- جذابیت فیلم نباید خطای علمی را بپوشاند. خطای جدی در مفهوم اصلی، از امتیاز ردیف‌های ۱ و ۲ به‌طور محسوس کسر می‌شود.</p><p>۴- در صورتی که شواهد نشان دهد بیان مطالب یا ساخت ابزار عمدتاً توسط بزرگسالان انجام شده است، مطابق بند «ث» «وظایف و استانداردهای اخلاقی داوری» اقدام می‌شود.</p><p>۵- در آثار تیمی، مشارکت هر دو عضو در فیلم در ردیف‌های ۲ و ۷ لحاظ می‌شود.</p></td></tr></table></div>", "anjoman": "<p class=\"gh\"><strong>۳ـ۱. مقدمه:</strong></p><p>آسمان شب، بزرگ‌ترین آزمایشگاهی است که در دسترس همه قرار دارد. کمتر دانش‌آموزی است که از دیدن حلقه‌های زحل یا دهانه‌های ماه در چشمی یک تلسکوپ شگفت‌زده نشود؛ همین لحظه‌های شگفتی، برای بسیاری از دانش‌آموزان نخستین جرقه علاقه به علم است. نجوم به همین دلیل یکی از جذاب‌ترین دریچه‌ها برای ورود دانش‌آموزان به دنیای علم، پرسشگری و پژوهش به شمار می‌رود.</p><p>انجمن علمی‌پژوهشی نجوم، جمعی از دانش‌آموزان علاقه‌مند به آسمان در مدرسه است که با برنامه‌ریزی و همکاری یکدیگر، فعالیت‌های علمی و ترویجی نجوم را در مدرسه اجرا می‌کنند. مأموریت اصلی انجمن، <strong>ترویج نجوم و علاقه‌مند کردن دانش‌آموزان مدرسه به آسمان و علم</strong><strong> نجوم</strong> است؛ از برگزاری شب رصد و کارگاه آموزشی گرفته تا استهلال، نمایشگاه، برنامه‌های مناسبتی و پروژه‌های علمی گروهی. تجربه باشگاه‌ها و انجمن‌های نجوم مدرسه‌ای نشان می‌دهد که فعالیت‌های عملی به رهبری خود دانش‌آموزان، و به‌ویژه آموزش همسال به همسال، علاوه بر افزایش علاقه به علوم، مهارت‌های ارتباطی، همکاری، مسئولیت‌پذیری و اعتمادبه‌نفس اعضا را نیز تقویت می‌کند.</p><p>در این گرایش، آنچه ارزیابی می‌شود <strong>فعالیت واقعی و مستمر انجمن در مدرسه</strong> است، نه گزارش‌دهی در فضای مجازی. ساخت یک کانال یا صفحه مجازی به‌تنهایی به معنای تشکیل یا فعالیت انجمن نیست. انجمن موفق، انجمنی است که مدرسه حضورش را احساس کند؛ دانش‌آموزان در برنامه‌هایش شرکت‌کنند، از آن بیاموزند و به نجوم علاقه‌مند شوند.</p><p>در مسیر رشد دانش‌آموز در مسابقات (بند «پ» بخش اول)، این گرایش نقطه آغاز مسیر برای دانش‌آموزان دوره اول متوسطه است و گام‌های «کاوشگری» و «دانش‌افزایی» را در قالب کار گروهی دنبال می‌کند: اعضای انجمن با رصد و پروژه‌های گروهی پدیده‌ها را کاوش می‌کنند و با آموزش همسالان، دانسته‌های خود و دیگران را گسترش می‌دهند.</p><p class=\"gh\"><strong>۳ـ۲. شرایط شرکت‌کنندگان:</strong></p><p>دانش‌آموزان دوره اول متوسطه پس از تشکیل انجمن علمی‌پژوهشی نجوم در مدرسه خود (بر اساس شیوه‌نامه وزارتی تشکیل انجمن‌های علمی‌پژوهشی دانش‌آموزی)، می‌توانند <strong>الزاماً به‌صورت تیم سه‌نفره</strong> (سرگروه و دو نفر از اعضای انجمن) در این گرایش شرکت‌کنند. شرایط مشترک ثبت‌نام و تیم‌ها در بند «ت» بخش اول آمده است.</p><p><strong>تذکر ۱:</strong> اعضای تیم باید از یک مدرسه باشند.</p><p><strong>تذکر ۲:</strong> تیم سه‌نفره نماینده انجمن در مسابقه است. سایر دانش‌آموزان مدرسه می‌توانند در فعالیت‌های انجمن مشارکت کنند و حضور فعال آنان از نشانه‌های اثربخشی انجمن به شمار می‌رود.</p><p class=\"gh\"><strong>۳ـ۳. شرایط اختصاصی اثر:</strong></p><p class=\"gh\"><strong>۳ـ۳ـ۱. تشکیل انجمن و برنامه‌ریزی</strong></p><p>نخستین گام، تشکیل رسمی انجمن در مدرسه با هماهنگی مدیر مدرسه، تحت نظر یکی از دبیران مدرسه و مطابق مقررات وزارتی است. سپس انجمن <strong>برنامه سالانه</strong> خود را تدوین می‌کند؛ برنامه‌ای که فعالیت‌های پیش‌بینی‌شده، زمان تقریبی اجرا، مسئول هر فعالیت از میان اعضا و گروه مخاطب را مشخص می‌کند.</p><p class=\"gh\"><strong>۳ـ۳ـ۲. فعالیت‌های انجمن</strong></p><p>انجمن در طول سال تحصیلی، فعالیت‌های علمی و ترویجی خود را در قالب‌های زیر اجرا می‌کند. اجرای همه قالب‌ها الزامی نیست و انتخاب آن‌ها باید متناسب با امکانات مدرسه باشد؛ <strong>کیفیت و اثربخشی فعالیت‌ها بر تعداد آن‌ها اولویت دارد.</strong></p><p>۱- <strong>برنامه‌های رصد آسمان:</strong> برگزاری شب رصد برای دانش‌آموزان یا خانواده‌ها؛ رصد ماه، سیارات، صورت‌های فلکی و اجرام اعماق آسمان؛ رصد پدیده‌های خاص مانند گرفت، بارش شهابی یا مقارنه‌ها.</p><p>۲- <strong>استهلال (رصد هلال ماه نو):</strong> در صورت انتخاب این قالب، انجمن دست‌کم یک برنامه استهلال اجرا می‌کند؛ شامل پیش‌بینی شرایط رؤیت با نرم‌افزار یا منابع معتبر، حضور در محلی با افق غربی باز پیش از غروب خورشید، جست‌وجوی هلال، ثبت مشاهدات و مقایسه پیش‌بینی با نتیجه. برای هر برنامه استهلال، <strong>جدول ۳ـ۱ (گزارش استهلال)</strong> تکمیل و همراه مستندات ارسال می‌شود. گزارش دقیق یک استهلال ناموفق (عدم رؤیت به دلیل ابر، غبار یا شرایط نجومی) نیز گزارشی علمی و قابل قبول است. یک عکس از محل رصد و افق غربی، همراه با پلاکارد مشخصات برنامه، به گزارش استهلال ضمیمه شود.</p><p>۳- <strong>کارگاه، نشست علمی و آموزش همسالان:</strong> کارگاه‌هایی که اعضای انجمن برای سایر دانش‌آموزان اجرا می‌کنند، نشست علمی با حضور کارشناس یا دبیر، و آموزش کار با نقشه آسمان، نرم‌افزارهای رصدی یا ابزارهای ساده نجومی.</p><p>۴- <strong>برنامه‌های مناسبتی:</strong> اجرای برنامه در مناسبت‌های علمی سال، مانند هفته جهانی فضا (۱۲ تا ۱۸ مهر)، هفته پژوهش و روز ملی فناوری فضایی و هفته جهانی نجوم.</p><p>۵- <strong>نمایشگاه، مسابقه علمی و بازدید:</strong> برگزاری نمایشگاه نجوم در مدرسه، مسابقه یا چالش علمی برای دانش‌آموزان، و بازدید از رصدخانه، افلاک‌نما، پژوهش‌سرا یا مراکز علمی.</p><p>۶- <strong>پروژه علمی گروهی انجمن:</strong> یک پروژه کوچک با پرسش یا هدف مشخص که اعضای انجمن با هم اجرا می‌کنند؛ مانند پایش آلودگی نوری محل زندگی با شمارش ستارگان، ساخت و تنظیم ساعت آفتابی مدرسه، ثبت منظم وضعیت آسمان برای رصد، یا راه‌اندازی گوشه یا اتاق نجوم در مدرسه.</p><p>۷- <strong>تولید محتوای علمی:</strong> نشریه یا روزنامه دیواری، پوستر، نقشه ماهانه آسمان شب، معرفی کتاب، فیلم و منابع معتبر، مصاحبه با کارشناسان، و ترجمه یا زیرنویس محتوای علمی.</p><p>۸- <strong>همکاری با قطب کشوری:</strong> مشارکت در فراخوان‌ها و برنامه‌های قطب کشوری نجوم و فناوری‌های فضایی (مانند برنامه‌های هفته جهانی فضا) و اطلاع‌رسانی آن‌ها در مدرسه. امتیاز این بخش تنها بر اساس <strong>گواهی‌های صادرشده از سوی قطب کشوری</strong> برای انجمن محاسبه می‌شود. در هر یک از فراخوان‌های قطب کشوری، نحوه اخذ گواهی در کانال قطب کشوری اطلاع‌رسانی خواهد شد.</p><p><strong>تذکر ۱:</strong> فعالیت‌های حضوری و میدانی در اولویت‌اند و امتیاز بیشتری دارند. اجرای مجازی فعالیت‌ها متناسب با شرایط بلامانع است، اما انتشار محتوا در فضای مجازی جای اجرای واقعی فعالیت را نمی‌گیرد.</p><p><strong>تذکر ۲:</strong> تنها فعالیت‌هایی ارزیابی می‌شوند که در سال تحصیلی جاری و پیش از پایان مهلت ارسال آثار (تقویم اجرایی، پیوست الف) انجام شده باشند.</p><p><strong>تذکر ۳:</strong> برای هر فعالیت (به‌جز استهلال که جدول ۳ـ۱ دارد)، <strong>جدول ۳ـ۲ (گزارش اجرای فعالیت) توصیه می‌شود تکمیل شود.</strong> تکمیل این جدول اختیاری بوده و برای کمک به تسریع در فرآیند داوری است.</p><p><strong>تذکر ۴ (ایمنی):</strong> در برنامه‌های میدانی و شبانه، حضور دبیر یا مربی مسئول الزامی است. نگاه کردن مستقیم به خورشید با چشم یا هر ابزار نوری خطرناک است؛ در استهلال، هیچ ابزاری پیش از غروب کامل خورشید به سمت آن نشانه‌گیری نشود و رصد خورشید فقط با فیلتر استاندارد و زیر نظر مربی انجام شود.</p><p class=\"gh\"><strong>۳ـ۳ـ۳. مستندسازی فعالیت‌ها</strong></p><p class=\"gh\"><strong>الف) مستند اصلی: فیلم مستند انجمن</strong></p><p>مستند اصلی داوری، یک <strong>فیلم مستند حداکثر ۱۰ دقیقه‌ای</strong> از خلاصه فعالیت‌های انجمن است که باید این ویژگی‌ها را داشته باشد:</p><p>• فرمت MP4، حجم حداکثر ۱۵۰ مگابایت، با تصویر و صدای واضح (کیفیت ۷۲۰p کافی است).</p><p>• روایت فیلم توسط خود اعضای تیم انجام شود و هر سه عضو در آن حضور داشته باشند.</p><p>• تصاویر فیلم از اجرای واقعی فعالیت‌های انجمن باشد؛ استفاده از تصاویر غیرمرتبط یا برگرفته از منابع دیگر بدون ذکر منبع مجاز نیست.</p><p>ساختار پیشنهادی فیلم: معرفی انجمن، اعضا و برنامه سالانه؛ مهم‌ترین فعالیت‌های اجراشده؛ پروژه علمی گروهی؛ بازخورد مخاطبان، دستاوردها، چالش‌ها و برنامه آینده.</p><p class=\"gh\"><strong>ب) مستندات تکمیلی: کانال یا وبلاگ انجمن</strong></p><p>انجمن یک کانال در یکی از پیام‌رسان‌های شاد، ایتا، بله، سروش یا روبیکا، یا یک وبلاگ ایجاد کرده و مستندات تفصیلی فعالیت‌ها را در آن منتشر می‌کند. این بستر، آرشیو مستندات انجمن است و داوران در صورت نیاز برای راستی‌آزمایی به آن مراجعه می‌کنند؛ تعداد پست‌ها یا تناوب انتشار، امتیاز جداگانه‌ای ندارد.</p><p class=\"gh\"><strong>پ) پوشه‌بندی مستندات</strong></p><p>مستندات هر فعالیت در پوشه‌ای جداگانه و هم‌نام با ردیف مربوط در نمون‌برگ ۲ قرار گیرد (مثلاً: «پوشه ۳ – استهلال»).</p><p><strong>تذکر ۱:</strong> در تصاویر فعالیت‌ها، عنوان برنامه، مکان و تاریخ برگزاری روی یک پلاکارد یا تابلو مشخص باشد.</p><p><strong>تذکر ۲:</strong> استفاده از ابزارهای هوش مصنوعی در تهیه متن، طراحی پوستر یا تدوین فیلم، به شرط ذکر صریح، بلامانع است؛ اما تصاویر فعالیت‌ها و روایت فیلم باید واقعی و کار خود دانش‌آموزان باشد و اعضای تیم باید در مصاحبه بتوانند از همه فعالیت‌ها دفاع کنند.</p><p><strong>تذکر ۳:</strong> به شرایط عمومی مسابقات در بند «ت» بخش اول شیوه‌نامه توجه شود.</p><p class=\"gh\"><strong>۳ـ۴. مستندات موردنیاز اثر:</strong></p><p>علاوه بر مستندات مشترک همه گرایش‌ها (بند «ت» بخش اول)، مستندات زیر نیز در همان فایل فشرده (ZIP) ارسال گردد:</p><p>۱- در نمون‌برگ ۱ (شناسنامه اثر): در توضیحات ۱ نشانی کانال یا وبلاگ انجمن، در توضیحات ۲ خلاصه برنامه سالانه و مهم‌ترین فعالیت‌ها، و در توضیحات ۳ شرح مختصر نوآوری‌ها آورده شود.</p><p>۲- <strong>فیلم مستند انجمن</strong> (حداکثر ۱۰ دقیقه، MP4، حداکثر ۱۵۰ مگابایت). عدم ارسال یا ناخوانا بودن این فیلم موجب حذف اثر از داوری می‌شود.</p><p>۳- مستند تشکیل انجمن در مدرسه با تأیید مدیر مدرسه، به همراه برنامه سالانه انجمن.</p><p>۴- جدول ۳ـ۱ (گزارش استهلال، پیوست ت در بخش سوم) تکمیل‌شده برای هر برنامه استهلال (در صورت اجرای استهلال).</p><p>۵- برای سایر فعالیت‌ها، تصاویر، شواهد و در صورت تکمیل، جدول ۳ـ۲ (گزارش اجرای فعالیت، پیوست ت در بخش سوم)، در پوشه‌های جداگانه بر اساس ردیف‌های نمون‌برگ ۲. </p><p>۶- گواهی‌های صادرشده از سوی قطب کشوری نجوم و فناوری‌های فضایی برای مشارکت انجمن در فراخوان‌ها و برنامه‌های قطب (در صورت وجود).</p><p class=\"gh\"><strong>۳ـ۵. مراحل اجرایی (فرایند داوری):</strong></p><p><strong>۳ـ۵ـ۱. مرحله منطقه‌ای:</strong> تیم‌هایی که در سامانه ثبت‌نام کرده‌اند، آثار خود را در موعد مقرر (تقویم اجرایی، پیوست الف) به پژوهش‌سرای منطقه ارسال می‌نمایند. آثار در این مرحله، تحت نظارت معاونت آموزش متوسطه منطقه و توسط پژوهش‌سرای دانش‌آموزی منطقه، بر اساس نمون‌برگ ۲ داوری شده و برگزیدگان مطابق سهمیه منطقه به مرحله استانی معرفی می‌گردند. لازم است پژوهش‌سرای منطقه پیش از معرفی، انجمن‌های برگزیده را برای رفع نقاط ضعف و تقویت نقاط قوت فعالیت‌هایشان راهنمایی نماید.</p><p><strong>۳ـ۵ـ۲. مرحله اول استانی:</strong> آثار توسط قطب استانی نجوم و فناوری‌های فضایی، تحت نظارت کارشناس نظارت و پیگیری امور پژوهش‌سراهای دانش‌آموزی استان، بر اساس نمون‌برگ ۲ داوری می‌شوند و تیم‌های دارای بالاترین امتیاز به مرحله دوم راه می‌یابند.</p><p><strong>۳ـ۵ـ۳. مرحله دوم استانی:</strong> شامل مصاحبه غیرحضوری (آنلاین) داوران با تیم برای راستی‌آزمایی موارد مندرج در نمون‌برگ ۲ است. لازم است هر سه عضو تیم به‌صورت همزمان و بر اساس جدول زمان‌بندی قطب استانی در مصاحبه شرکت نمایند. آثار منتخب با کسب بالاترین امتیاز پس از مصاحبه معرفی می‌گردند. قطب استانی باید پیش از معرفی آثار به قطب کشوری، فرایند راهنمایی انجمن‌های برگزیده را انجام دهد.</p><p><strong>۳ـ۵ـ۴. مرحله اول کشوری:</strong> آثار ارسالی از استان‌ها به‌صورت غیرحضوری و بر اساس نمون‌برگ ۲ ارزیابی می‌شوند و آثار منتخب با تأیید هیئت داوران به مرحله دوم کشوری راه می‌یابند.</p><p><strong>۳ـ۵ـ۵. مرحله دوم کشوری:</strong> شامل مصاحبه غیرحضوری (آنلاین) داوران با تیم برای راستی‌آزمایی موارد مندرج در نمون‌برگ ۲ است. لازم است هر سه عضو تیم به‌صورت همزمان و بر اساس جدول زمان‌بندی قطب کشوری نجوم و فناوری‌های فضایی شرکت نمایند. آثار منتخب با کسب بالاترین امتیاز پس از مصاحبه معرفی می‌گردند.</p><p class=\"gh\"><strong>۳ـ۶. نمون‌برگ داوری:</strong></p><p class=\"gh\"><strong>نمون‌برگ ۲: داوری غیرحضوری انجمن علمی‌پژوهشی نجوم</strong></p><div class=\"tbl wide\"><table><tr><td colspan=\"3\"><p><strong>عنوان انجمن:</strong></p></td><td colspan=\"5\"><p><strong>کد ثبت‌شده اثر در سامانه:</strong></p></td></tr><tr><td colspan=\"2\"><p><strong>استان:</strong></p></td><td><p><strong>شهر:</strong></p></td><td colspan=\"2\"><p><strong>منطقه/ناحیه:</strong></p></td><td colspan=\"3\"><p><strong>نام مدرسه:</strong></p></td></tr><tr><td colspan=\"2\"><p><strong>نام و نام خانوادگی اعضای تیم</strong></p></td><td><p><strong>کد ملی</strong></p></td><td colspan=\"2\"><p><strong>شماره تماس</strong></p></td><td colspan=\"3\"><p><strong>پایه تحصیلی</strong></p></td></tr><tr><td colspan=\"2\"></td><td></td><td colspan=\"2\"></td><td colspan=\"3\"></td></tr><tr><td colspan=\"2\"></td><td></td><td colspan=\"2\"></td><td colspan=\"3\"></td></tr><tr><td colspan=\"2\"></td><td></td><td colspan=\"2\"></td><td colspan=\"3\"></td></tr><tr><td><p><strong>ردیف</strong></p></td><td colspan=\"3\"><p><strong>معیار ارزیابی</strong></p></td><td colspan=\"2\"><p><strong>حداکثر امتیاز</strong></p></td><td><p><strong>امتیاز کسب‌شده</strong></p></td><td><p><strong>توضیحات</strong></p></td></tr><tr><td><p>۱</p></td><td colspan=\"3\"><p><strong>تشکیل و برنامه‌ریزی انجمن:</strong> تشکیل رسمی انجمن در مدرسه، برنامه سالانه روشن، تقسیم وظایف میان اعضا و میزان تحقق برنامه</p></td><td colspan=\"2\"><p><strong>۵</strong></p></td><td></td><td></td></tr><tr><td><p>۲</p></td><td colspan=\"3\"><p><strong>برنامه‌های رصد آسمان:</strong> کیفیت اجرا، تنوع اجرام یا پدیده‌های رصدشده، مشارکت دانش‌آموزان و خانواده‌ها و رعایت ایمنی</p></td><td colspan=\"2\"><p><strong>۱۳</strong></p></td><td></td><td></td></tr><tr><td><p>۳</p></td><td colspan=\"3\"><p><strong>استهلال:</strong> پیش‌بینی شرایط رؤیت، اجرای میدانی و انتخاب محل مناسب، تکمیل دقیق جدول ۳ـ۱ و مقایسه پیش‌بینی با مشاهده</p></td><td colspan=\"2\"><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۴</p></td><td colspan=\"3\"><p><strong>کارگاه، نشست علمی و آموزش همسالان:</strong> درستی علمی محتوا، نقش فعال اعضای انجمن در آموزش و تناسب با مخاطب</p></td><td colspan=\"2\"><p><strong>۱۳</strong></p></td><td></td><td></td></tr><tr><td><p>۵</p></td><td colspan=\"3\"><p><strong>برنامه‌های مناسبتی:</strong> اجرای برنامه در مناسبت‌های علمی سال (هفته جهانی فضا، هفته پژوهش، روز ملی فناوری فضایی و ...) با محتوای متناسب</p></td><td colspan=\"2\"><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۶</p></td><td colspan=\"3\"><p><strong>نمایشگاه، مسابقه علمی و بازدید:</strong> کیفیت برگزاری، ارتباط با اهداف علمی و میزان مشارکت دانش‌آموزان</p></td><td colspan=\"2\"><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۷</p></td><td colspan=\"3\"><p><strong>پروژه علمی گروهی انجمن:</strong> وجود پرسش یا هدف مشخص، ثبت داده، نتیجه‌گیری و کاربرد نتیجه در مدرسه یا محل زندگی</p></td><td colspan=\"2\"><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۸</p></td><td colspan=\"3\"><p><strong>تولید محتوای علمی:</strong> درستی علمی، اصالت و کاربردپذیری نشریه، پوستر، نقشه آسمان، معرفی منابع، مصاحبه یا ترجمه</p></td><td colspan=\"2\"><p><strong>۵</strong></p></td><td></td><td></td></tr><tr><td><p>۹</p></td><td colspan=\"3\"><p><strong>فیلم مستند انجمن:</strong> انسجام روایت، نمایش واقعی فعالیت‌ها، حضور و روایت اعضای تیم، رعایت زمان و کیفیت فنی</p></td><td colspan=\"2\"><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۱۰</p></td><td colspan=\"3\"><p><strong>مستندسازی و ساماندهی:</strong> کامل بودن جدول ۳ـ۱ و نظم مستندات، پوشه‌بندی منظم و قابلیت پیگیری شواهد در کانال یا وبلاگ</p></td><td colspan=\"2\"><p><strong>۵</strong></p></td><td></td><td></td></tr><tr><td><p>۱۱</p></td><td colspan=\"3\"><p><strong>همکاری با قطب کشوری:</strong> مشارکت در فراخوان‌ها و برنامه‌های قطب کشوری، صرفاً بر اساس گواهی‌های صادرشده از سوی قطب کشوری</p></td><td colspan=\"2\"><p><strong>۴</strong></p></td><td></td><td></td></tr><tr><td><p>۱۲</p></td><td colspan=\"3\"><p><strong>سفر یادگیری آسمان‌نما: </strong>نمره کارنامه سفر یادگیری همین گرایش در برنامه آسمان‌نما (۰ تا ۱۰)، پس از راستی‌آزمایی کد QR؛ در آثار تیمی میانگین نمره اعضا</p></td><td colspan=\"2\"><p><strong>۱۰</strong></p></td><td></td><td></td></tr><tr><td colspan=\"4\"><p><strong>جمع نهایی امتیاز</strong></p></td><td colspan=\"2\"><p><strong>۱۰۰</strong></p></td><td></td><td></td></tr></table></div><div class=\"tbl wide\"><table><tr><td colspan=\"3\"><p><strong>نام و نام خانوادگی داور اول منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p><p><strong>نام و نام خانوادگی داور دوم منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p><p><strong>نام و نام خانوادگی داور سوم منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p></td></tr><tr><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>مدیر پژوهش‌سرای دانش‌آموزی مجری</strong></p><p><strong>تاریخ و امضا</strong></p></td><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>مدیر پژوهش‌سرای قطب استانی نجوم و فناوری‌های فضایی</strong></p><p><strong>تاریخ و امضا</strong></p></td><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>کارشناس امور پژوهش‌سراهای دانش‌آموزی</strong></p><p><strong>تاریخ و امضا</strong></p></td></tr><tr><td colspan=\"3\"><p><strong>راهنمای داوری:</strong></p><p>۱- امتیاز هر ردیف بر اساس کیفیت، واقعی بودن و اثربخشی فعالیت داده می‌شود، نه شمارش تعداد موارد؛ یک فعالیت باکیفیت و مستند می‌تواند امتیاز بیشتری از چند برنامه کم‌محتوا کسب کند.</p><p>۲- فعالیتی که شاهدی بر اجرای واقعی آن وجود نداشته باشد امتیازی نمی‌گیرد. انتشار مجدد محتوای دیگران، فعالیت انجمن محسوب نمی‌شود.</p><p>۳- در ردیف‌های ۲، ۴، ۵ و ۶، اگر همه فعالیت‌های یک ردیف به‌صورت مجازی اجرا شده باشند، حداکثر نیمی از امتیاز آن ردیف قابل احتساب است.</p><p>۴- در ردیف ۳، عدم رؤیت هلال به دلیل شرایط جوی یا نجومی، به شرط برنامه‌ریزی، اجرا و ثبت درست، موجب کسر امتیاز نمی‌شود.</p><p>۵- هر فعالیت فقط در یک ردیف امتیاز می‌گیرد.</p><p>۶- ناتوانی اعضای تیم در توضیح فعالیت‌ها در مصاحبه، موجب کسر امتیاز از ردیف‌های مربوط می‌شود.</p></td></tr></table></div><p class=\"gh\"><strong>پیوست ت: جدول‌های گزارش فصل ۳ (انجمن علمی‌پژوهشی نجوم)</strong></p><p class=\"gh\"><strong>جدول ۳ـ۱: گزارش استهلال</strong></p><div class=\"tbl wide\"><table><tr><td colspan=\"3\"><p>نام و نام خانوادگی اعضای گروه رصد:</p></td></tr><tr><td><p>نام ماه قمری:</p></td><td><p>تاریخ شمسی استهلال:</p></td><td><p>تاریخ قمری استهلال:</p></td></tr><tr><td colspan=\"2\"><p>نام محل رصد و مختصات جغرافیایی (طول و عرض):</p></td><td><p>ارتفاع از سطح دریا (متر):</p></td></tr><tr><td colspan=\"2\"><p>وضعیت افق (صاف، غبار رقیق، غبار تیره و ...):</p></td><td><p>وضعیت جوی (صاف، نیمه‌ابری، ابری و ...):</p></td></tr><tr><td><p>ساعت شروع رصد:</p></td><td><p>ساعت پایان رصد:</p></td><td><p>تعداد شرکت‌کنندگان:</p></td></tr><tr><td colspan=\"3\"><p>نرم‌افزار یا منبع محاسبه:</p></td></tr></table></div><div class=\"tbl wide\"><table><tr><td><p><strong>ردیف</strong></p></td><td><p><strong>ویژگی</strong></p></td><td><p><strong>مقدار / واحد</strong></p></td></tr><tr><td><p>۱</p></td><td><p>سن ماه</p></td><td><p>ساعت / روز</p></td></tr><tr><td><p>۲</p></td><td><p>درصد روشنایی (فاز ماه)</p></td><td><p>درصد</p></td></tr><tr><td><p>۳</p></td><td><p>ارتفاع هلال ماه</p></td><td><p>درجه</p></td></tr><tr><td><p>۴</p></td><td><p>اختلاف سمت ماه و خورشید</p></td><td><p>درجه</p></td></tr><tr><td><p>۵</p></td><td><p>ضخامت بخش میانی هلال</p></td><td><p>دقیقه قوسی</p></td></tr><tr><td><p>۶</p></td><td><p>جدایی زاویه‌ای ماه و خورشید</p></td><td><p>درجه</p></td></tr><tr><td><p>۷</p></td><td><p>زمان محاسباتی غروب خورشید</p></td><td><p>ساعت و دقیقه</p></td></tr><tr><td><p>۸</p></td><td><p>زمان محاسباتی غروب ماه</p></td><td><p>ساعت و دقیقه</p></td></tr><tr><td><p>۹</p></td><td><p>مکث هلال ماه</p></td><td><p>ساعت و دقیقه</p></td></tr><tr><td><p>۱۰</p></td><td><p>زمان مشاهده‌ای غروب خورشید</p></td><td><p>ساعت و دقیقه</p></td></tr><tr><td><p>۱۱</p></td><td><p><strong>نتیجه رصد</strong></p></td><td><p>رؤیت شد ☐ رؤیت نشد ☐</p></td></tr><tr><td><p>۱۲</p></td><td><p>روش رؤیت (و مشخصات ابزار)</p></td><td><p>چشم غیرمسلح ☐ دوربین دوچشمی ☐ تلسکوپ ☐</p></td></tr><tr><td><p>۱۳</p></td><td><p>زمان اولین رؤیت هلال</p></td><td><p>ساعت و دقیقه</p></td></tr><tr><td><p>۱۴</p></td><td><p>ارتفاع هلال در زمان اولین رؤیت</p></td><td><p>درجه</p></td></tr><tr><td><p>۱۵</p></td><td><p>زمان آخرین رؤیت هلال</p></td><td><p>ساعت و دقیقه</p></td></tr><tr><td><p>۱۶</p></td><td><p>ارتفاع هلال در زمان آخرین رؤیت</p></td><td><p>درجه</p></td></tr><tr><td><p>۱۷</p></td><td><p><strong>مقایسه پیش‌بینی و مشاهده؛ عوامل اثرگذار</strong></p></td><td></td></tr></table></div><p><strong>تذکر ۱:</strong> کمیت‌های ردیف ۱ تا ۶ برای لحظه محاسباتی غروب خورشید نوشته شوند.</p><p><strong>تذکر ۲:</strong> در صورت عدم رؤیت، ردیف‌های ۱۳ تا ۱۶ خالی می‌ماند و ردیف ۱۷ با دقت بیشتری تکمیل می‌شود.</p><p><strong>تذکر ۳:</strong> یک عکس از محل رصد و افق غربی، همراه با پلاکارد مشخصات برنامه، ضمیمه شود.</p><p class=\"gh\"><strong>جدول ۳ـ۲: گزارش اجرای فعالیت</strong></p><div class=\"tbl wide\"><table><tr><td><p>عنوان فعالیت:</p></td><td><p>ردیف مربوط در نمون‌برگ ۲:</p></td></tr><tr><td><p>تاریخ و ساعت:</p></td><td><p>مکان:</p></td></tr><tr><td><p>نوع اجرا: حضوری ☐ مجازی ☐</p></td><td><p>گروه مخاطب و تعداد شرکت‌کنندگان:</p></td></tr><tr><td colspan=\"2\"><p>هدف فعالیت:</p></td></tr><tr><td colspan=\"2\"><p>مسئولان اجرا از اعضای انجمن و نقش هر یک:</p></td></tr><tr><td colspan=\"2\"><p>شرح مختصر اجرا:</p></td></tr><tr><td colspan=\"2\"><p>نتیجه و بازخورد مخاطبان:</p></td></tr><tr><td colspan=\"2\"><p>شواهد پیوست (تصویر، فیلم، فهرست حضور، نمونه محتوا، گواهی):</p></td></tr></table></div>", "mission": "<p class=\"gh\"><strong>۴ـ۱. مقدمه:</strong></p><p>سه، دو، یک، پرتاب! در اتاق کنترل هر مأموریت فضایی، این چند ثانیه حاصل ماه‌ها طراحی، محاسبه و آزمون است. پرتابگر باید پایدار اوج بگیرد، بوسترها در لحظه درست جدا شوند، محموله سالم به مقصد برسد و در پایان، کپسول مأموریت با چتر یا سامانه‌ای دیگر آرام و سالم به زمین بازگردد. یک خطای کوچک در هر مرحله می‌تواند کل مأموریت را ناکام بگذارد؛ و همین است که مهندسی فضا را هیجان‌انگیز می‌کند.</p><p>در گرایش «مأموریت فضایی»، شما و هم‌تیمی‌هایتان یک <strong>تیم مأموریت</strong> هستید. مأموریت شما این است: یک محموله حساس، یعنی <strong>تخم‌مرغ خام</strong>، را درون کپسول مأموریت با یک <strong>پرتابگر آبی</strong> به آسمان بفرستید و آن را <strong>سالم بازیابی کنید</strong>. در این مسیر، مراحل واقعی یک مأموریت فضایی را تجربه می‌کنید: تعریف مأموریت، طراحی، آزمون زمینی، پرتاب، جداسازی، فرود و تحلیل پس از پرواز.</p><p>مأموریت پایه به‌گونه‌ای طراحی شده که هر تیم مدرسه‌ای، حتی در دوره اول متوسطه، بتواند آن را اجرا کند. تیم‌هایی که چالش بیشتری می‌خواهند، می‌توانند مأموریت خود را با <strong>بوستر</strong>، <strong>جداسازی مراحل و کپسول</strong>، <strong>ارتفاع‌سنج</strong> و <strong>حسگرهای علمی</strong> توسعه دهند. بخش علمی کپسول از مسابقه بین‌المللی <strong>کن‌ست (CanSat)</strong> آژانس فضایی اروپا الهام گرفته است؛ مسابقه‌ای که در آن دانش‌آموزان یک ماهواره کوچک به اندازه قوطی نوشابه می‌سازند که پس از جدا شدن از موشک، در حین فرود با چتر داده‌های علمی را اندازه می‌گیرد.</p><p>پرتابگر آبی به فضا نمی‌رود؛ اما تصمیم‌هایی که شما می‌گیرید، همان تصمیم‌های مهندسان فضاست. در این گرایش، معیار موفقیت صرفاً بیشترین ارتفاع نیست؛ <strong>اجرای ایمن و هماهنگ مأموریت</strong><strong>، تحلیل‌ها و گزارش‌دهی </strong><strong>و</strong><strong> همچنین</strong><strong> بازگشت سالم محموله</strong> است.</p><p>در مسیر رشد دانش‌آموز در مسابقات (بند «پ» بخش اول)، این گرایش در گام «مهارت‌ورزی» قرار دارد: تمرکز آن بر مهارت‌های طراحی، ساخت، آزمون و اجرای ایمن یک مأموریت است.</p><p class=\"gh\"><strong>۴ـ۲. شرایط شرکت‌کنندگان:</strong></p><p>تمام دانش‌آموزان <strong>دوره‌های اول و دوم متوسطه</strong> می‌توانند <strong>به‌صورت تیم دو یا سه‌نفره</strong> در این گرایش شرکت‌کنند. شرایط مشترک ثبت‌نام و تیم‌ها در بند «ت» بخش اول آمده است.</p><p class=\"gh\"><strong>۴ـ۳. شرایط اختصاصی اثر:</strong></p><p><strong>۴ـ۳ـ۱. مأموریت پایه (الزامی):</strong> تیم یک تخم‌مرغ خام را درون کپسول مأموریت با پرتابگر آبی به ارتفاع می‌رساند و آن را با یک سامانه بازیابی سالم به زمین بازمی‌گرداند.</p><div class=\"tbl wide\"><table><tr><td><p><strong>جزء</strong></p></td><td><p><strong>الزامات</strong></p></td></tr><tr><td><p><strong>پرتابگر</strong></p></td><td><p>بدنه تحت فشار از بطری پلاستیکی نوشابه گازدار (PET) سالم؛ پیشران فقط آب و هوای فشرده؛ دارای بالک و پایداری پروازی مناسب.</p></td></tr><tr><td><p><strong>کپسول مأموریت</strong></p></td><td><p>دو بخش مجزا: بخش محموله برای تخم‌مرغ و بخش تجهیزات (الکترونیک، باتری یا وزنه معادل). درِ کپسول در طول پرتاب کاملاً مهار باشد. ضربه‌گیری با طراحی داخلی کپسول انجام شود و پوشاندن مستقیم تخم‌مرغ (با چسب، رنگ و مانند آن) مجاز نیست.</p></td></tr><tr><td><p><strong>سامانه بازیابی</strong></p></td><td><p>چتر نجات، نوار کندکننده، سازه جاذب انرژی یا هر سامانه‌ای که سرعت فرود را کاهش دهد؛ سرعت فرود ۳ تا ۶ متر بر ثانیه برای کپسول محموله توصیه می‌شود.</p></td></tr><tr><td><p><strong>سکوی پرتاب</strong></p></td><td><p>پایدار و مقاوم، با فشارسنج، ضامن ایمنی و رهاساز از راه دور.</p></td></tr><tr><td><p><strong>سنجش عملکرد</strong></p></td><td><p>برآورد ارتفاع اوج و زمان پرواز با روشی مستند (زاویه‌سنج از فاصله معلوم، تحلیل ویدئو یا حسگر ارتفاع).</p></td></tr></table></div><p><strong>۴ـ۳ـ۲. ماژول‌های تکمیلی (انتخابی و امتیازآور):</strong> تیم‌ها بر اساس توان و علاقه خود می‌توانند یک یا چند ماژول را به مأموریت بیفزایند. <strong>ساخت بوستر به همه تیم‌ها توصیه می‌شود</strong>؛ اما نبود هیچ‌یک از ماژول‌ها مانع شرکت در این گرایش نیست.</p><div class=\"tbl wide\"><table><tr><td><p><strong>ماژول</strong></p></td><td><p><strong>شرح</strong></p></td></tr><tr><td><p><strong>بوستر</strong></p></td><td><p>دو تا چهار محفظه تحت فشار جانبی که همزمان با پرتابگر اصلی عمل کنند؛ پرتابگر دو یا چند مرحله‌ای نیز در این ماژول جای می‌گیرد.</p></td></tr><tr><td><p><strong>جداسازی بوسترها یا مراحل</strong></p></td><td><p>جدا شدن بوسترها یا مرحله اول در حین پرواز، بدون برخورد و آسیب، و بازگشت ایمن قطعات جداشده.</p></td></tr><tr><td><p><strong>جداسازی کپسول محموله</strong></p></td><td><p>جدا شدن کپسول از بدنه پرتابگر و بازیابی مستقل کپسول و بدنه.</p></td></tr><tr><td><p><strong>سنجش و ثبت ارتفاع</strong></p></td><td><p>ثبت نمودار ارتفاع-زمان با حسگر فشار یا ارتفاع‌سنج و مقایسه با پیش‌بینی پیش از پرواز.</p></td></tr><tr><td><p><strong>مأموریت علمی کپسول (کن‌ست)</strong></p></td><td><p>اندازه‌گیری دما، فشار، رطوبت یا شتاب، تصویربرداری، یا ارسال داده به ایستگاه زمینی در حین پرواز و فرود.</p></td></tr><tr><td><p><strong>شبیه‌سازی و تحلیل</strong></p></td><td><p>پیش‌بینی عملکرد با محاسبه یا نرم‌افزار (مانند RasAero یا OpenRocket)، تحلیل پایداری و مقایسه با پرواز واقعی.</p></td></tr></table></div><p><strong>۴ـ۳ـ۳. سازوکار جداسازی و بازیابی:</strong> هر سازوکاری که طراحی سنجیده، اجرای مطمئن و مستندات روشن داشته باشد، پذیرفته است؛ از جمله سازوکارهای <strong>مکانیکی</strong> (جدا شدن دماغه در اوج، درِ فنری، تایمر مکانیکی، رهاسازی با کش)، <strong>الکتریکی</strong> (سروو یا آهنربای الکتریکی با فرمان میکروکنترلرهایی مانند Arduino و ESP بر اساس تایمر یا حسگر) و <strong>ترکیبی</strong>. سادگی و قابلیت اطمینان، به اندازه پیچیدگی ارزشمند است.</p><p><strong>۴ـ۳ـ۴. پرونده مأموریت:</strong> تیم مسیر مهندسی خود را در یک پرونده مأموریت مستند می‌کند که شامل این بخش‌هاست:</p><p>۱- <strong>تعریف مأموریت:</strong> هدف، ماژول‌های انتخابی و معیارهای موفقیت؛</p><p>۲- <strong>طراحی:</strong> طرح اجزا، فهرست جرم و محاسبات متناسب با دوره تحصیلی (مانند اندازه چتر، پایداری و برآورد ارتفاع)؛</p><p>۳- <strong>آزمون‌های زمینی:</strong> دست‌کم سه آزمون مستند، مانند آزمون فشار با بطری پر از آب، آزمون رهاسازی کپسول از ارتفاع و آزمون سازوکار جداسازی یا باز شدن چتر؛</p><p>۴- <strong>پروازها:</strong> گزارش همه پروازهای آزمایشی و رسمی و اصلاحات پس از هر پرواز؛</p><p>۵- <strong>تحلیل پس از پرواز:</strong> مقایسه پیش‌بینی با نتیجه، علت موفقیت یا شکست هر مرحله و درس‌آموخته‌ها.</p><p><strong>۴ـ۳ـ۵. پرواز رسمی:</strong> تیم یکی از پروازهای خود را به‌عنوان پرواز رسمی معرفی می‌کند. این پرواز باید در حضور مربی یا نماینده پژوهش‌سرا انجام و با یک <strong>ویدئوی پیوسته و بدون تدوین</strong>، از پر کردن هوا تا فرود و باز کردن کپسول و نمایش تخم‌مرغ سالم، ثبت شود. کاربرگ ثبت پرواز (پیوست ث در بخش سوم) توسط ناظر امضا می‌شود. در مراحل حضوری، داوران ممکن است پرتاب زنده درخواست کنند.</p><p><strong>۴ـ۳ـ۶. الزامات ایمنی:</strong> رعایت این الزامات شرط داوری است و نقض بندهای ستاره‌دار (*) موجب حذف اثر می‌شود و نقض سایر بندها، به تشخیص داوران، تا ۵ امتیاز از ردیف‌های ۴ و ۵ نمون‌برگ ۲ کسر می‌کند.</p><div class=\"tbl wide\"><table><tr><td><p><strong>حوزه</strong></p></td><td><p><strong>الزام</strong></p></td></tr><tr><td><p><strong>فشار </strong>*</p></td><td><p>حداکثر فشار مجاز در هر محفظه ۵ بار (حدود ۷۲ PSI)؛ فشارسنج سالم روی سکو الزامی است.</p></td></tr><tr><td><p><strong>محفظه تحت فشار </strong>*</p></td><td><p>فقط بطری PET نوشابه گازدار سالم. استفاده از بطری آسیب‌دیده، شیشه، فلز، محفظه دست‌ساز و هر ماده شیمیایی، آتش‌زا یا محترقه ممنوع است.</p></td></tr><tr><td><p><strong>رهاسازی و فاصله </strong>*</p></td><td><p>پر کردن هوا و رهاسازی از فاصله دست‌کم ۱.۵ متر (با شلنگ بلند و رهاساز از راه دور)؛ تماشاگران دست‌کم ۱۰ متر دورتر و پشت اپراتور. نزدیک شدن به پرتابگر تحت فشار ممنوع است.</p></td></tr><tr><td><p><strong>دماغه و بدنه</strong></p></td><td><p>دماغه نرم و غیرنوک‌تیز، اجزای بیرونی سبک و غیرفلزی و لبه بالک‌ها بدون تیزی.</p></td></tr><tr><td><p><strong>شرایط پرتاب</strong></p></td><td><p>فضای باز و خلوت، دور از خیابان و سیم برق؛ زاویه نزدیک به قائم و رو به دور از افراد؛ شمارش معکوس بلند؛ عینک ایمنی برای اپراتورها؛ باد ملایم.</p></td></tr><tr><td><p><strong>قطعات جداشونده</strong></p></td><td><p>هر قطعه جداشونده با چتر، نوار کندکننده یا مهار به بدنه با سرعت ایمن (کمتر از ۱۰ متر بر ثانیه) فرود آید.</p></td></tr><tr><td><p><strong>الکترونیک</strong></p></td><td><p>سیم‌کشی محکم و عایق، محافظت در برابر اتصال کوتاه، باتری کم‌حجم با محفظه مقاوم و کلید اصلی در دسترس.</p></td></tr></table></div><p><strong>تذکر ۱:</strong> آزمون فشار محفظه‌ها با بطری کاملاً پر از آب و پشت حفاظ انجام شود. همه پرتاب‌ها زیر نظر مربی انجام می‌شود.</p><p><strong>تذکر ۲:</strong> سازه باید از نظر ابعاد و استحکام قابلیت حمل یا ارسال به مراحل بالاتر را داشته باشد.</p><p><strong>تذکر ۳:</strong> استفاده از هوش مصنوعی در طراحی، برنامه‌نویسی یا نگارش، با ذکر صریح و ارسال پرامپت‌ها بلامانع است. به شرایط عمومی مسابقات در بند «ت» بخش اول شیوه‌نامه نیز توجه شود.</p><p class=\"gh\"><strong>۴ـ۴. مستندات موردنیاز اثر:</strong></p><p>علاوه بر مستندات مشترک همه گرایش‌ها (بند «ت» بخش اول)، مستندات زیر نیز در همان فایل فشرده (ZIP) ارسال گردد:</p><p>۱- در نمون‌برگ ۱ (شناسنامه اثر): در توضیحات ۱ چکیده مأموریت، در توضیحات ۲ ماژول‌های تکمیلی انتخاب‌شده و در توضیحات ۳ شرح مختصر نوآوری‌ها آورده شود.</p><p>۲- <strong>پرونده مأموریت</strong> در قالب PDF (حداکثر ۲۰ صفحه).</p><p>۳- <strong>فیلم گزارش مأموریت ۵ تا </strong><strong>۸</strong><strong> دقیقه‌ای</strong> با فرمت MP4 و حجم حداکثر ۱۲۰ مگابایت، شامل طراحی، ساخت، آزمون‌ها، پرواز و تحلیل؛ همه اعضا در ارائه سهم داشته باشند.</p><p>۴- <strong>ویدئوی پیوسته پرواز رسمی</strong><strong> حداکثر ۸ دقیقه (بدون تدوین) با فرمت MP4 و حجم حداکثر ۱۲۰ مگابایت</strong>. عدم ارسال یا ناواضح بودن این ویدئو موجب حذف اثر از داوری می‌شود.</p><p>۵- <strong>کاربرگ ثبت پرواز رسمی (پیوست ث در بخش سوم) با امضای</strong> مربی یا نماینده پژوهش‌سرا.</p><p>۶- فایل داده‌های حسگرها و متن برنامه‌ها (در صورت استفاده).</p><p>۷- پرامپت‌های استفاده‌شده در ابزارهای مبتنی بر هوش مصنوعی (در صورت استفاده).</p><p class=\"gh\"><strong>۴ـ۵. مراحل اجرایی (فرایند داوری):</strong></p><p><strong>۴ـ۵ـ۱. مرحله منطقه‌ای:</strong> تیم‌هایی که در سامانه ثبت‌نام نموده‌اند، آثار خود را در موعد مقرر (تقویم اجرایی، پیوست الف) به پژوهش‌سرای منطقه ارسال می‌نمایند. آثار در این مرحله، تحت نظارت معاونت آموزش متوسطه منطقه و توسط پژوهش‌سرای دانش‌آموزی منطقه، بر اساس نمون‌برگ ۲ داوری شده و برگزیدگان مطابق با سهمیه منطقه به مرحله استانی معرفی می‌گردند. لازم است پژوهش‌سرای منطقه پیش از معرفی، آثار برگزیده را برای رفع نقاط ضعف و تقویت نقاط قوت راهنمایی نماید.</p><p><strong>۴ـ۵ـ۲. مرحله اول استانی:</strong> آثار توسط قطب استانی نجوم و فناوری‌های فضایی، تحت نظارت کارشناس نظارت و پیگیری امور پژوهش‌سراهای دانش‌آموزی استان، بر اساس نمون‌برگ ۲ داوری می‌شوند. تیم‌ها در صورت صلاحدید داوران باید آمادگی ارسال یا ارائه سازه به قطب استانی را داشته باشند.</p><p><strong>۴ـ۵ـ۳. مرحله دوم استانی:</strong> شامل مصاحبه غیرحضوری (آنلاین) داوران با صاحبان اثر برای راستی‌آزمایی موارد مندرج در نمون‌برگ ۲ است و همه اعضای تیم باید به‌صورت همزمان شرکت نمایند. قطب استانی در صورت فراهم بودن شرایط، می‌تواند این مرحله را به‌صورت حضوری و همراه با پرتاب زنده برگزار نماید.</p><p><strong>۴ـ۵ـ۴. مرحله اول کشوری:</strong> آثار ارسالی از استان‌ها به‌صورت غیرحضوری و بر اساس نمون‌برگ ۲ ارزیابی می‌شوند و آثار منتخب با تأیید هیئت داوران به مرحله دوم کشوری راه می‌یابند.</p><p><strong>۴ـ۵ـ۵. مرحله دوم کشوری:</strong> شامل مصاحبه غیرحضوری (آنلاین) داوران با صاحبان اثر به همان شیوه مرحله دوم استانی است. در صورت برگزاری حضوری، پرتاب زنده مأموریت پایه در حضور داوران انجام و امتیاز ردیف‌های عملکرد بر اساس آن بازبینی می‌شود.</p><p class=\"gh\"><strong>۴ـ۶. نمون‌برگ داوری:</strong></p><p class=\"gh\"><strong>نمون‌برگ ۲: داوری غیرحضوری مأموریت فضایی</strong></p><div class=\"tbl wide\"><table><tr><td colspan=\"2\"><p><strong>عنوان اثر:</strong></p></td><td colspan=\"2\"><p><strong>کد ثبت‌شده اثر در سامانه:</strong></p></td></tr><tr><td><p><strong>استان:</strong></p></td><td><p><strong>شهر:</strong></p></td><td><p><strong>منطقه/ناحیه:</strong></p></td><td><p><strong>دوره تحصیلی:</strong></p></td></tr><tr><td><p><strong>نام و نام خانوادگی دانش‌آموزان</strong></p></td><td><p><strong>کد ملی</strong></p></td><td><p><strong>شماره تماس</strong></p></td><td><p><strong>پایه تحصیلی</strong></p></td></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr></table></div><div class=\"tbl wide\"><table><tr><td><p><strong>ردیف</strong></p></td><td><p><strong>معیار ارزیابی</strong></p></td><td><p><strong>حداکثر امتیاز</strong></p></td><td><p><strong>امتیاز کسب‌شده</strong></p></td><td><p><strong>توضیحات</strong></p></td></tr><tr><td colspan=\"5\"><p><strong>الف) مهندسی مأموریت (۲۷ امتیاز)</strong></p></td></tr><tr><td><p>۱</p></td><td><p><strong>تعریف مأموریت:</strong> روشنی هدف، الزامات، معیارهای موفقیت و معماری سامانه</p></td><td><p><strong>۷</strong></p></td><td></td><td></td></tr><tr><td><p>۲</p></td><td><p><strong>طراحی و محاسبات:</strong> طرح اجزا و محاسبات متناسب با دوره تحصیلی (پایداری، چتر، برآورد عملکرد)</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۳</p></td><td><p><strong>آزمون و بهبود:</strong> آزمون‌های زمینی و پروازهای آزمایشی مستند و اصلاح طرح بر اساس نتایج</p></td><td><p><strong>۱۱</strong></p></td><td></td><td></td></tr><tr><td colspan=\"5\"><p><strong>ب) اجرای مأموریت پایه (۳۶ امتیاز)</strong></p></td></tr><tr><td><p>۴</p></td><td><p><strong>پرتابگر: کیفیت ساخت و پایداری پرواز (۴)، ارتفاع اوج پرواز رسمی (۳)</strong></p></td><td><p><strong>۷</strong></p></td><td></td><td></td></tr><tr><td><p>۵</p></td><td><p><strong>سکوی پرتاب:</strong> پایداری، فشارسنج، ضامن ایمنی و رهاساز از راه دور</p></td><td><p><strong>۶</strong></p></td><td></td><td></td></tr><tr><td><p>۶</p></td><td><p><strong>سامانه بازیابی:</strong> فعال‌سازی به‌موقع و فرود کنترل‌شده محموله</p></td><td><p><strong>۱۰</strong></p></td><td></td><td></td></tr><tr><td><p>۷</p></td><td><p><strong>سلامت محموله:</strong> سالم ماندن تخم‌مرغ و کپسول مأموریت</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۸</p></td><td><p><strong>سنجش عملکرد: برآورد ارتفاع اوج و زمان پرواز با روش مستند (زاویه‌سنج، تحلیل ویدئو یا حسگر) و مقایسه با ارتفاع پیش‌بینی‌شده</strong></p></td><td><p><strong>۴</strong></p></td><td></td><td></td></tr><tr><td colspan=\"5\"><p><strong>پ) ماژول‌های تکمیلی (جمع حداکثر ۱۸ امتیاز)</strong></p></td></tr><tr><td><p>۹</p></td><td><p><strong>بوستر:</strong> بوسترهای جانبی یا پرتابگر دو یا چند مرحله‌ای با عملکرد همزمان و درست</p></td><td><p><strong>۷</strong></p></td><td></td><td></td></tr><tr><td><p>۱۰</p></td><td><p><strong>جداسازی بوسترها یا مراحل:</strong> جداسازی در پرواز و بازیابی ایمن قطعات</p></td><td><p><strong>۵</strong></p></td><td></td><td></td></tr><tr><td><p>۱۱</p></td><td><p><strong>جداسازی کپسول:</strong> جدا شدن کپسول از بدنه و بازیابی مستقل</p></td><td><p><strong>۶</strong></p></td><td></td><td></td></tr><tr><td><p>۱۲</p></td><td><p><strong>ثبت ارتفاع با حسگر: نمودار ارتفاع-زمان با حسگر فشار یا ارتفاع‌سنج و دقت آن</strong></p></td><td><p><strong>۴</strong></p></td><td></td><td></td></tr><tr><td><p>۱۳</p></td><td><p><strong>مأموریت علمی کپسول:</strong> حسگرها، تصویربرداری یا ارسال داده و تحلیل آن</p></td><td><p><strong>۴</strong></p></td><td></td><td></td></tr><tr><td><p>۱۴</p></td><td><p><strong>شبیه‌سازی:</strong> پیش‌بینی عملکرد و مقایسه با پرواز واقعی</p></td><td><p><strong>۳</strong></p></td><td></td><td></td></tr><tr><td colspan=\"5\"><p><strong>ت) ارائه و کار تیمی (۹ امتیاز)</strong></p></td></tr><tr><td><p>۱۵</p></td><td><p><strong>پرونده مأموریت و فیلم گزارش:</strong> کامل بودن، نظم و روشنی مستندات</p></td><td><p><strong>۵</strong></p></td><td></td><td></td></tr><tr><td><p>۱۶</p></td><td><p><strong>تسلط و کار تیمی:</strong> تسلط همه اعضا در مصاحبه و سهم مشخص هر عضو</p></td><td><p><strong>۴</strong></p></td><td></td><td></td></tr><tr><td colspan=\"5\"><p><strong>ث) سفر یادگیری (۱۰ امتیاز)</strong></p></td></tr><tr><td><p>۱۷</p></td><td><p><strong>سفر یادگیری آسمان‌نما: </strong>نمره کارنامه سفر یادگیری همین گرایش در برنامه آسمان‌نما (۰ تا ۱۰)، پس از راستی‌آزمایی کد QR؛ در آثار تیمی میانگین نمره اعضا</p></td><td><p><strong>۱۰</strong></p></td><td></td><td></td></tr><tr><td colspan=\"2\"><p><strong>جمع نهایی امتیاز</strong></p></td><td><p><strong>۱۰۰</strong></p></td><td></td><td></td></tr></table></div><div class=\"tbl wide\"><table><tr><td colspan=\"3\"><p><strong>نام و نام خانوادگی داور اول منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p><p><strong>نام و نام خانوادگی داور دوم منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p><p><strong>نام و نام خانوادگی داور سوم منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p></td></tr><tr><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>مدیر پژوهش‌سرای دانش‌آموزی مجری</strong></p><p><strong>تاریخ و امضا</strong></p></td><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>مدیر پژوهش‌سرای قطب استانی نجوم و فناوری‌های فضایی</strong></p><p><strong>تاریخ و امضا</strong></p></td><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>کارشناس امور پژوهش‌سراهای دانش‌آموزی</strong></p><p><strong>تاریخ و امضا</strong></p></td></tr><tr><td colspan=\"3\"><p><strong>راهنمای داوری:</strong></p><p>• جمع امتیاز ماژول‌های ۹ تا ۱۴ حداکثر ۱۸ است؛ تیمی که دو یا سه ماژول را به‌خوبی اجرا کند، می‌تواند امتیاز کامل این بخش را کسب کند.</p><p>• در ردیف‌های ۲ و ۳، عمق محاسبات و تحلیل متناسب با دوره تحصیلی تیم ارزیابی می‌شود.</p><p>• ارتفاع اوج پرواز رسمی تا ۳ امتیاز در ردیف ۴ دارد: کمتر از ۵ متر ۱ امتیاز، ۵ تا ۱۰ متر ۲ امتیاز و بیشتر از ۱۰ متر ۳ امتیاز. این امتیاز تنها در صورتی داده می‌شود که روش سنجش ارتفاع در کاربرگ ثبت پرواز درج شده و با ویدئوی پرواز سازگار باشد. نزدیکی ارتفاع برآوردشده به ارتفاع پیش‌بینی‌شده در ردیف ۸ ارزیابی می‌شود.</p><p>• سازوکار ساده و مطمئن، هم‌ارزش سازوکار پیچیده است؛ ملاک، اجرای درست و مستندسازی است.</p><p>• امتیاز ردیف‌های ۴ تا ۱۲ بر اساس ویدئوی پیوسته پرواز رسمی و کاربرگ ثبت پرواز، و امتیاز ردیف‌های ۱۳ و ۱۴ بر اساس پرونده مأموریت و فایل‌های داده داده می‌شود. نقض بندهای ستاره‌دار ایمنی موجب حذف اثر است. نقض سایر بندهای ایمنی، به تشخیص داوران، تا ۵ امتیاز از ردیف‌های ۴ و ۵ کسر می‌کند.</p></td></tr></table></div><p class=\"gh\"><strong>پیوست ث: کاربرگ ثبت پرواز فصل ۴ (مأموریت فضایی)</strong></p><p class=\"gh\"><strong>کاربرگ ثبت پرواز رسمی</strong></p><div class=\"tbl wide\"><table><tr><td colspan=\"2\"><p><strong>نام تیم / کد اثر:</strong></p></td><td colspan=\"2\"><p><strong>تاریخ و مکان پرتاب:</strong></p></td></tr><tr><td><p><strong>فشار پرتاب (بار):</strong></p></td><td><p><strong>حجم آب (میلی‌لیتر):</strong></p></td><td><p><strong>جرم پرتابگر (گرم):</strong></p></td><td><p><strong>وضعیت باد:</strong></p></td></tr><tr><td><p><strong>ارتفاع پیش‌بینی‌شده (متر):</strong></p></td><td><p><strong>ارتفاع ثبت‌شده (متر):</strong></p></td><td colspan=\"2\"><p><strong>روش سنجش ارتفاع:</strong></p></td></tr><tr><td><p><strong>زمان کل پرواز (ثانیه):</strong></p></td><td><p><strong>زمان فرود کپسول (ثانیه):</strong></p></td><td colspan=\"2\"><p><strong>ماژول‌های اجراشده:</strong></p></td></tr><tr><td colspan=\"2\"><p><strong>جداسازی بوستر/مرحله: موفق ☐ ناموفق ☐ ندارد ☐</strong></p></td><td colspan=\"2\"><p><strong>جداسازی کپسول: موفق ☐ ناموفق ☐ ندارد ☐</strong></p></td></tr><tr><td colspan=\"2\"><p><strong>بازیابی (باز شدن چتر/سامانه): موفق ☐ ناموفق ☐</strong></p></td><td colspan=\"2\"><p><strong>وضعیت تخم‌مرغ: سالم ☐ آسیب‌دیده ☐</strong></p></td></tr><tr><td colspan=\"4\"><p><strong>شرح کوتاه پرواز و رویدادهای غیرمنتظره:</strong></p></td></tr><tr><td colspan=\"2\"><p><strong>نام و امضای سرگروه:</strong></p></td><td colspan=\"2\"><p><strong>نام و امضای مربی / نماینده پژوهش‌سرا:</strong></p></td></tr></table></div>", "rasadi": "<p class=\"gh\"><strong>۵ـ۱. مقدمه:</strong></p><p>نجوم یکی از قدیمی‌ترین انگیزه‌های پیدایش و پیشرفت ریاضیات بوده است. از دوران باستان، نیاز به شناخت حرکت خورشید، ماه و ستارگان، تنظیم تقویم، تعیین زمان و جهت‌یابی، انسان را به اندازه‌گیری آسمان واداشت و بخش مهمی از هندسه و مثلثات در پیوند با همین محاسبات نجومی رشد کرد. ابزارهایی مانند اسطرلاب، ربع و سدس، و دانشمندانی چون خوارزمی، بیرونی و خواجه نصیرالدین طوسی، گواه پیوند دیرینه نجوم و ریاضیات‌اند.</p><p>در گرایش «نجوم رصدی و ریاضیات نجومی»، دانش‌آموز با یک ابزار نجومی، از تلسکوپ و دوربین دوچشمی تا ابزارهای نجوم قدیم، <strong>رصد می‌کند، یک کمیت را اندازه می‌گیرد، آن را با ریاضیات و فیزیک متناسب با پایه تحصیلی خود محاسبه می‌کند و نتیجه نجومی را تفسیر می‌کند.</strong> پیچیدگی فرمول‌ها به‌خودی‌خود امتیاز ندارد؛ آنچه اهمیت دارد پیوند معنادار میان اندازه‌گیری واقعی و محاسبه، و توانایی دانش‌آموز در توضیح نتیجه و خطای آن است.</p><p>در مسیر رشد دانش‌آموز در مسابقات (بند «پ» بخش اول)، این گرایش در گام «مهارت‌ورزی» قرار دارد و پلی به گام «پژوهشگری» است: مهارت کار با ابزار و اندازه‌گیری، با محاسبه، مقایسه با مقدار مرجع و تحلیل خطا، به یک کار پژوهشی کمّی تبدیل می‌شود.</p><p class=\"gh\"><strong>۵ـ۲. شرایط شرکت‌کنندگان:</strong></p><p>تمام دانش‌آموزان <strong>دوره‌های اول و دوم متوسطه</strong> می‌توانند <strong>به‌صورت تیم دو یا سه‌نفره</strong> در این گرایش شرکت‌کنند. شرایط مشترک ثبت‌نام و تیم‌ها در بند «ت» بخش اول آمده است.</p><p class=\"gh\"><strong>۵ـ۳. شرایط اختصاصی اثر:</strong></p><p><strong>۵ـ۳ـ۱. اجزای اثر:</strong> هر اثر باید سه جزء داشته باشد:</p><p>۱- <strong>رصد و اندازه‌گیری با ابزار نجومی:</strong> داده‌ای که خود تیم با تلسکوپ، دوربین دوچشمی، دوربین عکاسی یا ابزار نجومی (جدید یا قدیم) تولید کرده است.</p><p>۲- <strong>محاسبه:</strong> به‌کارگیری روابط ریاضی و فیزیکی متناسب با پایه تحصیلی، مانند نسبت و تناسب، زاویه، هندسه، مثلثات ساده و رسم نمودار.</p><p>۳- <strong>نتیجه و تفسیر:</strong> بیان معنای نجومی نتیجه، مقایسه با مقدار مرجع و تحلیل خطا.</p><p>گزارش رصد بدون تحلیل کمی، عکاسی صرف از اجرام، یا محاسبات بدون داده رصدی خود تیم، در این گرایش پذیرفته نیست.</p><p><strong>۵ـ۳ـ۲. ابزار:</strong> مشخصات ابزار در گزارش درج شود؛ برای تلسکوپ قطر دهانه، فاصله کانونی، چشمی و بزرگ‌نمایی، و برای ابزار دست‌ساز روش ساخت و مدرج کردن آن. در صورتی که ابزار به‌صورت امانی تهیه شده باشد، نام مرکز امانت‌دهنده نیز ذکر شود. تلسکوپ‌های کوچک آموزشی و دوربین‌های دوچشمی برای انجام پروژه‌های این گرایش کافی هستند.</p><p><strong>۵ـ۳ـ۳. نمونه پروژه‌های پیشنهادی:</strong> پروژه‌های زیر الگوی کار در این گرایش را نشان می‌دهند. تیم‌ها می‌توانند پروژه‌های دیگری با همین الگو طراحی کنند.</p><p class=\"gh\"><strong>الف) دوره تناوب قمرهای مشتری و قانون سوم کپلر</strong></p><p><strong>ابزار:</strong> تلسکوپ کوچک یا دوربین دوچشمی پرقدرت روی سه‌پایه.</p><p><strong>روش:</strong> در دست‌کم ۶ شب، و در هر شب دست‌کم دو تا سه بار با فاصله‌ی ۱ تا ۲ ساعت، موقعیت چهار قمر گالیله‌ای (آیو، اروپا، گانیمد و کالیستو) نسبت به مشتری رسم یا عکاسی می‌شود. فاصله هر قمر از مرکز مشتری بر حسب قطر ظاهری مشتری اندازه‌گیری و با زمان رصد در جدول ثبت می‌شود. برای شناسایی نام قمرها می‌توان از نرم‌افزارهای نجومی کمک گرفت.</p><p><strong>محاسبه:</strong> با رسم نمودار فاصله-زمان برای هر قمر، یک منحنی رفت‌وبرگشتی به دست می‌آید. فاصله در یک سمت مثبت و در سمت دیگر منفی است. فاصله دو بیشینه پیاپی، دوره تناوب (T) و بیشینه فاصله، شعاع مدار (a) قمر است. سپس نسبت زیر برای قمرها مقایسه می‌شود؛ ثابت بودن این نسبت همان قانون سوم کپلر است:</p><p>T² / a³ = constant</p><p>در دوره دوم متوسطه، با تبدیل a به متر (با ضرب کردن a بر حسب قطر مشتری در قطر واقعی مشتری، حدود ۱۴۳٬۰۰۰ کیلومتر) و T به ثانیه، جرم مشتری نیز از رابطه زیر قابل محاسبه است. دراین رابطه جرم بر حسب کیلوگرم است:</p><p>M = 4π² a³ / (G T²)</p><p><strong>خروجی:</strong> جدول و نمودار حرکت قمرها، دوره تناوب و شعاع مداری هر قمر، آزمون قانون سوم کپلر و مقایسه با مقادیر مرجع.</p><p class=\"gh\"><strong>ب) اندازه‌گیری ارتفاع کوه‌های ماه (روش گالیله)</strong></p><p><strong>ابزار:</strong> تلسکوپ کوچک و تلفن همراه برای عکاسی از پشت چشمی.</p><p><strong>روش:</strong> در روزهای نزدیک به تربیع ماه، در نزدیکی مرز روشنایی و تاریکی (خط پایانه)، نوک برخی کوه‌ها در بخش تاریک روشن دیده می‌شود؛ زیرا نور خورشید پیش از دامنه، به قله می‌رسد. از ماه عکس گرفته می‌شود و با دانستن قطر ماه (حدود ۳۴۷۴ کیلومتر)، مقیاس تصویر (کیلومتر بر هر میلی‌متر یا پیکسل) تعیین می‌شود. برای این منظور باید قطر ماه در تصویر را بر حسب پیکسل یا میلی متر، در یک نرم افزار گرافیکی (مانند Paint) بدست آورده و سپس با نوشتن یک تناسب ساده، طول واقعی هر پیکسل یا هر میلی متر از تصویر که همان مقیاس تصویر است، پیدا خواهد شد. در ادامه، فاصله قله روشن از خط پایانه (d) روی تصویر اندازه‌گیری و با ضرب در مقیاس تصویر، به کیلومتر تبدیل می‌شود. البته بهتر است قله یک کوه نزدیک به مرکز قرص را در نظر بگیرید.</p><p><strong>محاسبه:</strong> پرتو خورشید که به‌صورت مماس بر سطح ماه از خط پایانه می‌گذرد، به نوک کوه می‌رسد. با قضیه فیثاغورس و برای کوه‌های کم‌ارتفاع نسبت به شعاع ماه (R ≈ ۱۷۳۷ km)، ارتفاع کوه به‌طور تقریبی چنین است:</p><p>h ≈ d² / (2R)</p><p><strong>در این رابطه، d و R هر دو بر حسب کیلومتر هستند و ارتفاع کوه (h) نیز بر حسب کیلومتر به دست می‌آید. ارتفاع به‌دست‌آمده معمولاً بین ۱ تا ۵ کیلومتر است؛ چون d در رابطه به توان دو می‌رسد، خطای کوچک در اندازه‌گیری d خطای بزرگ‌تری در h ایجاد می‌کند.</strong></p><p><strong>خروجی:</strong> تصاویر رصدی، مقیاس تصویر، جدول اندازه‌گیری‌ها، ارتفاع چند کوه و مقایسه با مقادیر مرجع.</p><p class=\"gh\"><strong>پ) دوره چرخش خورشید با رصد لکه‌های خورشیدی</strong></p><p><strong>ابزار:</strong> تلسکوپ کوچک با صفحه تصویر (روش تصویر کردن تصویر خورشید روی کاغذ سفید پشت چشمی) یا فیلتر استاندارد خورشیدی.</p><p><strong>روش:</strong> در چند روز متوالی و در ساعت تقریباً یکسان، تصویر قرص خورشید روی کاغذ با دایره‌ای ثابت رسم و محل لکه‌ها علامت‌گذاری می‌شود. جابه‌جایی یک لکه یا گروه لکه از لبه تا مرکز قرص یا در عرض قرص دنبال می‌شود.</p><p><strong>محاسبه:</strong> از روی جابه‌جایی لکه در هر روز، تعداد روزهای لازم برای یک دور کامل چرخش (P) برآورد می‌شود. برای مثال، اگر لکه در مدت n روز از لبه شرقی به لبه غربی برسد (نیم دور)، دوره چرخش حدود 2n روز است. بهتر است لکه‌ای که برای بررسی انتخاب می‌کنید، نزدیک به استوای خورشید باشد.</p><p><strong>خروجی:</strong> نقشه‌های روزانه قرص خورشید، جدول موقعیت لکه‌ها، دوره چرخش برآوردشده و مقایسه با مقدار مرجع (حدود ۲۷ روز برای چرخش ظاهری از دید زمین).</p><p class=\"gh\"><strong>ت) دوره تناوب ستاره متغیر رأس‌الغول</strong></p><p><strong>ابزار:</strong> چشم غیرمسلح یا دوربین دوچشمی، همراه با نقشه ستارگان مقایسه؛ برای دقت بیشتر، عکاسی با دوربین روی سه‌پایه.</p><p><strong>روش:</strong> رأس‌الغول (بتا برساوش) یک ستاره دوتایی گرفتی است که هر چند روز یک‌بار، برای چند ساعت کم‌نور می‌شود. در شب‌های مختلف، درخشندگی آن با چند ستاره هم‌جوار با قدر معلوم مقایسه و قدر آن تخمین زده می‌شود. در شب‌هایی که کمینه نور پیش‌بینی شده است، اندازه‌گیری در فواصل کوتاه (مثلاً هر ۱۵ دقیقه) تکرار می‌شود.</p><p><strong>محاسبه:</strong> با رسم نمودار قدر-زمان (منحنی نور)، زمان کمینه‌ها تعیین و فاصله زمانی میان دو یا چند کمینه، دوره تناوب ستاره محاسبه می‌شود.</p><p><strong>خروجی:</strong> جدول تخمین قدرها، منحنی نور، دوره تناوب برآوردشده و مقایسه با مقدار مرجع (حدود ۲٫۸۷ روز).</p><p class=\"gh\"><strong>ث) سرعت حرکت ماه به دور زمین</strong></p><p><strong>ابزار:</strong> دوربین دوچشمی یا دوربین عکاسی روی سه‌پایه.</p><p><strong>روش:</strong> موقعیت ماه نسبت به یک یا چند ستاره نزدیک به آن، در ابتدا و انتهای یک بازه چندساعته رسم یا عکاسی می‌شود. برای نتایج دقیق‌تر، رصدها زمانی انجام شود که ماه ارتفاع زیادی در آسمان دارد؛ بهترین حالت، دو رصد با فاصله‌ی زمانی برابر قبل و بعد از بالاترین ارتفاع ماه است. جابه‌جایی زاویه‌ای ماه با استفاده از قطر ظاهری ماه (حدود نیم درجه) یا مقیاس تصویر اندازه‌گیری می‌شود.</p><p><strong>محاسبه:</strong> از جابه‌جایی زاویه‌ای در مدت معلوم، آهنگ حرکت ماه (درجه بر ساعت) به دست می‌آید. دوره گردش ماه از تقسیم ۳۶۰ درجه بر این آهنگ، و با دانستن فاصله ماه (r ≈ ۳۸۴,۰۰۰ km)، سرعت مداری آن به دست می‌آید:</p><p>v = 2πr / T</p><p><strong>توجه: چون جابه‌جایی ماه نسبت به ستارگان اندازه‌گیری می‌شود، دوره به‌دست‌آمده دوره نجومی ماه (حدود ۲۷٫۳ روز) است، نه دوره هلالی (فاصله دو ماه نو، حدود ۲۹٫۵ روز)؛ مقایسه باید با ۲۷٫۳ روز انجام شود. سرعت مداری ماه حدود ۱ کیلومتر بر ثانیه است.</strong></p><p><strong>خروجی:</strong> تصاویر یا نقشه‌های موقعیت ماه، آهنگ حرکت، دوره گردش و سرعت مداری ماه و مقایسه با مقادیر مرجع.</p><p class=\"gh\"><strong>ج) اندازه‌گیری میدان دید تلسکوپ با زمان عبور ستاره</strong></p><p><strong>ابزار:</strong> تلسکوپ با یک یا چند چشمی.</p><p><strong>روش:</strong> یک ستاره نزدیک به استوای سماوی (مانند ستارگان کمربند شکارچی) در لبه میدان دید قرار داده می‌شود. موتور ردیابی خاموش و تلسکوپ ثابت نگه داشته می‌شود و زمان عبور ستاره از یک لبه تا لبه مقابل، با عبور از مرکز میدان، با زمان‌سنج اندازه‌گیری می‌شود. اندازه‌گیری چند بار تکرار و میانگین گرفته می‌شود.</p><p><strong>محاسبه:</strong> آسمان به دلیل چرخش زمین، در هر ثانیه حدود ۱۵ ثانیه قوسی (یک‌چهارم دقیقه قوسی) جابه‌جا می‌شود. بنابراین برای ستاره‌ای نزدیک به استوای سماوی:</p><p>FOV (arcmin) ≈ 0.25 × t (s)</p><p>میدان دید نظری نیز از تقسیم میدان دید ظاهری چشمی (درج‌شده روی چشمی) بر بزرگ‌نمایی به دست می‌آید.</p><p><strong>خروجی:</strong> میدان دید اندازه‌گیری‌شده برای هر چشمی، مقایسه با مقدار نظری و تحلیل خطا.</p><p class=\"gh\"><strong>چ) ساخت و کار با ابزارهای نجوم دوره اسلامی</strong></p><p><strong>ابزار:</strong> یکی از ابزارهای نجوم قدیم مانند اسطرلاب، ربع مجیب، ربع یا سدس که توسط تیم ساخته می‌شود.</p><p><strong>روش:</strong> تیم کارکرد ابزار و ریاضیات نهفته در آن را شرح می‌دهد، ابزار را می‌سازد و درجه‌بندی می‌کند. سپس با آن اندازه‌گیری واقعی انجام می‌دهد؛ مانند تعیین ارتفاع ستاره قطبی یا سایر ستارگان، تعیین ارتفاع خورشید از راه سایه (بدون نگاه به خورشید)، تعیین ساعت یا برآورد عرض جغرافیایی محل (ارتفاع ستاره قطبی تقریباً برابر عرض جغرافیایی است).</p><p><strong>خروجی:</strong> شرح ابزار و تاریخچه آن، مراحل ساخت و درجه‌بندی، جدول اندازه‌گیری‌ها، مقایسه با مقادیر مرجع و تحلیل دقت ابزار.</p><p><strong>تذکر:</strong> موضوعات دیگری با همین الگو (رصد با ابزار، اندازه‌گیری، محاسبه و تفسیر) نیز پذیرفته‌اند؛ مانند تغییر قطر ظاهری و فاز زهره، یا اندازه‌گیری قطر زاویه‌ای ماه در طول یک ماه قمری و ارتباط آن با فاصله ماه.</p><p><strong>۵ـ۳ـ۴. تحلیل خطا:</strong> اندازه‌گیری‌ها تا حد امکان تکرار شوند و نتیجه نهایی به‌صورت میانگین ارائه شود. نتیجه با مقدار مرجع مقایسه، درصد خطا محاسبه و منابع خطا (مانند دقت ابزار، زمان‌سنجی، شرایط جوی و خطای فرد رصدگر) بیان شوند.</p><p class=\"gh\"><strong>۵ـ۳ـ۵. ایمنی:</strong></p><p>• نگاه مستقیم به خورشید، با چشم غیرمسلح یا با هر ابزار نوری، ممنوع است. رصد خورشید فقط به روش تصویر کردن روی صفحه یا با فیلتر استاندارد خورشیدی و زیر نظر مربی مجاز است.</p><p>• رصدهای شبانه و میدانی با حضور مربی یا یکی از والدین و در محل امن انجام شود.</p><p><strong>تذکر ۱:</strong> استفاده از نرم‌افزارهای نجومی، محاسباتی و ابزارهای مبتنی بر هوش مصنوعی، به شرط ذکر صریح در گزارش، بلامانع است؛ اما این ابزارها نباید جای رصد، اندازه‌گیری و تحلیل دانش‌آموز را بگیرند.</p><p><strong>تذکر ۲:</strong> به شرایط عمومی مسابقات در بند «ت» بخش اول شیوه‌نامه توجه شود.</p><p class=\"gh\"><strong>۵ـ۴. مستندات موردنیاز اثر:</strong></p><p>علاوه بر مستندات مشترک همه گرایش‌ها (بند «ت» بخش اول)، مستندات زیر نیز در همان فایل فشرده (ZIP) ارسال گردد:</p><p>۱- در نمون‌برگ ۱ (شناسنامه اثر): در توضیحات ۱ پرسش پروژه، در توضیحات ۲ ابزار و کمیت اندازه‌گیری‌شده، و در توضیحات ۳ شرح مختصر نوآوری‌ها آورده شود.</p><p>۲- <strong>جدول ۵ـ۱ (طرح‌واره و گزارش رصد، پیوست ج در بخش سوم) تکمیل‌شده</strong>.</p><p>۳- <strong>گزارش نهایی</strong> در قالب Word و PDF، حداکثر در ۱۰ صفحه، شامل: پرسش پروژه، ابزار و روش، داده‌ها، رابطه‌های به‌کاررفته، محاسبات و نمودارها، نتیجه و تفسیر، تحلیل خطا و منابع.</p><p>۴- <strong>داده‌های خام</strong> شامل جدول اندازه‌گیری‌ها، تصاویر رصدی و فایل‌های محاسباتی.</p><p>۵- <strong>فیلم ۵ تا ۱۰ دقیقه‌ای</strong> با فرمت MP4 و حجم حداکثر ۱۵۰ مگابایت، شامل آماده‌سازی ابزار، رصد و اندازه‌گیری، محاسبه و نتیجه‌گیری. هر یک از اعضای تیم باید بخشی از توضیحات را بیان کنند.</p><p>۶- متن کدها و پرامپت‌های هوش مصنوعی استفاده‌شده (در صورت استفاده).</p><p class=\"gh\"><strong>۵ـ۵. مراحل اجرایی (فرایند داوری):</strong></p><p><strong>۵ـ۵ـ۱. مرحله منطقه‌ای:</strong> دانش‌آموزانی که در سامانه ثبت‌نام نموده‌اند، آثار خود را در موعد مقرر (تقویم اجرایی، پیوست الف) به پژوهش‌سرای منطقه ارسال می‌نمایند. آثار در این مرحله، تحت نظارت معاونت آموزش متوسطه منطقه و توسط پژوهش‌سرای دانش‌آموزی منطقه، بر اساس نمون‌برگ ۲ داوری شده و برگزیدگان مطابق با سهمیه منطقه به مرحله استانی معرفی می‌گردند. لازم است پژوهش‌سرای منطقه پیش از معرفی، آثار برگزیده را برای رفع نقاط ضعف و تقویت نقاط قوت راهنمایی نماید.</p><p><strong>۵ـ۵ـ۲. مرحله اول استانی:</strong> آثار توسط قطب استانی نجوم و فناوری‌های فضایی، تحت نظارت کارشناس نظارت و پیگیری امور پژوهش‌سراهای دانش‌آموزی استان، بر اساس نمون‌برگ ۲ داوری می‌شوند و تیم‌های دارای بالاترین امتیاز به مرحله بعد معرفی می‌گردند.</p><p><strong>۵ـ۵ـ۳. مرحله دوم استانی:</strong> شامل مصاحبه غیرحضوری (آنلاین) داوران با تیم برای راستی‌آزمایی موارد مندرج در نمون‌برگ ۲ است. لازم است همه اعضای تیم به‌صورت همزمان و بر اساس جدول زمان‌بندی قطب استانی شرکت نمایند. </p><p><strong>۵ـ۵ـ۴. مرحله اول کشوری:</strong> آثار ارسالی از استان‌ها به‌صورت غیرحضوری و بر اساس نمون‌برگ ۲ ارزیابی می‌شوند و آثار منتخب با تأیید هیئت داوران به مرحله دوم کشوری راه می‌یابند.</p><p><strong>۵ـ۵ـ۵. مرحله دوم کشوری:</strong> شامل مصاحبه غیرحضوری (آنلاین) داوران با تیم برای راستی‌آزمایی موارد مندرج در نمون‌برگ ۲ است. همه اعضای تیم باید همزمان و بر اساس جدول زمان‌بندی قطب کشوری شرکت نمایند. </p><p class=\"gh\"><strong>۵ـ۶. نمون‌برگ داوری:</strong></p><p class=\"gh\"><strong>نمون‌برگ ۲: داوری غیرحضوری نجوم رصدی و ریاضیات نجومی</strong></p><div class=\"tbl wide\"><table><tr><td colspan=\"2\"><p><strong>عنوان اثر:</strong></p></td><td colspan=\"2\"><p><strong>کد ثبت‌شده اثر در سامانه:</strong></p></td></tr><tr><td><p><strong>استان:</strong></p></td><td><p><strong>شهر:</strong></p></td><td><p><strong>منطقه/ناحیه:</strong></p></td><td><p><strong>دوره تحصیلی:</strong></p></td></tr><tr><td><p><strong>نام و نام خانوادگی اعضای تیم</strong></p></td><td><p><strong>کد ملی</strong></p></td><td><p><strong>شماره تماس</strong></p></td><td><p><strong>پایه تحصیلی</strong></p></td></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr></table></div><div class=\"tbl wide\"><table><tr><td><p><strong>ردیف</strong></p></td><td><p><strong>معیار ارزیابی</strong></p></td><td><p><strong>حداکثر امتیاز</strong></p></td><td><p><strong>امتیاز کسب‌شده</strong></p></td><td><p><strong>توضیحات</strong></p></td></tr><tr><td><p>۱</p></td><td><p><strong>طراحی پروژه:</strong> روشن بودن پرسش، تناسب کمیت و ابزار با هدف و پایه تحصیلی، و تکمیل صحیح جدول ۵ـ۱</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۲</p></td><td><p><strong>کیفیت رصد و اندازه‌گیری:</strong> اجرای واقعی رصد، انتخاب زمان و شرایط مناسب و تکرار اندازه‌گیری‌ها</p></td><td><p><strong>۱۳</strong></p></td><td></td><td></td></tr><tr><td><p>۳</p></td><td><p><strong>مهارت کار با ابزار نجومی:</strong> آماده‌سازی و تنظیم ابزار، و در صورت ساخت ابزار، کیفیت ساخت، درجه‌بندی و واسنجی آن</p></td><td><p><strong>۱۳</strong></p></td><td></td><td></td></tr><tr><td><p>۴</p></td><td><p><strong>ثبت و مستندسازی داده‌ها:</strong> کامل و منظم بودن داده‌های خام، زمان‌ها، واحدها و تصاویر رصدی</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۵</p></td><td><p><strong>صحت مفاهیم نجومی و فیزیکی:</strong> فهم درست پدیده و رابطه‌های به‌کاررفته</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۶</p></td><td><p><strong>کاربرد ریاضیات:</strong> انتخاب روش مناسب، دقت محاسبات و رسم نمودار متناسب با پایه تحصیلی</p></td><td><p><strong>۱۱</strong></p></td><td></td><td></td></tr><tr><td><p>۷</p></td><td><p><strong>نتیجه‌گیری و تفسیر نجومی:</strong> استخراج نتیجه از داده‌ها، بیان معنای نجومی آن و مقایسه با مقدار مرجع</p></td><td><p><strong>۹</strong></p></td><td></td><td></td></tr><tr><td><p>۸</p></td><td><p><strong>تحلیل خطا و محدودیت‌ها:</strong> محاسبه درصد خطا، شناسایی منابع خطا و پیشنهاد راه بهبود</p></td><td><p><strong>۸</strong></p></td><td></td><td></td></tr><tr><td><p>۹</p></td><td><p><strong>خلاقیت:</strong> نوآوری در طراحی پروژه، روش اندازه‌گیری یا ساخت ابزار</p></td><td><p><strong>۵</strong></p></td><td></td><td></td></tr><tr><td><p>۱۰</p></td><td><p><strong>ارائه و تسلط:</strong> کیفیت فیلم و گزارش، و تسلط همه اعضا بر روش و نتایج</p></td><td><p><strong>۴</strong></p></td><td></td><td></td></tr><tr><td><p>۱۱</p></td><td><p><strong>سفر یادگیری آسمان‌نما: </strong>نمره کارنامه سفر یادگیری همین گرایش در برنامه آسمان‌نما (۰ تا ۱۰)، پس از راستی‌آزمایی کد QR؛ در آثار تیمی میانگین نمره اعضا</p></td><td><p><strong>۱۰</strong></p></td><td></td><td></td></tr><tr><td colspan=\"2\"><p><strong>جمع نهایی امتیاز</strong></p></td><td><p><strong>۱۰۰</strong></p></td><td></td><td></td></tr></table></div><div class=\"tbl wide\"><table><tr><td colspan=\"3\"><p><strong>نام و نام خانوادگی داور اول منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p><p><strong>نام و نام خانوادگی داور دوم منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p><p><strong>نام و نام خانوادگی داور سوم منطقه‌ای/استانی/کشوری: .............................. مدرک تحصیلی: .................. شماره تماس: .................. امضا: ..........</strong></p></td></tr><tr><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>مدیر پژوهش‌سرای دانش‌آموزی مجری</strong></p><p><strong>تاریخ و امضا</strong></p></td><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>مدیر پژوهش‌سرای قطب استانی نجوم و فناوری‌های فضایی</strong></p><p><strong>تاریخ و امضا</strong></p></td><td><p><strong>نام و نام خانوادگی</strong></p><p><strong>کارشناس امور پژوهش‌سراهای دانش‌آموزی</strong></p><p><strong>تاریخ و امضا</strong></p></td></tr><tr><td colspan=\"3\"><p><strong>راهنمای داوری:</strong></p><p>۱- ریاضیات جایگزین رصد نیست، بلکه در خدمت فهم آن است. پروژه‌ای که رصد قوی ولی تحلیل ضعیف دارد، یا محاسبات گسترده ولی داده رصدی ضعیف، نمی‌تواند امتیاز کامل بگیرد.</p><p>۲- پیچیدگی فرمول‌ها به‌خودی‌خود امتیاز ندارد. ارزیابی ردیف ۶ متناسب با پایه تحصیلی اعضای تیم انجام شود.</p><p>۳- اثری که داده آن تولید خود تیم نباشد (صرفاً برگرفته از منابع یا نرم‌افزار)، در ردیف‌های ۲ تا ۴ امتیازی نمی‌گیرد.</p><p>۴- نزدیک بودن نتیجه به مقدار مرجع به‌تنهایی ملاک نیست؛ نتیجه‌ای که خطای آن به‌درستی تحلیل شده باشد، ارزشمند است.</p><p>۵- ناتوانی اعضای تیم در توضیح روش و محاسبات در مصاحبه، موجب کسر امتیاز از ردیف‌های مربوط می‌شود.</p></td></tr></table></div><p class=\"gh\"><strong>پیوست ج: طرح‌واره و گزارش رصد فصل ۵ (نجوم رصدی و ریاضیات نجومی)</strong></p><p class=\"gh\"><strong>جدول ۵ـ۱: طرح‌واره و گزارش رصد</strong></p><div class=\"tbl wide\"><table><tr><td colspan=\"2\"><p><strong>عنوان اثر:</strong></p></td><td colspan=\"2\"><p><strong>کد ثبت‌شده اثر در سامانه:</strong></p></td></tr><tr><td><p><strong>استان:</strong></p></td><td><p><strong>شهر:</strong></p></td><td><p><strong>منطقه/ناحیه:</strong></p></td><td><p><strong>دوره تحصیلی:</strong></p></td></tr><tr><td><p><strong>نام و نام خانوادگی اعضای تیم</strong></p></td><td><p><strong>کد ملی</strong></p></td><td><p><strong>شماره تماس</strong></p></td><td><p><strong>پایه تحصیلی</strong></p></td></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr></table></div><div class=\"tbl wide\"><table><tr><td colspan=\"2\"><p><strong>پرسش پروژه:</strong></p></td></tr><tr><td colspan=\"2\"><p><strong>جرم یا پدیده موردبررسی:</strong></p></td></tr><tr><td colspan=\"2\"><p><strong>کمیت یا کمیت‌های اندازه‌گیری‌شده و رابطه مورد استفاده:</strong></p></td></tr><tr><td><p><strong>تاریخ یا تاریخ‌های رصد:</strong></p></td><td><p><strong>ساعت آغاز و پایان رصد:</strong></p></td></tr><tr><td><p><strong>محل و مختصات جغرافیایی:</strong></p></td><td><p><strong>وضعیت جوی:</strong></p></td></tr><tr><td colspan=\"2\"><p><strong>مشخصات ابزار رصدی (قطر دهانه، فاصله کانونی، چشمی، بزرگ‌نمایی؛ یا روش ساخت و واسنجی ابزار دست‌ساز):</strong></p></td></tr><tr><td><p><strong>تعداد دفعات تکرار اندازه‌گیری:</strong></p></td><td><p><strong>مقدار مرجع برای مقایسه:</strong></p></td></tr><tr><td colspan=\"2\"><p><strong>شرح مختصر اجرای رصد و نقش هر یک از اعضای تیم:</strong></p></td></tr></table></div>", "data": "<p class=\"gh\"><strong>۶ـ۱. مقدمه:</strong></p><p>نجوم امروز بیش از هر زمان دیگری دانشی داده‌محور است. تلسکوپ‌های فضایی و زمینی هر روز حجم عظیمی از داده تولید می‌کنند؛ از منحنی‌های نور هزاران ستاره که تلسکوپ فضایی تس (TESS) ثبت می‌کند، تا تصاویر میلیون‌ها کهکشان از تلسکوپ فضایی اقلیدس (Euclid). مأموریت فضایی گایا (Gaia) نیز چهارمین مجموعه داده خود، که حاصل ۶۶ ماه رصد است، را در ۱۱ آذر ۱۴۰۵ (۲ دسامبر ۲۰۲۶) منتشر می‌کند؛ داده‌هایی که نقشه‌ای تازه از موقعیت، فاصله، رنگ و حرکت ستارگان کهکشان راه شیری ارائه می‌دهد.</p><p>بخش مهمی از این داده‌ها عمومی است و در دسترس همه قرار دارد. امروز داوطلبان و دانش‌آموزان در سراسر جهان، از راه پروژه‌های علم شهروندی، در پژوهش‌های واقعی نجومی سهیم‌اند. برای نمونه، داوطلبان پروژه «گلکسی زوی اقلیدس» با پاسخ دادن به پرسش‌هایی درباره شکل کهکشان‌ها در تصاویر اقلیدس، آن‌ها را دسته‌بندی می‌کنند و دسته‌بندی‌های آنان یک الگوریتم هوش مصنوعی را نیز آموزش می‌دهد. در برنامه «دیده‌بان سیارات فراخورشیدی» ناسا هم شرکت‌کنندگان، حتی بدون تلسکوپ، داده‌های آماده را تحلیل می‌کنند، منحنی نور گذر سیاره را می‌سازند و نتایج خود را در پایگاه داده مربوط بارگذاری می‌کنند.</p><p>گرایش «پژوهش و تحلیل داده‌های نجومی» دانش‌آموز را با همین شیوه کار علمی آشنا می‌کند. در این گرایش، دانش‌آموز:</p><p>۱- یک <strong>مقاله پایه</strong> را می‌خواند و پرسش، روش و نتیجه آن را می‌فهمد؛</p><p>۲- <strong>داده‌های واقعی نجومی</strong> را دریافت می‌کند؛ گاهی از بسته آماده قطب کشوری و گاهی از مسیر مشخصی در پایگاه‌های داده علمی؛</p><p>۳- داده‌ها را <strong>تحلیل</strong> می‌کند و با جدول، نمودار و محاسبه به نتیجه می‌رسد؛</p><p>۴- نتیجه خود را با مقاله پایه <strong>مقایسه و تفسیر</strong> می‌کند؛</p><p>۵- مسیر پژوهش خود را در قالب <strong>گزارش پژوهش</strong> و <strong>فیلم ارائه</strong> عرضه می‌کند.</p><p>هدف این گرایش، گذر از گردآوری عمومی اطلاعات به پژوهش واقعی است؛ یعنی طرح یک پرسش مشخص، کار با داده واقعی، تحلیل مستند و نتیجه‌گیری‌ای که بر پایه همان داده‌ها باشد.</p><p>در مسیر رشد دانش‌آموز در مسابقات (بند «پ» بخش اول)، این گرایش در گام «پژوهشگری» قرار دارد: دانش‌آموز با طرح پرسش، تحلیل داده واقعی و مقایسه نتایج با یافته‌های علمی، شیوه کار پژوهشگران را تجربه می‌کند.</p><p class=\"gh\"><strong>۶ـ۲. شرایط شرکت‌کنندگان:</strong></p><p>تمام دانش‌آموزان <strong>دوره‌های اول و دوم متوسطه</strong> می‌توانند <strong>به‌صورت انفرادی یا تیم دو یا سه‌نفره</strong> در این گرایش شرکت‌کنند. شرایط مشترک ثبت‌نام و تیم‌ها در بند «ت» بخش اول آمده است.</p><p class=\"gh\"><strong>۶ـ۳. شرایط اختصاصی اثر:</strong></p><p><strong>۶ـ۳ـ۱. بسته‌های پژوهشی:</strong> قطب کشوری نجوم و فناوری‌های فضایی، در آغاز سال تحصیلی، سه تا چهار <strong>بسته پژوهشی</strong> از طریق کانال رسمی قطب در پیام‌رسان‌های شاد، ایتا و بله و همچنین وب‌سایت قطب منتشر می‌کند. هر بسته شامل موارد زیر است:</p><p>• <strong>مقاله پایه:</strong> یک مقاله علمی یا ترویجی معتبر، همراه با خلاصه یا ترجمه فارسی آن؛</p><p>• <strong>داده‌ها:</strong> فایل داده آماده، یا راهنمای گام‌به‌گام دریافت داده از یک پایگاه داده علمی؛</p><p>• <strong>راهنمای تحلیل:</strong> معرفی مفاهیم لازم، روش تحلیل، یک نمونه حل‌شده و در صورت نیاز، قالب‌های آماده Excel؛</p><p>• <strong>پرسش‌های پیشنهادی:</strong> چند پرسش پژوهشی در سطوح مختلف؛</p><p class=\"gh\"><strong>• قالب گزارش.</strong></p><p>هر شرکت‌کننده یا تیم <strong>فقط یک بسته</strong> را انتخاب و پژوهش خود را بر پایه آن انجام می‌دهد.</p><p><strong>۶ـ۳ـ۲. نمونه بسته‌های پژوهشی:</strong> بسته‌های پژوهشی نهایی، هر سال توسط قطب کشوری نجوم و فناوری‌های فضایی آماده سازی و منتشر خواهند شد. در ادامه عناوین و ویژگی‌های چند بسته پژوهشی را برای نمونه می‌توانید مشاهده کنید.</p><div class=\"tbl wide\"><table><tr><td><p><strong>بسته</strong></p></td><td><p><strong>داده</strong></p></td><td><p><strong>نمونه تحلیل</strong></p></td><td><p><strong>نمونه پرسش پژوهش</strong></p></td></tr><tr><td><p><strong>الف) ستاره‌های دوتایی گرفتی</strong></p></td><td><p>منحنی نور چند ستاره دوتایی گرفتی از داده‌های عمومی تلسکوپ‌های فضایی (بسته آماده قطب)</p></td><td><p>تعیین دوره تناوب از زمان کمینه‌ها، عمق گرفت‌های اصلی و ثانویه و مدت گرفت</p></td><td><p>دوره تناوب و نسبت عمق دو گرفت در ستاره‌های مختلف چه تفاوتی دارد و درباره ستاره‌های سامانه چه می‌گوید؟</p></td></tr><tr><td><p><strong>ب) سیارات فراخورشیدی گذرنده</strong></p></td><td><p>منحنی نور گذر چند سیاره فراخورشیدی (بسته آماده قطب)</p></td><td><p>اندازه‌گیری عمق گذر و دوره تناوب؛ برآورد شعاع سیاره (شعاع سیاره ≈ شعاع ستاره × جذر عمق گذر)؛ برآورد شعاع مدار با قانون سوم کپلر</p></td><td><p>سیاره‌های بررسی‌شده از نظر اندازه به کدام سیاره منظومه شمسی شبیه‌ترند؟</p></td></tr><tr><td><p><strong>پ) ریخت‌شناسی کهکشان‌ها (گلکسی زو)</strong></p></td><td><p>دریافت داده از مسیر مشخص‌شده در پروژه گلکسی زو در سکوی زونیورس</p></td><td><p>دسته‌بندی مجموعه‌ای از کهکشان‌ها، مقایسه با دسته‌بندی جمعی ثبت‌شده، محاسبه درصد توافق و بررسی موارد دشوار</p></td><td><p>دسته‌بندی ما تا چه اندازه با دسته‌بندی جمعی همخوانی دارد؟ آیا نسبت کهکشان‌های مارپیچی و بیضوی در نمونه ما با مقاله پایه سازگار است؟</p></td></tr><tr><td><p><strong>ت) خوشه‌های ستاره‌ای با داده‌های گایا</strong></p></td><td><p>داده‌های یک خوشه ستاره‌ای باز از پایگاه داده گایا (بسته آماده یا مسیر دریافت)</p></td><td><p>رسم نمودار رنگ-قدر و برآورد فاصله خوشه از اختلاف منظر</p></td><td><p>نمودار رنگ-قدر خوشه چه چیزی درباره سن ستارگان آن می‌گوید؟</p></td></tr></table></div><p><strong>تذکر:</strong> در بسته‌هایی مانند «پ»، دانش‌آموز داده را خود و بر اساس مسیر تعیین‌شده در راهنمای بسته دریافت می‌کند؛ ثبت دقیق این مسیر (نشانی، تاریخ دریافت، فیلترها و تعداد داده‌ها) در گزارش الزامی است.</p><p><strong>۶ـ۳ـ۳. مراحل پژوهش:</strong> هر اثر باید مراحل زیر را طی کرده و در گزارش و فیلم نشان دهد:</p><p>۱- <strong>مطالعه مقاله پایه:</strong> فهم پرسش، داده، روش و نتیجه اصلی مقاله و بیان آن با زبان خود.</p><p>۲- <strong>طرح پرسش پژوهش:</strong> انتخاب یکی از پرسش‌های پیشنهادی بسته، یا طرح پرسشی تازه در چارچوب همان بسته.</p><p>۳- <strong>دریافت و شناخت داده‌ها:</strong> معرفی منبع داده، کمیت‌ها و واحدها، و تعداد داده‌ها.</p><p>۴- <str
